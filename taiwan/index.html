<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>台灣腳印日記</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fff3d6">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="sprites.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
/* ── 台灣夏日水果色系 ──
   芒果 #ffb627 · 西瓜 #ff5d5d · 芭樂 #58b368 · 荔枝粉 #f4538a
   鳳梨 #ffd23f · 奶白 #fffaf0 */
:root{
  --bg:#fff6e3;
  --panel:#fffaf0;
  --panel2:#fff0d4;
  --border:#f2cf8d;
  --border2:#e0b35e;
  --text:#5a4632;
  --muted:#b3946a;
  --accent:#ff5d5d;      /* 西瓜紅 */
  --accent2:#58b368;     /* 芭樂綠 */
  --mango:#ffb627;
  --pine:#ffd23f;
  --lychee:#f4538a;
  --px:'Silkscreen',monospace;
  --radius:8px;
}

body{
  background:var(--bg);
  font-family:var(--px);
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  overflow:hidden;
  color:var(--text);
}

/* ── 頂部標題列 */
.topbar{
  background:var(--panel);
  border-bottom:2px solid var(--border);
  padding:10px 14px;
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;z-index:1000;
}
.topbar-menu{font-size:16px;cursor:pointer;color:var(--muted);padding:2px 6px;}
.topbar-menu:active{color:var(--text);}
.topbar-title{font-size:11px;color:var(--text);letter-spacing:1px;flex:1;}
.topbar-members{display:flex;gap:6px;}
.member-avatar{
  width:30px;height:30px;border-radius:6px;
  border:2px solid var(--border);
  background:var(--panel2);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;
  image-rendering:pixelated;overflow:hidden;
}
.member-avatar.on{border-color:var(--accent);background:#ffe2e2;}
.member-avatar svg{width:100%;height:100%;image-rendering:pixelated;}

/* ── 側欄 */
.sidebar-overlay{
  position:fixed;inset:0;background:rgba(90,70,50,0.4);
  z-index:1500;opacity:0;pointer-events:none;transition:opacity .2s;
}
.sidebar-overlay.show{opacity:1;pointer-events:auto;}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:230px;
  background:var(--panel);
  border-right:2px solid var(--border);
  z-index:1600;transform:translateX(-100%);
  transition:transform .22s ease;
  display:flex;flex-direction:column;padding:16px 0;
}
.sidebar.show{transform:translateX(0);}
.sidebar-title{
  font-size:11px;letter-spacing:2px;color:var(--text);
  padding:6px 18px 14px;border-bottom:1px solid var(--border);margin-bottom:8px;
}
.sidebar-link{
  display:flex;align-items:center;gap:10px;
  padding:12px 18px;font-size:10px;color:var(--text);
  text-decoration:none;cursor:pointer;
}
.sidebar-link:active{background:var(--panel2);}
.sidebar-link .ico{font-size:14px;width:20px;text-align:center;}
.sidebar-foot{margin-top:auto;padding:12px 18px;font-size:8px;color:var(--muted);}

/* ── 主區域：手機直排、電腦左右排 */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.map-wrap{flex:1;position:relative;min-height:0;}
#map{width:100%;height:100%;}
#map.fruit .leaflet-tile-pane{filter:saturate(.9) sepia(.12) brightness(1.03);}
#map.dark .leaflet-tile-pane{filter:none;}

.map-fab{position:absolute;z-index:500;}
.map-fab.layers{bottom:80px;left:12px;}
.map-fab.checkin{bottom:16px;right:12px;}
.fab-btn{
  background:var(--panel);
  border:2px solid var(--border2);
  border-radius:var(--radius);
  padding:8px 14px;
  font-family:var(--px);font-size:10px;color:var(--text);
  cursor:pointer;display:flex;align-items:center;gap:6px;
  box-shadow:2px 2px 0 rgba(180,130,60,0.25);
}
.fab-btn.primary{
  background:var(--accent);border-color:#d84848;color:#fff;
  font-size:11px;padding:10px 18px;
}
.fab-btn:active{transform:translate(1px,1px);}

/* ── 圖層選單 */
.layers-menu{
  display:none;position:absolute;bottom:124px;left:12px;z-index:600;
  background:var(--panel);border:2px solid var(--border2);
  border-radius:var(--radius);box-shadow:3px 3px 0 rgba(180,130,60,0.25);
  padding:10px 12px;min-width:170px;
}
.layers-menu.show{display:block;}
.layers-section{font-size:8px;color:var(--muted);letter-spacing:1px;margin:8px 0 6px;}
.layers-section:first-child{margin-top:0;}
.layer-opt{
  display:flex;align-items:center;gap:8px;padding:6px 4px;
  font-size:9px;color:var(--text);cursor:pointer;
  user-select:none;-webkit-user-select:none;border-radius:4px;
}
.layer-opt:active{background:var(--panel2);}
.layer-check{
  width:14px;height:14px;flex-shrink:0;
  border:1.5px solid var(--border2);border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:#fff;background:var(--panel2);
}
.layer-opt.on .layer-check{background:var(--accent2);border-color:var(--accent2);}
.layer-opt.on .layer-check::after{content:'✓';}
.style-opt .layer-check{border-radius:50%;}
.style-opt.on .layer-check::after{content:'●';font-size:7px;}

/* ── 底部抽屜（手機）／右側欄（電腦） */
.card-drawer{
  background:var(--panel);
  border-top:2px solid var(--border);
  flex-shrink:0;display:flex;flex-direction:column;
  transition:height .3s ease;height:44px;overflow:hidden;z-index:500;
}
.card-drawer.expanded{height:55vh;}
.drawer-handle{
  height:44px;display:flex;align-items:center;
  padding:0 14px;cursor:pointer;flex-shrink:0;gap:10px;
  user-select:none;-webkit-user-select:none;
}
.drawer-pill{
  width:32px;height:4px;background:var(--border2);border-radius:2px;
  margin:0 auto;position:absolute;left:50%;transform:translateX(-50%);
}
.drawer-tabs{display:flex;gap:0;flex:1;overflow-x:auto;}
.dtab{
  font-family:var(--px);font-size:9px;padding:4px 10px;
  border:none;background:transparent;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;
}
.dtab.on{color:var(--accent);border-bottom-color:var(--accent);}
.drawer-count{font-size:10px;color:var(--muted);white-space:nowrap;}
.card-list{overflow-y:auto;flex:1;padding:8px;}

/* 電腦版：抽屜變右側面板 */
@media (min-width: 900px){
  .main{flex-direction:row;}
  .card-drawer{
    width:360px;height:auto !important;
    border-top:none;border-left:2px solid var(--border);
    order:2;
  }
  .drawer-pill{display:none;}
  .drawer-handle{cursor:default;}
  .map-wrap{order:1;}
}

/* ── 打卡卡片 */
.diary-card{
  display:flex;gap:10px;padding:10px;
  background:#fffdf7;border:1.5px solid var(--border);
  border-radius:var(--radius);margin-bottom:8px;cursor:pointer;
}
.diary-card:active{box-shadow:inset 0 0 0 2px var(--border2);}
.diary-thumb{
  width:56px;height:56px;border-radius:4px;
  border:1px solid var(--border);flex-shrink:0;
  background:var(--panel2);image-rendering:pixelated;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:24px;
}
.diary-thumb img,.diary-thumb svg{width:100%;height:100%;image-rendering:pixelated;}
.diary-info{flex:1;min-width:0;}
.diary-name{font-size:10px;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.diary-meta{display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap;}
.diary-tag{font-size:8px;padding:2px 6px;border-radius:3px;font-family:var(--px);white-space:nowrap;}
.tag-checkin{background:#ffe2e2;color:#d84848;border:1px solid #f8b0b0;}
.tag-wish{background:#ffe9f3;color:#e0407e;border:1px solid #f8b8d2;}
.tag-trip{background:#e2f4e6;color:#3a8a4a;border:1px solid #a8dcb4;}
.diary-date{font-size:8px;color:var(--muted);}
.diary-note{font-size:9px;color:var(--muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.diary-footer{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
.diary-comments{font-size:8px;color:var(--muted);}
.diary-author{width:20px;height:30px;flex-shrink:0;}
.diary-author svg{width:100%;height:100%;image-rendering:pixelated;}

/* ── Popup */
.px-popup{font-family:var(--px) !important;min-width:220px;}
.px-popup .leaflet-popup-content-wrapper{
  background:var(--panel);color:var(--text);
  border:2px solid var(--border2);border-radius:var(--radius);
  box-shadow:4px 4px 0 rgba(180,130,60,0.3);padding:0;
}
.px-popup .leaflet-popup-tip{background:var(--panel);border:1px solid var(--border2);}
.px-popup .leaflet-popup-content{margin:0;width:auto !important;}
.popup-inner{padding:12px 14px;}
.popup-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.popup-icon{width:28px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.popup-icon svg{width:100%;height:100%;image-rendering:pixelated;}
.popup-title{font-size:10px;color:var(--text);flex:1;}
.popup-img{
  width:100%;aspect-ratio:1;background:var(--panel2);
  border-radius:4px;border:1px solid var(--border);
  image-rendering:pixelated;margin-bottom:8px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.popup-img svg,.popup-img img{width:100%;height:100%;image-rendering:pixelated;object-fit:contain;}
.popup-note{font-size:9px;color:var(--text);line-height:1.6;margin-bottom:8px;}
.popup-actions{display:flex;gap:6px;margin-top:10px;border-top:1px solid var(--border);padding-top:8px;flex-wrap:wrap;}
.popup-action-btn{
  flex:1;padding:7px 6px;border:1px solid var(--border2);
  background:var(--panel2);font-family:var(--px);font-size:8px;
  color:var(--text);cursor:pointer;border-radius:4px;
  display:flex;align-items:center;justify-content:center;gap:4px;
  min-width:90px;
}
.popup-action-btn:active{background:var(--border);}
.popup-action-btn.go{background:#e2f4e6;border-color:#a8dcb4;color:#3a8a4a;}

/* ── Modal 共用 */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(90,70,50,0.45);z-index:2000;
  align-items:flex-end;justify-content:center;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:var(--panel);
  border-radius:12px 12px 0 0;border-top:2px solid var(--border2);
  width:100%;max-width:480px;max-height:90vh;overflow-y:auto;
}
@media (min-width:900px){
  .modal-overlay{align-items:center;}
  .modal-box{border:2px solid var(--border2);border-radius:12px;}
}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--panel);z-index:1;
}
.modal-title{font-size:11px;color:var(--text);letter-spacing:1px;}
.modal-close{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;}
.modal-body{padding:14px 16px;}

.step-row{margin-bottom:16px;}
.step-label{
  display:flex;align-items:center;gap:8px;
  font-size:9px;color:var(--muted);margin-bottom:8px;letter-spacing:1px;
}
.step-num{
  width:18px;height:18px;border-radius:50%;
  background:var(--mango);color:#fff;font-size:9px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

.type-row{display:flex;gap:8px;}
.type-chip{
  flex:1;padding:10px 6px;border:2px solid var(--border);
  border-radius:var(--radius);background:var(--panel2);
  font-family:var(--px);font-size:10px;color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.type-chip.on{border-color:var(--accent);background:#ffe2e2;color:#d84848;}

.location-card{
  border:1.5px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;display:flex;align-items:center;gap:10px;
  cursor:pointer;background:var(--panel2);
}
.location-card:active{background:var(--border);}
.location-name{font-size:10px;color:var(--text);flex:1;}
.location-coord{font-size:8px;color:var(--muted);}
.location-edit{font-size:16px;color:var(--muted);}

.name-input,.form-input{
  width:100%;background:#fffdf7;
  border:1.5px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;font-family:var(--px);font-size:10px;
  color:var(--text);outline:none;margin-top:8px;
}
.name-input:focus,.form-input:focus{border-color:var(--mango);}

.trip-select{
  width:100%;background:#fffdf7;
  border:1.5px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;font-family:var(--px);font-size:10px;
  color:var(--text);outline:none;appearance:none;
}

.member-grid{display:flex;gap:8px;flex-wrap:wrap;}
.member-choice{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 12px;border:2px solid var(--border);
  border-radius:var(--radius);cursor:pointer;background:var(--panel2);
  position:relative;min-width:70px;
}
.member-choice.on{border-color:var(--accent);background:#ffe2e2;}
.member-choice .check{
  position:absolute;top:-6px;right:-6px;width:16px;height:16px;
  background:var(--accent);border-radius:50%;
  display:none;align-items:center;justify-content:center;
  font-size:10px;color:#fff;
}
.member-choice.on .check{display:flex;}
.member-choice-avatar{width:32px;height:52px;image-rendering:pixelated;display:flex;align-items:center;justify-content:center;}
.member-choice-avatar svg{width:100%;height:100%;image-rendering:pixelated;}
.member-choice-name{font-size:8px;color:var(--text);}

.diary-textarea{
  width:100%;background:#fffdf7;
  border:1.5px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;font-family:var(--px);font-size:10px;
  color:var(--text);resize:none;height:90px;outline:none;line-height:1.6;
}
.diary-textarea:focus{border-color:var(--mango);}
.char-count{font-size:8px;color:var(--muted);text-align:right;margin-top:4px;}

.draw-preview-row{display:flex;gap:10px;align-items:center;}
.draw-thumb{
  width:64px;height:64px;border:2px solid var(--border);
  border-radius:6px;background:var(--panel2);
  image-rendering:pixelated;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;flex-shrink:0;
}
.draw-thumb svg{width:100%;height:100%;image-rendering:pixelated;}
.draw-edit-btn{
  flex:1;padding:10px;border:1.5px solid var(--mango);
  background:#fff3d6;color:#b07a10;
  font-family:var(--px);font-size:10px;border-radius:var(--radius);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
}
.draw-edit-btn:active{background:#ffe9b8;}

.submit-btn{
  width:100%;padding:14px;background:var(--accent);
  border:none;border-radius:var(--radius);color:#fff;
  font-family:var(--px);font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:8px;letter-spacing:1px;
}
.submit-btn:active{background:#d84848;}
.submit-btn:disabled{background:#dcc8a8;cursor:not-allowed;}

/* ── 旅程列表 */
.trip-item{
  border:1.5px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:8px;background:#fffdf7;cursor:pointer;
}
.trip-item.on{border-color:var(--accent2);background:#eefaf0;}
.trip-item-head{display:flex;align-items:center;gap:8px;}
.trip-item-name{font-size:10px;color:var(--text);flex:1;}
.trip-item-date{font-size:8px;color:var(--muted);}
.trip-item-meta{font-size:8px;color:var(--muted);margin-top:4px;line-height:1.6;white-space:pre-wrap;}
.trip-actions{display:flex;gap:6px;margin-top:8px;}
.trip-btn{
  flex:1;padding:6px;border:1px solid var(--border2);background:var(--panel2);
  font-family:var(--px);font-size:8px;color:var(--text);
  cursor:pointer;border-radius:4px;
}
.trip-btn.danger{color:#d84848;border-color:#f8b0b0;}
.add-trip-btn{
  width:100%;padding:12px;border:2px dashed var(--border2);
  background:transparent;color:var(--muted);
  font-family:var(--px);font-size:10px;border-radius:var(--radius);cursor:pointer;
}

/* ── 留言 */
.comment-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.comment-item:last-child{border-bottom:none;}
.comment-avatar{width:24px;height:40px;flex-shrink:0;image-rendering:pixelated;display:flex;align-items:center;justify-content:center;}
.comment-avatar svg{width:100%;height:100%;image-rendering:pixelated;}
.comment-body{flex:1;}
.comment-name{font-size:9px;color:var(--text);margin-bottom:3px;}
.comment-text{font-size:10px;color:var(--muted);line-height:1.6;}
.comment-time{font-size:8px;color:var(--border2);margin-top:3px;}
.comment-input-row{
  display:flex;gap:8px;padding:10px 16px;
  border-top:1px solid var(--border);
  position:sticky;bottom:0;background:var(--panel);
}
.comment-input{
  flex:1;background:#fffdf7;border:1.5px solid var(--border);
  border-radius:var(--radius);padding:8px 12px;
  font-family:var(--px);font-size:10px;color:var(--text);outline:none;
}
.comment-input:focus{border-color:var(--mango);}
.comment-send{
  padding:8px 14px;background:var(--accent);border:none;
  color:#fff;font-family:var(--px);font-size:10px;
  border-radius:var(--radius);cursor:pointer;
}

/* ── Leaflet 覆蓋 */
.leaflet-container{background:#ffeeC9 !important;}
.leaflet-control-zoom a{
  background:var(--panel) !important;color:var(--text) !important;
  border:1px solid var(--border2) !important;
  font-family:var(--px) !important;font-size:14px !important;
}
.leaflet-control-attribution{
  font-family:sans-serif;font-size:9px;
  background:rgba(255,250,240,0.8) !important;color:var(--muted) !important;
}
.leaflet-control-attribution a{color:var(--accent2) !important;}
.leaflet-marker-icon{transition:none !important;}

/* cluster：無泡泡，數字直接顯示在下方 */
.px-cluster{
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;
  image-rendering:pixelated;
  filter:drop-shadow(1px 1px 0 rgba(120,90,40,0.45));
}
.px-cluster-count{
  font-family:var(--px);font-size:9px;
  color:#fff;line-height:1;margin-top:2px;
  text-shadow:1px 1px 0 #8a6a3a,-1px 1px 0 #8a6a3a,1px -1px 0 #8a6a3a,-1px -1px 0 #8a6a3a;
}

/* ── iOS 觸控守則（畫板樣式由 shared/pixelpad.js 注入） */
html,body{overscroll-behavior:none;}
#map{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
#map *{-webkit-touch-callout:none;}
button,.fab-btn,.dtab,.member-avatar,.layer-opt,.type-chip,.diary-card,.trip-btn,.member-choice{touch-action:manipulation;}
.drawer-handle{touch-action:none;}
</style>
</head>
<body>

<!-- 頂部標題列 -->
<div class="topbar">
  <div class="topbar-menu" onclick="openSidebar()">☰</div>
  <div class="topbar-title" id="appTitle">台灣腳印日記</div>
  <div class="topbar-members" id="topbarMembers"></div>
</div>

<!-- 側欄 -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-title" id="sidebarTitle">台灣腳印日記</div>
  <a class="sidebar-link" href="index.html"><span class="ico">🐾</span>腳印地圖</a>
  <div class="sidebar-link" onclick="openTrips();closeSidebar();"><span class="ico">🧳</span>小旅程</div>
  <a class="sidebar-link" href="stats.html"><span class="ico">🍉</span>足跡回顧</a>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// ══════════════════════════════════════════
//  設定（防呆：逐欄位給預設值，config 缺欄位也不會壞）
// ══════════════════════════════════════════
const CFG_DEFAULTS = {
  appName:   '台灣腳印日記',
  apiBase:   '',
  r2Worker:  'https://worker-little-field-805c.xfish7.workers.dev',
  mapCenter: [23.7, 121.0],
  mapZoom:   8,
  members:   [{ name: '我', icon: '🐾', color: '#ff5d5d' }],
};
const RAW_CFG = window.TW_CONFIG || {};
const CFG = {};
for (const k in CFG_DEFAULTS) {
  CFG[k] = (RAW_CFG[k] !== undefined && RAW_CFG[k] !== null && RAW_CFG[k] !== '')
    ? RAW_CFG[k] : CFG_DEFAULTS[k];
}
if (!Array.isArray(CFG.members) || !CFG.members.length) CFG.members = CFG_DEFAULTS.members;
if (!Array.isArray(CFG.mapCenter) || CFG.mapCenter.length !== 2) CFG.mapCenter = CFG_DEFAULTS.mapCenter;

// ══════════════════════════════════════════
//  成員 sprite（沒綁定 FRAMES 就退回 emoji，不會壞版）
// ══════════════════════════════════════════
function spriteSvg(m) {
  const frames = window.SPRITES?.[m.spriteKey];
  if (frames?.[0]) {
    return `<svg viewBox="0 0 16 28" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;image-rendering:pixelated;display:block;">${frames[0]}</svg>`;
  }
  return `<span style="font-size:16px;">${m.icon||'📍'}</span>`;
}

// ══════════════════════════════════════════
//  狀態
// ══════════════════════════════════════════
let checkins = [];
let trips = [];
let filters = { checkin:true, wish:true };
const members = CFG.members;
let drawerOpen = false;
let currentTab = 'all';
let memberFilter = null;
let tripFilter = null;   // 旅程篩選（trip id）
let pendingCheckin = {};
let pendingWishId = null; // 想去 → 打卡轉換時，要移除的想去項目
let currentCommentId = null;
let pickingLocation = false;
let markers = {};
const isDesktop = () => window.matchMedia('(min-width:900px)').matches;

// ══════════════════════════════════════════
//  地圖
// ══════════════════════════════════════════
const map = L.map('map', {
  center: CFG.mapCenter,
  zoom: CFG.mapZoom,
  zoomControl: true,
});
const TILE_STYLES = {
  fruit: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  light: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  dark:  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
};
let tileLayer = L.tileLayer(TILE_STYLES.fruit, { attribution:'© OSM · CARTO', maxZoom:19 }).addTo(map);

function setMapStyle(style) {
  if (!TILE_STYLES[style]) return;
  tileLayer.setUrl(TILE_STYLES[style]);
  const el = document.getElementById('map');
  el.classList.toggle('fruit', style==='fruit');
  el.classList.toggle('dark', style!=='fruit');
  ['fruit','light','dark'].forEach(s =>
    document.getElementById('ls-'+s).classList.toggle('on', s===style));
}

const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 48,
  // 同座標多筆：點 cluster 在最大縮放時展開成一圈選項（spiderfy 圓輪）
  spiderfyOnMaxZoom: true,
  spiderfyDistanceMultiplier: 1.8,
  iconCreateFunction: cluster => {
    const children = cluster.getAllChildMarkers();
    const latest = children[children.length-1];
    const o = latest?.options || {};
    const count = cluster.getChildCount();
    let inner = '';
    if (o.svgData) {
      inner = `<svg width="36" height="36" viewBox="0 0 ${o.svgGrid||16} ${o.svgGrid||16}" style="image-rendering:pixelated;display:block;">${o.svgData}</svg>`;
    } else if (o.spriteHtml) {
      inner = `<div style="width:24px;height:36px;">${o.spriteHtml}</div>`;
    } else {
      inner = `<div style="font-size:18px;line-height:36px;">${o.fallbackIcon||'📍'}</div>`;
    }
    return L.divIcon({
      html:`<div class="px-cluster" style="width:44px;height:56px;">
        ${inner}
        <div class="px-cluster-count">${count}</div>
      </div>`,
      className:'', iconSize:[44,56], iconAnchor:[22,28],
    });
  }
});
map.addLayer(clusterGroup);
map.on('zoomend', () => renderMarkers());

map.on('click', e => {
  closeLayers();
  if (!pickingLocation) return;
  pendingCheckin.lat = e.latlng.lat;
  pendingCheckin.lng = e.latlng.lng;
  pickingLocation = false;
  map.getContainer().style.cursor = '';
  document.getElementById('locationName').textContent = `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
  document.getElementById('locationCoord').textContent = '點擊位置';
  document.getElementById('checkinModal').classList.add('show');
  checkSubmitReady();
});

// ══════════════════════════════════════════
//  Marker
// ══════════════════════════════════════════
function getMemberByName(name) {
  const m = members.find(mm=>mm.name===name);
  return { name, color:'#e0b35e', icon:'📍', ...(m||{}) };
}

function makeMarkerIcon(item, zoom) {
  const m = getMemberByName(item.who);
  if (zoom >= 10 && item.svgData) {
    const g = item.svgGrid || 16;
    return L.divIcon({
      html:`<div style="width:40px;height:40px;border:2px solid ${m.color};border-radius:4px;background:#fffaf0;overflow:hidden;box-shadow:2px 2px 0 rgba(180,130,60,0.3);image-rendering:pixelated;">
        <svg width="40" height="40" viewBox="0 0 ${g} ${g}" style="image-rendering:pixelated;display:block;">${item.svgData}</svg>
      </div>`,
      className:'', iconSize:[40,40], iconAnchor:[20,20],
    });
  }
  if (item.type==='wish') {
    return L.divIcon({
      html:`<div style="font-size:22px;line-height:1;filter:drop-shadow(1px 1px 0 rgba(180,130,60,0.4));">💗</div>`,
      className:'', iconSize:[28,28], iconAnchor:[14,14],
    });
  }
  return L.divIcon({
    html:`<div style="width:24px;height:40px;filter:drop-shadow(1px 1px 0 rgba(180,130,60,0.4));">${spriteSvg(m)}</div>`,
    className:'', iconSize:[24,40], iconAnchor:[12,38],
  });
}

function renderMarkers() {
  clusterGroup.clearLayers();
  markers = {};
  const zoom = map.getZoom();
  getVisible().forEach(item => {
    const m = getMemberByName(item.who);
    const marker = L.marker([item.lat, item.lng], {
      icon: makeMarkerIcon(item, zoom),
      memberColor: m.color,
      svgData: item.svgData,
      svgGrid: item.svgGrid || 16,
      spriteHtml: item.type==='checkin' ? spriteSvg(m) : null,
      fallbackIcon: item.type==='wish' ? '💗' : m.icon,
    }).bindPopup(() => buildPopupContent(item), { className:'px-popup', maxWidth:240 });
    markers[item.id] = marker;
    clusterGroup.addLayer(marker);
  });
  renderCards();
}

function typeMeta(t) {
  return t==='wish' ? { label:'想去', tag:'tag-wish', icon:'💗' }
       : { label:'打卡', tag:'tag-checkin', icon:'🐾' };
}

function tripById(id) { return trips.find(t=>t.id===id) || null; }
function tripChip(item) {
  const t = tripById(item.tripId);
  return t ? `<span class="diary-tag tag-trip">🧳 ${t.name}</span>` : '';
}

function itemImgHtml(item) {
  const g = item.svgGrid || 16;
  if (item.svgData) return `<div class="popup-img"><svg viewBox="0 0 ${g} ${g}" style="image-rendering:pixelated;width:100%;height:100%;">${item.svgData}</svg></div>`;
  if (item.imageUrl) return `<div class="popup-img"><img src="${item.imageUrl}" alt=""></div>`;
  return '';
}

function buildPopupContent(item) {
  const m = getMemberByName(item.who);
  const t = typeMeta(item.type);
  const headIcon = item.type==='checkin' ? spriteSvg(m) : t.icon;
  const el = document.createElement('div');
  el.className = 'popup-inner';
  el.innerHTML = `
    <div class="popup-header">
      <div class="popup-icon">${headIcon}</div>
      <div style="flex:1;">
        <div class="popup-title">${item.name}</div>
        <div style="display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap;">
          <span class="diary-tag ${t.tag}">${t.label}</span>
          ${tripChip(item)}
          ${item.date?`<span style="font-size:8px;color:var(--muted)">${item.date}</span>`:''}
        </div>
      </div>
    </div>
    ${itemImgHtml(item)}
    ${item.note?`<div class="popup-note">${item.note}</div>`:''}
    <div class="popup-actions">
      ${item.type==='wish'?`<button class="popup-action-btn go" onclick="checkinFromWish('${item.id}')">🐾 去過了，打卡！</button>`:''}
      <button class="popup-action-btn" onclick="openComments('${item.id}')">💬 留言（${item.comments?.length||0}）</button>
      <button class="popup-action-btn" onclick="navigateTo(${item.lat},${item.lng})">➤ 導航</button>
    </div>
    <div class="popup-actions" style="border-top:none;padding-top:0;margin-top:6px;">
      <button class="popup-action-btn" onclick="startEditCheckin('${item.id}')">✎ 編輯</button>
      <button class="popup-action-btn" style="color:#d84848;" onclick="removeCheckin('${item.id}')">🗑 刪除</button>
    </div>
  `;
  return el;
}

// ══════════════════════════════════════════
//  卡片列表
// ══════════════════════════════════════════
const TABS = [
  { key:'all', label:'全部' },
  { key:'checkin', label:'打卡' },
  { key:'wish', label:'想去' },
];

function buildTabs() {
  const el = document.getElementById('drawerTabs');
  let html = TABS.map(t =>
    `<button class="dtab ${t.key===currentTab?'on':''}" onclick="setTab('${t.key}');event.stopPropagation();">${t.label}</button>`
  ).join('');
  if (tripFilter) {
    const t = tripById(tripFilter);
    html += `<button class="dtab on" onclick="clearTripFilter();event.stopPropagation();">🧳 ${t?t.name:'旅程'} ✕</button>`;
  }
  el.innerHTML = html;
}

function setTab(key) {
  currentTab = key;
  buildTabs();
  renderCards();
  if (!drawerOpen && !isDesktop()) toggleDrawer();
}

function getVisible() {
  return checkins.filter(item => {
    if (!filters[item.type]) return false;
    if (currentTab !== 'all' && item.type !== currentTab) return false;
    if (memberFilter && item.who !== memberFilter) return false;
    if (tripFilter && item.tripId !== tripFilter) return false;
    return true;
  });
}

function renderCards() {
  const list = document.getElementById('cardList');
  const visible = getVisible();
  document.getElementById('drawerCount').textContent = visible.length + ' 筆';
  list.innerHTML = visible.map(item => {
    const m = getMemberByName(item.who);
    const t = typeMeta(item.type);
    const g = item.svgGrid || 16;
    const thumb = item.svgData
      ? `<svg viewBox="0 0 ${g} ${g}" style="image-rendering:pixelated;width:100%;height:100%;">${item.svgData}</svg>`
      : item.imageUrl
      ? `<img src="${item.imageUrl}" alt="">`
      : item.type==='checkin'
      ? spriteSvg(m)
      : `<span style="font-size:24px;">${t.icon}</span>`;
    return `<div class="diary-card" onclick="flyTo(${item.lat},${item.lng},'${item.id}')">
      <div class="diary-thumb">${thumb}</div>
      <div class="diary-info">
        <div class="diary-name">${item.name}</div>
        <div class="diary-meta">
          <span class="diary-tag ${t.tag}">${t.label}</span>
          ${tripChip(item)}
          ${item.date?`<span class="diary-date">${item.date}</span>`:''}
        </div>
        ${item.note?`<div class="diary-note">${item.note}</div>`:''}
        <div class="diary-footer">
          <span class="diary-comments">${item.comments?.length?`💬 ${item.comments.length}`:''}</span>
          <div class="diary-author">${spriteSvg(m)}</div>
        </div>
      </div>
    </div>`;
  }).join('') || `<div style="text-align:center;padding:24px;font-size:9px;color:var(--muted);">還沒有紀錄，按右下角 🐾 打卡開始！</div>`;
}

function flyTo(lat, lng, id) {
  map.flyTo([lat, lng], 13, { duration: 1 });
  setTimeout(() => { if(markers[id]) markers[id].openPopup(); }, 1000);
}

function toggleDrawer() {
  if (isDesktop()) return;
  drawerOpen = !drawerOpen;
  document.getElementById('cardDrawer').classList.toggle('expanded', drawerOpen);
  if (drawerOpen) map.invalidateSize();
}
function setDrawer(open) {
  if (drawerOpen !== open) toggleDrawer();
}
// 共用拖曳把手：上拖展開、下拖收合、沒拖到就當點擊（按鈕不攔）
// iOS 上 pointer capture 會吃掉 click，改在 pointerup 判斷「沒拖就是點」
function bindDragToggle(zone, { onUp, onDown, onTap }) {
  let startY = null, dragged = false;
  zone.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    startY = e.clientY; dragged = false;
    zone.setPointerCapture(e.pointerId);
  });
  zone.addEventListener('pointermove', e => {
    if (startY === null) return;
    const dy = e.clientY - startY;
    if (dy < -20) { onUp?.();   dragged = true; startY = e.clientY; }
    if (dy >  20) { onDown?.(); dragged = true; startY = e.clientY; }
  });
  zone.addEventListener('pointerup', e => {
    if (startY !== null && !dragged && !e.target.closest('button')) onTap?.();
    startY = null; dragged = false;
  });
  zone.addEventListener('pointercancel', () => { startY = null; dragged = false; });
  zone.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
}
bindDragToggle(document.getElementById('drawerHandle'), {
  onUp:   () => setDrawer(true),
  onDown: () => setDrawer(false),
  onTap:  toggleDrawer,
});

// ══════════════════════════════════════════
//  側欄 / 圖層
// ══════════════════════════════════════════
function openSidebar() {
  document.getElementById('sidebar').classList.add('show');
  document.getElementById('sidebarOverlay').classList.add('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('show');
  document.getElementById('sidebarOverlay').classList.remove('show');
}
let layersOpen = false;
function toggleLayers() {
  layersOpen = !layersOpen;
  document.getElementById('layersMenu').classList.toggle('show', layersOpen);
}
function closeLayers() {
  layersOpen = false;
  document.getElementById('layersMenu').classList.remove('show');
}
function toggleFilter(key) {
  filters[key] = !filters[key];
  document.getElementById('lo-'+key).classList.toggle('on', filters[key]);
  renderMarkers();
}

// ══════════════════════════════════════════
//  打卡 Modal
// ══════════════════════════════════════════
function selectType(t) {
  pendingCheckin.type = t;
  document.querySelectorAll('#typeRow .type-chip').forEach(b =>
    b.classList.toggle('on', b.dataset.type===t));
  document.getElementById('submitBtn').innerHTML = typeMeta(t).icon + ' 儲存';
  checkSubmitReady();
}

function buildMemberGrid() {
  const el = document.getElementById('memberGrid');
  el.innerHTML = members.map(m =>
    `<div class="member-choice ${pendingCheckin.who===m.name?'on':''}" onclick="selectMember('${m.name}')">
      <div class="check">✓</div>
      <div class="member-choice-avatar">${spriteSvg(m)}</div>
      <div class="member-choice-name">${m.name}</div>
    </div>`
  ).join('');
}

function selectMember(name) {
  pendingCheckin.who = name;
  buildMemberGrid();
  checkSubmitReady();
}

function buildTripSelect() {
  const el = document.getElementById('tripSelect');
  el.innerHTML = `<option value="">🏠 日常紀錄（不掛旅程）</option>` +
    trips.map(t => `<option value="${t.id}">🧳 ${t.name}${t.dateStart?`（${t.dateStart}）`:''}</option>`).join('');
  el.value = pendingCheckin.tripId || (tripFilter || '');
}

let editingId = null;

function setStepsVisible(showAll) {
  ['stepType','stepLocation','stepMember'].forEach(id =>
    document.getElementById(id).style.display = showAll ? '' : 'none');
}

function openCheckin(prefill) {
  editingId = null;
  pendingCheckin = { type:'checkin', lat:null, lng:null, who:null, text:'', svgData:null, svgGrid:16, pngBlob:null, tripId:'' };
  pendingWishId = null;
  selectType('checkin');
  setStepsVisible(true);
  document.getElementById('checkinModalTitle').textContent = '新增紀錄';
  document.getElementById('locationName').textContent = '點地圖選擇地點';
  document.getElementById('locationCoord').textContent = '';
  document.getElementById('placeName').value = '';
  document.getElementById('diaryText').value = '';
  document.getElementById('charCount').textContent = '0';
  document.getElementById('drawThumb').innerHTML = '🖼';
  document.getElementById('submitBtn').disabled = true;
  if (prefill) {
    pendingCheckin.lat = prefill.lat;
    pendingCheckin.lng = prefill.lng;
    document.getElementById('locationName').textContent = prefill.name || `${prefill.lat.toFixed(4)}, ${prefill.lng.toFixed(4)}`;
    document.getElementById('locationCoord').textContent = '來自想去清單';
    document.getElementById('placeName').value = prefill.name || '';
  }
  buildMemberGrid();
  buildTripSelect();
  document.getElementById('checkinModal').classList.add('show');
  checkSubmitReady();
  if (!prefill) tryGPS();
}

// 開啟打卡時預設抓 GPS 定位（點地點卡片仍可改成手動選點）
function tryGPS() {
  if (!navigator.geolocation) return;
  document.getElementById('locationName').textContent = '📡 定位中…';
  document.getElementById('locationCoord').textContent = '點此可改手動選點';
  navigator.geolocation.getCurrentPosition(pos => {
    // 使用者已手動選點或進入編輯就不覆蓋
    if (editingId || pendingCheckin.lat) return;
    pendingCheckin.lat = pos.coords.latitude;
    pendingCheckin.lng = pos.coords.longitude;
    document.getElementById('locationName').textContent =
      `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
    document.getElementById('locationCoord').textContent = '目前位置（GPS）· 點此可改手動選點';
    checkSubmitReady();
  }, () => {
    if (!pendingCheckin.lat) {
      document.getElementById('locationName').textContent = '點地圖選擇地點';
      document.getElementById('locationCoord').textContent = '（無法取得定位）';
    }
  }, { enableHighAccuracy:true, timeout:8000, maximumAge:60000 });
}

// 編輯既有紀錄（可改日記、塗鴉與所屬旅程；地點/角色/類型固定）
function startEditCheckin(id) {
  const item = checkins.find(c=>c.id===id);
  if (!item) return;
  map.closePopup();
  editingId = id;
  pendingWishId = null;
  pendingCheckin = {
    type:item.type, lat:item.lat, lng:item.lng, who:item.who,
    text:item.note||'', svgData:item.svgData||null, svgGrid:item.svgGrid||16, pngBlob:null,
    tripId:item.tripId||'',
  };
  setStepsVisible(false);
  document.getElementById('checkinModalTitle').textContent = '編輯：' + (item.name||'');
  document.getElementById('diaryText').value = item.note||'';
  document.getElementById('charCount').textContent = String((item.note||'').length);
  document.getElementById('drawThumb').innerHTML = item.svgData
    ? `<svg viewBox="0 0 ${item.svgGrid||16} ${item.svgGrid||16}" style="image-rendering:pixelated;width:100%;height:100%;">${item.svgData}</svg>`
    : '🖼';
  buildTripSelect();
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('checkinModal').classList.add('show');
}

// 刪除紀錄（台灣版 GAS 用打卡 ID 定位，不怕列位移）
async function removeCheckin(id) {
  const item = checkins.find(c=>c.id===id);
  if (!item) return;
  if (!confirm(`刪除「${item.name}」這筆紀錄？`)) return;
  map.closePopup();
  checkins = checkins.filter(c=>c.id!==id);
  renderMarkers();
  try { await gasPost({ action:'deleteCheckin', id }); }
  catch(e) { console.warn('雲端刪除失敗', e); }
}

// 想去 → 打卡（打卡成功後自動移除想去項目，併入回顧）
function checkinFromWish(wishId) {
  const w = checkins.find(c=>c.id===wishId);
  if (!w) return;
  map.closePopup();
  openCheckin({ lat:w.lat, lng:w.lng, name:w.name });
  pendingWishId = wishId;
}

function closeCheckin() {
  document.getElementById('checkinModal').classList.remove('show');
  pickingLocation = false;
  editingId = null;
  map.getContainer().style.cursor = '';
}

function pickLocation() {
  document.getElementById('checkinModal').classList.remove('show');
  pickingLocation = true;
  map.getContainer().style.cursor = 'crosshair';
}

function updateCharCount() {
  const val = document.getElementById('diaryText').value;
  document.getElementById('charCount').textContent = val.length;
  pendingCheckin.text = val;
  checkSubmitReady();
}

function checkSubmitReady() {
  const ready = pendingCheckin.lat && pendingCheckin.who;
  document.getElementById('submitBtn').disabled = !ready;
}

async function uploadImageToR2(blob) {
  const formData = new FormData();
  formData.append('file', blob, 'checkin.png');
  const res = await fetch(CFG.r2Worker, { method:'POST', body: formData });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'upload failed');
  return data.url;
}

async function gasPost(payload) {
  if (!CFG.apiBase) return null;
  const res = await fetch(CFG.apiBase, { method:'POST', body: JSON.stringify(payload) });
  try { return await res.json(); } catch(e) { return null; }
}

async function submitCheckin() {
  if (!pendingCheckin.lat || !pendingCheckin.who) return;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '送出中…';

  // ── 編輯模式：更新日記、塗鴉與所屬旅程
  if (editingId) {
    try {
      const item = checkins.find(c=>c.id===editingId);
      if (item) {
        let imageUrl = item.imageUrl || '';
        if (pendingCheckin.pngBlob) {
          try { imageUrl = await uploadImageToR2(pendingCheckin.pngBlob); }
          catch(e) { console.warn('圖片上傳失敗', e); }
        }
        item.note     = pendingCheckin.text;
        item.svgData  = pendingCheckin.svgData;
        item.svgGrid  = pendingCheckin.svgGrid;
        item.imageUrl = imageUrl;
        item.tripId   = document.getElementById('tripSelect').value || '';
        await gasPost({
          action:   'editCheckin',
          id:       item.id,
          note:     item.note,
          imageUrl: imageUrl,
          svgData:  item.svgData || '',
          svgGrid:  item.svgGrid || 16,
          tripId:   item.tripId,
        });
      }
      editingId = null;
      closeCheckin();
      renderMarkers();
    } catch(e) {
      console.error('編輯送出失敗', e);
      alert('送出失敗，請稍後再試');
    } finally {
      btn.disabled = false;
      btn.innerHTML = typeMeta(pendingCheckin.type).icon + ' 儲存';
    }
    return;
  }

  try {
    const now = new Date();
    const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;

    let imageUrl = '';
    if (pendingCheckin.pngBlob) {
      try { imageUrl = await uploadImageToR2(pendingCheckin.pngBlob); }
      catch(e) { console.warn('圖片上傳失敗，繼續送出打卡', e); }
    }

    const customName = document.getElementById('placeName').value.trim();
    const tripId = document.getElementById('tripSelect').value || '';
    const item = {
      id:       'c' + Date.now(),
      type:     pendingCheckin.type,
      who:      pendingCheckin.who,
      lat:      pendingCheckin.lat,
      lng:      pendingCheckin.lng,
      name:     customName || document.getElementById('locationName').textContent,
      date:     dateStr,
      note:     pendingCheckin.text,
      comments: [],
      imageUrl: imageUrl,
      svgData:  pendingCheckin.svgData,
      svgGrid:  pendingCheckin.svgGrid,
      tripId:   tripId,
    };

    const resp = await gasPost({
      action:'addCheckin',
      type:item.type, who:item.who, lat:item.lat, lng:item.lng,
      name:item.name, note:item.note, imageUrl:item.imageUrl,
      svgData:item.svgData||'', svgGrid:item.svgGrid||16, tripId:tripId,
    });
    if (resp?.msg?.id) item.id = resp.msg.id;

    // 想去 → 打卡轉換：移除原本的想去項目
    if (pendingWishId && item.type==='checkin') {
      const idx = checkins.findIndex(c=>c.id===pendingWishId);
      if (idx >= 0) checkins.splice(idx, 1);
      gasPost({ action:'deleteCheckin', id: pendingWishId }).catch?.(()=>{});
      pendingWishId = null;
    }

    checkins.unshift(item);
    closeCheckin();
    renderMarkers();
    map.flyTo([item.lat, item.lng], 13);
  } catch(e) {
    console.error('打卡送出失敗', e);
    alert('送出失敗，請稍後再試');
  } finally {
    btn.disabled = false;
    btn.innerHTML = typeMeta(pendingCheckin.type).icon + ' 儲存';
  }
}

// ══════════════════════════════════════════
//  小旅程
// ══════════════════════════════════════════
let editingTripId = null;
let tripFormMembers = [];

function openTrips() {
  renderTrips();
  document.getElementById('tripsModal').classList.add('show');
}
function closeTrips() {
  document.getElementById('tripsModal').classList.remove('show');
}

function renderTrips() {
  const el = document.getElementById('tripsBody');
  const list = trips.map(t => {
    const count = checkins.filter(c=>c.tripId===t.id).length;
    const dates = [t.dateStart, t.dateEnd].filter(Boolean).join(' ~ ');
    return `<div class="trip-item ${tripFilter===t.id?'on':''}">
      <div class="trip-item-head" onclick="setTripFilter('${t.id}')">
        <span style="font-size:14px;">🧳</span>
        <span class="trip-item-name">${t.name}</span>
        <span class="trip-item-date">${dates}</span>
      </div>
      <div class="trip-item-meta">${(t.members||[]).join('、')}${count?` · ${count} 筆紀錄`:''}${t.memo?`\n📝 ${t.memo}`:''}</div>
      <div class="trip-actions">
        <button class="trip-btn" onclick="setTripFilter('${t.id}')">${tripFilter===t.id?'✓ 篩選中（點選取消）':'只看此旅程'}</button>
        <button class="trip-btn" onclick="openTripForm('${t.id}')">✎ 編輯</button>
        <button class="trip-btn danger" onclick="deleteTrip('${t.id}')">🗑</button>
      </div>
    </div>`;
  }).join('') || `<div style="text-align:center;padding:16px;font-size:9px;color:var(--muted);">還沒有小旅程</div>`;
  el.innerHTML = list + `<button class="add-trip-btn" onclick="openTripForm()">＋ 新增小旅程</button>`;
}

function setTripFilter(id) {
  tripFilter = (tripFilter===id) ? null : id;
  buildTabs();
  renderMarkers();
  renderTrips();
  closeTrips();
  if (tripFilter && !drawerOpen && !isDesktop()) toggleDrawer();
}
function clearTripFilter() {
  tripFilter = null;
  buildTabs();
  renderMarkers();
}

function buildTripMemberGrid() {
  const el = document.getElementById('tripMemberGrid');
  el.innerHTML = members.map(m =>
    `<div class="member-choice ${tripFormMembers.includes(m.name)?'on':''}" onclick="toggleTripMember('${m.name}')">
      <div class="check">✓</div>
      <div class="member-choice-avatar">${spriteSvg(m)}</div>
      <div class="member-choice-name">${m.name}</div>
    </div>`
  ).join('');
}
function toggleTripMember(name) {
  const i = tripFormMembers.indexOf(name);
  if (i>=0) tripFormMembers.splice(i,1); else tripFormMembers.push(name);
  buildTripMemberGrid();
}

function openTripForm(id) {
  editingTripId = id || null;
  const t = id ? tripById(id) : null;
  document.getElementById('tripFormTitle').textContent = t ? '編輯小旅程' : '新增小旅程';
  document.getElementById('tripName').value = t?.name || '';
  document.getElementById('tripDateStart').value = t?.dateStart || '';
  document.getElementById('tripDateEnd').value = t?.dateEnd || '';
  document.getElementById('tripMemo').value = t?.memo || '';
  tripFormMembers = t ? [...(t.members||[])] : members.map(m=>m.name);
  buildTripMemberGrid();
  closeTrips();
  document.getElementById('tripFormModal').classList.add('show');
}
function closeTripForm() {
  document.getElementById('tripFormModal').classList.remove('show');
}

async function submitTrip() {
  const name = document.getElementById('tripName').value.trim();
  if (!name) { alert('請輸入旅程名稱'); return; }
  const btn = document.getElementById('tripSubmitBtn');
  btn.disabled = true;
  const data = {
    name,
    dateStart: document.getElementById('tripDateStart').value,
    dateEnd:   document.getElementById('tripDateEnd').value,
    members:   tripFormMembers,
    memo:      document.getElementById('tripMemo').value.trim(),
  };
  try {
    if (editingTripId) {
      const resp = await gasPost({ action:'editTrip', id:editingTripId, ...data });
      const t = tripById(editingTripId);
      if (t) Object.assign(t, data);
    } else {
      const resp = await gasPost({ action:'addTrip', ...data });
      const id = resp?.msg?.id || ('tp' + Date.now());
      trips.unshift({ id, ...data });
    }
    closeTripForm();
    renderMarkers();
    openTrips();
  } catch(e) {
    console.error('旅程儲存失敗', e);
    alert('儲存失敗，請稍後再試');
  } finally {
    btn.disabled = false;
  }
}

async function deleteTrip(id) {
  const t = tripById(id);
  if (!t) return;
  if (!confirm(`刪除小旅程「${t.name}」？\n（掛在底下的紀錄會變回日常紀錄）`)) return;
  trips = trips.filter(x=>x.id!==id);
  if (tripFilter===id) tripFilter = null;
  checkins.forEach(c=>{ if(c.tripId===id) c.tripId=''; });
  gasPost({ action:'deleteTrip', id });
  buildTabs();
  renderMarkers();
  renderTrips();
}

// ══════════════════════════════════════════
//  留言
// ══════════════════════════════════════════
function openComments(id) {
  currentCommentId = id;
  const item = checkins.find(c=>c.id===id);
  if (!item) return;
  document.getElementById('commentModalTitle').textContent = `留言（${item.comments?.length||0}）`;
  renderComments(item);
  document.getElementById('commentModal').classList.add('show');
}

function renderComments(item) {
  const el = document.getElementById('commentList');
  el.innerHTML = (item.comments||[]).map(c => {
    const m = getMemberByName(c.who);
    return `<div class="comment-item">
      <div class="comment-avatar">${spriteSvg(m)}</div>
      <div class="comment-body">
        <div class="comment-name" style="color:${m.color}">${c.who}</div>
        <div class="comment-text">${c.text}</div>
        <div class="comment-time">${c.time||''}</div>
      </div>
    </div>`;
  }).join('') || `<div style="text-align:center;padding:24px;font-size:9px;color:var(--muted);">還沒有留言</div>`;
}

async function sendComment() {
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if (!text || !currentCommentId) return;
  const item = checkins.find(c=>c.id===currentCommentId);
  if (!item) return;
  const who = members[0]?.name || '';
  item.comments = item.comments || [];
  item.comments.push({ who, text, time: new Date().toISOString() });
  input.value = '';
  document.getElementById('commentModalTitle').textContent = `留言（${item.comments.length}）`;
  renderComments(item);
  renderCards();
  if (markers[currentCommentId]) {
    markers[currentCommentId].setPopupContent(buildPopupContent(item));
  }
  gasPost({ action:'addComment', checkinId:item.id, who, text });
}

function closeComments() {
  document.getElementById('commentModal').classList.remove('show');
  currentCommentId = null;
}

function navigateTo(lat, lng) {
  window.open(`https://maps.google.com/?q=${lat},${lng}`, '_blank');
}

// ══════════════════════════════════════════
//  頂部成員頭像
// ══════════════════════════════════════════
function buildTopbarMembers() {
  const el = document.getElementById('topbarMembers');
  el.innerHTML = members.map(m =>
    `<div class="member-avatar ${memberFilter===m.name?'on':''}" title="${m.name}" onclick="filterByMember('${m.name}')">${spriteSvg(m)}</div>`
  ).join('');
  document.getElementById('appTitle').textContent = CFG.appName;
  document.getElementById('sidebarTitle').textContent = CFG.appName;
}
function filterByMember(name) {
  memberFilter = (memberFilter === name) ? null : name;
  buildTopbarMembers();
  renderMarkers();
}

// ══════════════════════════════════════════
//  資料載入
// ══════════════════════════════════════════
function itemTs(c) {
  const t = new Date(c.time || c.date || 0).getTime();
  return isNaN(t) ? 0 : t;
}

// 套用雲端打卡：缺塗鴉保留本地新畫的；雲端還沒有的本地新項目不丟
// （樂觀更新的坑：本地暫存採用後端正式 ID，加同人同座標去重保險）
function applyCheckins(cloud) {
  const localById = {};
  checkins.forEach(c => { localById[c.id] = c; });
  const cloudIds = new Set(cloud.map(c => c.id));
  const merged = cloud.map(c => {
    const local = localById[c.id];
    return {
      ...c,
      svgData: c.svgData || local?.svgData || null,
      svgGrid: c.svgGrid || local?.svgGrid || 16,
      tripId:  c.tripId || '',
    };
  });
  const cloudKeys = new Set(cloud.map(c =>
    `${c.who}|${(+c.lat).toFixed(5)}|${(+c.lng).toFixed(5)}`));
  checkins.forEach(c => {
    const key = `${c.who}|${(+c.lat).toFixed(5)}|${(+c.lng).toFixed(5)}`;
    if (!cloudIds.has(c.id) && !cloudKeys.has(key) &&
        Date.now() - itemTs(c) < 5*60*1000) merged.unshift(c);
  });
  checkins = merged;
}

async function loadData() {
  if (!CFG.apiBase) {
    console.log('未設定 GAS apiBase，使用空資料');
    return;
  }
  try {
    // 一次請求合併載入所有資料源（GAS 冷啟動只等一次）
    const res = await fetch(CFG.apiBase + '?sheet=all', { cache:'no-store' });
    const data = await res.json();
    if (Array.isArray(data.checkins)) applyCheckins(data.checkins);
    if (Array.isArray(data.trips)) trips = data.trips;
    buildTabs();
    renderMarkers();
  } catch(e) {
    console.warn('資料載入失敗', e);
  }
}

// ══════════════════════════════════════════
//  初始化
// ══════════════════════════════════════════
buildTopbarMembers();
buildTabs();
renderMarkers();
loadData();
setTimeout(() => map.invalidateSize(), 200);
window.addEventListener('resize', () => map.invalidateSize());

// PWA service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>

<script src="../shared/pixelpad.js"></script>
<script>
// ══════════════════════════════════════════
//  畫板掛載（共用 shared/pixelpad.js，樣式吃本頁水果色變數）
// ══════════════════════════════════════════
let padMounted = false;

function ensurePad() {
  if (!padMounted) {
    PixelPad.mount(document.getElementById('pixelPadMount'), { onDone: onPadDone });
    padMounted = true;
  }
}

function openDrawPanel() {
  document.getElementById('drawModal').classList.add('show');
  ensurePad();
  // 有既有塗鴉（編輯中）就載入，否則開全新空白畫布
  if (pendingCheckin.svgData) {
    PixelPad.loadRects(pendingCheckin.svgData, pendingCheckin.svgGrid || 16);
  } else {
    PixelPad.reset();
  }
}

function onPadDone(res) {
  document.getElementById('drawModal').classList.remove('show');
  pendingCheckin.svgData = res.svgData;
  pendingCheckin.svgGrid = res.grid;
  if (res.svgData) {
    PixelPad.toPNGBlob(blob => { pendingCheckin.pngBlob = blob; });
    document.getElementById('drawThumb').innerHTML =
      `<svg viewBox="0 0 ${res.grid} ${res.grid}" style="image-rendering:pixelated;width:100%;height:100%;">${res.svgData}</svg>`;
  } else {
    pendingCheckin.pngBlob = null;
    document.getElementById('drawThumb').innerHTML = '🖼';
  }
}
</script>
