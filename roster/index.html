<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>角色館 · 旅程書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@300;400&display=swap">
<style>
:root{
  --space:#f7f1e6; --ink:#5b4a38; --faint:#b9ab94;
  --dotA:#cf9d7d; --dotB:#b3ad7e; --spark:#c97b3d;
}
*{box-sizing:border-box;}
html,body{margin:0; background:var(--space); color:var(--ink);}
body{
  font-family:'Noto Sans TC',system-ui,sans-serif; font-weight:300;
  min-height:100vh; -webkit-tap-highlight-color:transparent;
}
.wrap{position:relative; max-width:1240px; margin:0 auto; padding:clamp(20px,5vh,58px) clamp(18px,5vw,64px) 90px;}

.back{
  font-family:Silkscreen,monospace; font-size:8px; letter-spacing:.24em;
  color:var(--faint); background:none; border:none; cursor:pointer; padding:0;
  text-decoration:none; display:inline-block;
}
.back:hover{color:var(--ink);}
.mark{margin:34px 0 4px;}
.mark .zh{font-family:'Noto Serif TC',serif; font-weight:900; font-size:23px; letter-spacing:.3em; margin:0;}
.mark .en{font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.3em; color:var(--faint); margin-top:9px;}
.lede{font-size:12.5px; color:var(--faint); line-height:2.1; letter-spacing:.04em; margin:14px 0 0;}

/* ══ 左右兩欄：左邊名冊（往下長），右邊角色卡 ══ */
.body{
  display:flex; gap:clamp(22px,4vw,50px); align-items:flex-start;
  margin-top:30px;
}

/* 名冊：一條手寫的直線，角色是線上的點——人再多就往下長 */
.cast{
  position:relative; flex-shrink:0;
  width:clamp(178px,22vw,236px);
  padding-left:24px;
  max-height:min(600px,66vh); overflow-y:auto; overscroll-behavior:contain;
  scrollbar-width:thin; scrollbar-color:var(--faint) transparent;
}
.cast::-webkit-scrollbar{width:3px;}
.cast::-webkit-scrollbar-thumb{background:var(--faint);}
/* left 對齊 .actor .dot 的圓心：24(padding) − 19(dot left) + 4.5(半徑含框) = 9.5 = 2.5 + x7 */
.cast .spine{position:absolute; left:2.5px; top:0; width:14px; height:100%; pointer-events:none;}
.cast .spine path{fill:none; stroke:var(--faint); stroke-width:1.2; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.actor{
  position:relative; width:100%; background:none; border:none; cursor:pointer;
  display:flex; align-items:center; gap:12px; padding:9px 4px 9px 0; text-align:left;
  transition:transform .22s cubic-bezier(.2,.85,.3,1.05);
}
.actor:hover, .actor.on{transform:translateX(4px);}
/* 線上的點：定位對齊 .cast 的 spine（left:8px + 半徑） */
.actor .dot{
  position:absolute; left:-19px; top:50%; margin-top:-3px;
  width:6px; height:6px; border-radius:50%; background:var(--space);
  border:1.5px solid var(--faint); box-sizing:content-box;
}
.actor.on .dot{background:var(--spark); border-color:var(--spark);}
.actor .fig{width:30px; height:48px; flex-shrink:0; display:grid; place-items:end center;}
.actor .fig svg{width:100%; height:100%; image-rendering:pixelated;}
.actor .ch-emoji{font-size:22px; line-height:1;}
.actor .nm{
  font-size:13px; letter-spacing:.08em; color:var(--faint);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.actor.on .nm{color:var(--ink);}
.actor .me{font-family:Silkscreen,monospace; font-size:6.5px; letter-spacing:.16em; color:var(--spark); margin-left:auto; flex-shrink:0;}
.cast .count{
  font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.2em;
  color:var(--faint); padding:14px 0 4px;
}

/* ══ 角色卡：網點面上的一張紙 ══ */
.card{
  flex:1; min-width:0;
  position:relative; padding:26px clamp(18px,4vw,34px) 30px;
  background-image:radial-gradient(circle, var(--dotA) 1.5px, transparent 1.7px);
  background-size:7px 7px;
}
.card .sheet{background:var(--space); padding:clamp(18px,3vw,28px); box-shadow:3px 4px 0 rgba(0,0,0,.07);}
.card .top{display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap;}
.card .big{width:66px; height:104px; flex-shrink:0; display:grid; place-items:end center;}
.card .big svg{width:100%; height:100%; image-rendering:pixelated;}
.card .big .ch-emoji{font-size:44px;}
.card .id{flex:1; min-width:180px;}
.card .id h2{font-family:'Noto Serif TC',serif; font-weight:900; font-size:21px; letter-spacing:.16em; margin:0; display:flex; align-items:center; gap:10px;}
.card .id h2 .sw{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.card .id .alias{font-size:12px; color:var(--faint); margin-top:8px; letter-spacing:.08em; min-height:1em;}
.card .id .intro{font-size:13px; line-height:2; margin-top:15px; white-space:pre-wrap;}
.card .id .intro.empty{color:var(--faint);}
.tags{display:flex; flex-wrap:wrap; gap:7px; margin-top:15px;}
.tags span{font-size:10.5px; letter-spacing:.06em; color:var(--ink); border:1px solid var(--faint); padding:3px 9px;}
.mine{font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.2em; color:var(--space); background:var(--spark); padding:3px 7px;}
.stat{display:flex; flex-wrap:wrap; gap:0 26px; margin-top:22px; padding-top:18px; border-top:1px solid var(--faint);}
.stat div{font-size:11px; color:var(--faint); letter-spacing:.06em; padding:4px 0;}
.stat b{font-family:Silkscreen,monospace; font-size:13px; color:var(--ink); font-weight:400; margin-right:5px;}
.acts{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}

button.ln, a.ln{
  font-family:'Noto Sans TC',sans-serif; font-size:12px; letter-spacing:.08em;
  background:none; border:1px solid var(--faint); color:var(--ink);
  padding:8px 16px; cursor:pointer; text-decoration:none; display:inline-block;
}
button.ln:hover, a.ln:hover{border-color:var(--ink);}
button.ln.warm{border-color:var(--spark); color:var(--spark);}
button.ln.ghost{border:none; color:var(--faint);}

/* ══ 編輯 ══ */
.edit{margin-top:22px; padding-top:20px; border-top:1px solid var(--faint);}
.fld{margin-bottom:16px;}
.fld label{display:block; font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.2em; color:var(--faint); margin-bottom:7px;}
.fld input, .fld textarea{
  width:100%; background:none; border:none; border-bottom:1px solid var(--faint);
  font-family:'Noto Sans TC',sans-serif; font-size:14px; color:var(--ink);
  padding:5px 2px; font-weight:300;
}
.fld textarea{border:1px solid var(--faint); padding:10px; line-height:1.9; resize:vertical; min-height:86px;}
.fld input:focus, .fld textarea:focus{outline:none; border-color:var(--ink);}
.row2{display:flex; gap:18px; flex-wrap:wrap;}
.row2 .fld{flex:1; min-width:130px;}
.fld input[type=color]{height:34px; padding:0; border:1px solid var(--faint); cursor:pointer;}
.chk{display:flex; align-items:center; gap:9px; font-size:12.5px; cursor:pointer; color:var(--ink);}
.chk input{width:15px; height:15px; accent-color:var(--spark);}
.pad{margin-top:14px; display:none;}
.pad.open{display:block;}
.foot{
  display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  margin-top:40px; padding-top:20px; border-top:1px solid var(--faint);
}
.foot .sp{margin-left:auto;}
.hint{font-size:11px; color:var(--faint); letter-spacing:.05em;}

/* 窄螢幕：名冊收到上面，仍然是往下長的一欄 */
@media (max-width:720px){
  .body{flex-direction:column; gap:26px;}
  .cast{width:100%; max-height:none; overflow:visible;}
  .card{width:100%;}
}
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="../book/">← DESK</a>

  <div class="mark">
    <h1 class="zh">角 色 館</h1>
    <div class="en">ROSTER</div>
  </div>
  <p class="lede">一起走過的人，都在這裡。<br>兩本書共用同一份名冊。</p>

  <div class="body">
    <div class="cast" id="cast"></div>
    <div class="card" id="card"></div>
  </div>

  <div class="foot">
    <button class="ln" onclick="newChar()">＋ 新角色</button>
    <button class="ln ghost" onclick="doExport()">匯出 JSON</button>
    <button class="ln ghost" onclick="document.getElementById('imp').click()">匯入</button>
    <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="doImport(this)">
    <span class="hint sp" id="saveHint">存在這台裝置的瀏覽器裡</span>
  </div>
</div>

<script src="../shared/theme.js"></script>
<script src="../shared/sprites.js"></script>
<script src="../shared/roster.js"></script>
<script src="../shared/pixelpad.js"></script>
<script>
Theme.mount();
Roster.startTicker();

// 出場統計：先用書桌抓下來的台灣打卡快取，統一版接上資料庫後換成 API。
// 舊資料的 who 欄存的是名字，所以用名字比對。
Roster.addStats(ch => {
  let data = null;
  try { data = JSON.parse(localStorage.getItem('book_tw_cache') || 'null'); } catch (e) {}
  if (!Array.isArray(data)) return null;
  const n = data.filter(c => c.who === ch.name && c.type !== 'wish').length;
  if (!n) return null;
  const days = new Set(data.filter(c => c.who === ch.name).map(c => String(c.time).slice(0, 10))).size;
  return [`<b>${n}</b>次島內腳印`, `<b>${days}</b>天出遊`];
});

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let sel = (Roster.all()[0] || {}).id || null;
let editing = false;
let padSprite = null;      // 編輯中暫存的自畫像素圖

// 名冊直線：每個角色一段，微微偏移，像手畫的
function spinePath(n){
  const step = 66;                       // 一列的高度，跟 .actor 對得上就好
  const h = Math.max(1, n) * step;
  let d = `M 7 4`;
  for (let i = 0; i < n; i++){
    const y = (i + 1) * step;
    const bend = 7 + (i % 2 ? 1.5 : -1.5);
    d += ` Q ${bend} ${y - step / 2}, 7 ${y}`;
  }
  return { d, h };
}

function renderCast(){
  const list = Roster.all();
  const box = document.getElementById('cast');
  const sp = spinePath(list.length);
  box.innerHTML = `
    <svg class="spine" viewBox="0 0 14 ${sp.h}" preserveAspectRatio="none"
         style="height:${sp.h}px;" aria-hidden="true"><path d="${sp.d}"/></svg>
    ${list.map(c => `
      <button class="actor ${c.id === sel ? 'on' : ''}" data-id="${esc(c.id)}" title="${esc(c.name)}">
        <span class="dot" style="${c.id === sel ? '' : `border-color:${esc(c.color)}`}"></span>
        <span class="fig">${Roster.spriteSvg(c)}</span>
        <span class="nm">${esc(c.name) || '？'}</span>
        ${c.isMe ? '<span class="me">ME</span>' : ''}
      </button>`).join('')}
    <div class="count">${list.length} 位</div>`;
  box.querySelectorAll('.actor').forEach(el =>
    el.addEventListener('click', () => { sel = el.dataset.id; editing = false; render(); }));
}

function renderCard(){
  const box = document.getElementById('card');
  const c = Roster.get(sel);
  if (!c){ box.innerHTML = '<div class="sheet"><p class="hint">名冊是空的。按下面的「＋ 新角色」開始。</p></div>'; return; }

  if (editing){ box.innerHTML = editForm(c); bindEdit(c); return; }

  const st = Roster.stats(c);
  box.innerHTML = `
    <div class="sheet">
      <div class="top">
        <div class="big">${Roster.spriteSvg(c)}</div>
        <div class="id">
          <h2><span class="sw" style="background:${esc(c.color)}"></span>${esc(c.name) || '未命名'}
            ${c.isMe ? '<span class="mine">ME</span>' : ''}</h2>
          <div class="alias">${esc(c.alias)}</div>
          <div class="intro ${c.intro ? '' : 'empty'}">${c.intro ? esc(c.intro) : '還沒有介紹。按「編輯」寫幾句。'}</div>
          ${c.tags && c.tags.length ? `<div class="tags">${c.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
        </div>
      </div>
      <div class="stat">
        ${st.length ? st.map(s => `<div>${s}</div>`).join('')
          : '<div>出場統計要等統一版接上資料後才會有。</div>'}
        ${c.since ? `<div><b>${esc(c.since)}</b>起同行</div>` : ''}
      </div>
      <div class="acts">
        <button class="ln" onclick="startEdit()">編輯</button>
        <a class="ln" href="../shared/spritetool.html" target="_blank">像素圖工具</a>
      </div>
    </div>`;
}

function editForm(c){
  return `
    <div class="sheet">
      <div class="edit" style="margin-top:0; padding-top:0; border:none;">
        <div class="row2">
          <div class="fld"><label>NAME 名字</label><input id="fName" value="${esc(c.name)}"></div>
          <div class="fld"><label>ALIAS 稱號</label><input id="fAlias" value="${esc(c.alias)}" placeholder="一句話身分"></div>
        </div>
        <div class="row2">
          <div class="fld" style="max-width:110px;"><label>COLOR 代表色</label><input type="color" id="fColor" value="${esc(c.color || '#9a9088')}"></div>
          <div class="fld" style="max-width:110px;"><label>EMOJI 備援</label><input id="fIcon" value="${esc(c.icon)}" maxlength="4"></div>
          <div class="fld" style="max-width:130px;"><label>SINCE 起始年</label><input id="fSince" value="${esc(c.since)}" placeholder="2019"></div>
        </div>
        <div class="fld"><label>TAGS 標籤（逗號分隔）</label><input id="fTags" value="${esc((c.tags || []).join('、'))}" placeholder="怕冷、負責訂房"></div>
        <div class="fld"><label>INTRO 介紹</label><textarea id="fIntro" placeholder="這個人是誰、跟你怎麼認識、旅行時負責什麼。">${esc(c.intro)}</textarea></div>
        <div class="fld">
          <label>ME 本人</label>
          <label class="chk"><input type="checkbox" id="fMe" ${c.isMe ? 'checked' : ''}>
            這是我（打卡時預設的記錄者，只能有一位）</label>
        </div>
        <div class="fld">
          <label>SPRITE 像素圖</label>
          <div class="acts" style="margin-top:0;">
            <button class="ln" onclick="togglePad()">🎨 用畫板畫</button>
            <button class="ln ghost" id="padClear" style="display:${(padSprite || c.sprite) ? '' : 'none'}"
              onclick="clearSprite()">✕ 清除自畫圖</button>
          </div>
          <p class="hint" style="margin:9px 0 0;">
            ${c.spriteKey ? `目前用 spritetool 綁定的動畫（${esc(c.spriteKey)}），自畫圖不會蓋掉它。` : '沒有綁定動畫，自畫圖就是頭像。'}
          </p>
          <div class="pad" id="pad"></div>
        </div>
        <div class="acts">
          <button class="ln warm" onclick="saveEdit()">儲存</button>
          <button class="ln ghost" onclick="editing=false;padSprite=null;render();">取消</button>
          <button class="ln ghost" style="margin-left:auto;color:var(--faint)" onclick="delChar()">刪除這位角色</button>
        </div>
      </div>
    </div>`;
}

function bindEdit(c){
  padSprite = padSprite || c.sprite || null;
}

function startEdit(){ editing = true; padSprite = null; render(); }

function togglePad(){
  const el = document.getElementById('pad');
  el.classList.toggle('open');
  if (el.classList.contains('open') && !el.dataset.ready){
    PixelPad.mount(el, { onDone: res => { padSprite = res.svgData ? { rects: res.svgData, grid: res.grid } : null; } });
    const c = Roster.get(sel);
    const s = padSprite || (c && c.sprite);
    if (s && s.rects) PixelPad.loadRects(s.rects, s.grid);
    el.dataset.ready = '1';
  }
}
function clearSprite(){
  padSprite = null;
  const c = Roster.get(sel); if (c) c.sprite = null;
  document.getElementById('padClear').style.display = 'none';
}

function saveEdit(){
  const c = Roster.get(sel);
  const name = document.getElementById('fName').value.trim();
  if (!name){ alert('名字不能空白'); return; }
  // 畫板開著就把當下的畫收進來，不用先按畫板自己的完成鍵
  if (document.getElementById('pad').dataset.ready){
    const r = PixelPad.getResult();
    if (r.svgData) padSprite = { rects: r.svgData, grid: r.grid };
  }
  Roster.upsert({
    id: c.id,
    name,
    alias: document.getElementById('fAlias').value.trim(),
    color: document.getElementById('fColor').value,
    icon:  document.getElementById('fIcon').value.trim(),
    since: document.getElementById('fSince').value.trim(),
    tags:  document.getElementById('fTags').value.split(/[、,，]/).map(s => s.trim()).filter(Boolean),
    intro: document.getElementById('fIntro').value.trim(),
    isMe:  document.getElementById('fMe').checked,
    sprite: padSprite,
  });
  const ok = Roster.save();
  document.getElementById('saveHint').textContent = ok ? '已存到這台裝置' : '⚠ 存不進去（瀏覽器空間或隱私模式）';
  editing = false; padSprite = null; render();
}

function newChar(){
  const c = Roster.upsert({ name: '新角色', color: '#9a9088', icon: '🙂' });
  Roster.save();
  sel = c.id; editing = true; padSprite = null; render();
}

function delChar(){
  const c = Roster.get(sel);
  if (!c) return;
  if (!confirm(`刪除「${c.name}」？既有紀錄裡的名字不會跟著消失。`)) return;
  Roster.remove(sel);
  Roster.save();
  sel = (Roster.all()[0] || {}).id || null;
  editing = false; render();
}

function doExport(){
  const blob = new Blob([Roster.exportJSON()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'roster.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function doImport(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      Roster.importJSON(r.result);
      Roster.save();
      sel = (Roster.all()[0] || {}).id || null;
      editing = false; render();
      document.getElementById('saveHint').textContent = '已匯入';
    } catch (e) { alert('匯入失敗：' + e.message); }
  };
  r.readAsText(f);
  input.value = '';
}

function render(){ renderCast(); renderCard(); }
render();
</script>
</body>
</html>
