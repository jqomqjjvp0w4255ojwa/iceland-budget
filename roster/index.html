<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>角色館 · 旅程書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@300;400&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* 這頁自己的：版面與角色館專用元件。外殼（顏色變數、標題、.back、.lede、
   .hint、.ln 按鈕、像素圖）都在 shared/base.css */
.wrap{position:relative; max-width:1240px; margin:0 auto; padding:clamp(20px,5vh,58px) clamp(18px,5vw,64px) 90px;}
.mark{margin:34px 0 4px;}

/* ══ 選角畫面：左邊被選中的人，右邊 n×n 選格 ══ */
.body{
  display:flex; gap:clamp(24px,4vw,56px); align-items:flex-start;
  margin-top:30px;
}

/* 選格：自己一個容器，n×n 排列，滿了就翻頁 */
.side{order:2; flex-shrink:0; width:clamp(258px,34vw,430px);}
.selbox{
  position:relative; padding:14px 12px 10px;
  background-image:radial-gradient(circle, var(--dotB) 1.2px, transparent 1.4px);
  background-size:8px 8px;
}
.selbox .inner{background:var(--space); padding:14px 12px 12px; box-shadow:2px 3px 0 rgba(0,0,0,.06);}
.selbox .cap{
  font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.22em;
  color:var(--faint); display:flex; align-items:baseline; gap:8px; margin-bottom:12px;
}
.selbox .cap b{font-weight:400; color:var(--ink); font-size:8px;}
.cast{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(78px, 1fr));
  gap:clamp(12px,1.6vw,20px) clamp(6px,1vw,12px);
  align-items:end; align-content:start;
  min-height:296px;                      /* 頁與頁之間不要跳動 */
}

/* 翻頁 */
.pager{
  display:flex; align-items:center; justify-content:flex-end; gap:10px;
  margin-top:14px; padding-top:12px; border-top:1px solid var(--faint);
}
.pager button{
  width:26px; height:26px; border-radius:50%; padding:0; cursor:pointer;
  border:1.5px solid var(--faint); background:none; color:var(--ink);
  font-size:12px; line-height:1; display:grid; place-items:center;
}
.pager button:hover:not(:disabled){border-color:var(--ink);}
.pager button:disabled{opacity:.32; cursor:default;}
.pager .no{
  font-family:Silkscreen,monospace; font-size:8px; letter-spacing:.16em;
  color:var(--faint); font-variant-numeric:tabular-nums; min-width:44px; text-align:center;
}
.pager .dots{display:flex; gap:5px; margin-right:auto;}
.pager .dots i{
  width:5px; height:5px; border-radius:50%; background:none;
  border:1px solid var(--faint); cursor:pointer;
}
.pager .dots i.on{background:var(--spark); border-color:var(--spark);}
.actor{
  position:relative; background:none; border:none; cursor:pointer; padding:10px 2px 6px;
  display:flex; flex-direction:column; align-items:center; gap:7px;
  transition:transform .16s cubic-bezier(.2,.85,.3,1.05);
}
.actor:hover{transform:translateY(-4px);}
.actor.on{transform:translateY(-4px);}
/* 遊標：四個角，只有線，沒有框 */
.actor .cur{
  position:absolute; inset:0; pointer-events:none; opacity:0;
  transition:opacity .15s, transform .15s;
  transform:scale(1.08);
}
.actor .cur path{fill:none; stroke:var(--faint); stroke-width:1.4; stroke-linecap:square;}
.actor:hover .cur{opacity:.55; transform:scale(1);}
.actor.on .cur{opacity:1; transform:scale(1);}
.actor.on .cur path{stroke:var(--spark); stroke-width:1.8;}
.actor .fig{width:38px; height:56px; display:grid; place-items:end center;}
.actor .fig svg{width:100%; height:100%; image-rendering:pixelated;}
.actor .ch-emoji{font-size:26px; line-height:1;}
.actor .nm{
  font-size:11.5px; letter-spacing:.04em; color:var(--faint);
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.actor:hover .nm{color:var(--ink);}
.actor.on .nm{color:var(--ink);}
.actor .me{
  position:absolute; top:1px; right:4px;
  font-family:Silkscreen,monospace; font-size:6.5px; letter-spacing:.16em; color:var(--spark);
}
.count{
  font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.2em;
  color:var(--faint); margin-top:22px; text-align:right;
}

/* 左右換人：大格自己的兩顆箭頭 */
.flip{
  position:absolute; top:50%; margin-top:-19px; z-index:3;
  width:38px; height:38px; border-radius:50%; padding:0; cursor:pointer;
  border:1.5px solid var(--faint); background:var(--space); color:var(--ink);
  font-size:15px; line-height:1; display:grid; place-items:center;
  transition:border-color .2s, transform .2s;
}
.flip:hover{border-color:var(--ink); transform:scale(1.08);}
.flip.prev{left:-6px;}
.flip.next{right:-6px;}

/* ══ 被選中的人：左邊那一大格 ══ */
.card{
  order:1; flex:1; min-width:0; position:relative;
  padding:26px clamp(30px,3.4vw,44px) 30px;
  background-image:radial-gradient(circle, var(--dotA) 1.5px, transparent 1.7px);
  background-size:7px 7px;
}
.card .sheet{background:var(--space); padding:clamp(18px,3vw,28px); box-shadow:3px 4px 0 rgba(0,0,0,.07);}
.card .top{display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap;}
.card .big{width:104px; height:158px; flex-shrink:0; display:grid; place-items:end center;}
.card .big svg{width:100%; height:100%; image-rendering:pixelated;}
.card .big .ch-emoji{font-size:44px;}
.card .id{flex:1; min-width:180px;}
.card .id h2{font-family:'Noto Serif TC',serif; font-weight:900; font-size:21px; letter-spacing:.16em; margin:0; display:flex; align-items:center; gap:10px;}
.card .id h2 .sw{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.card .id .alias{font-size:12px; color:var(--faint); margin-top:8px; letter-spacing:.08em; min-height:1em;}
.card .id .intro{font-size:13px; line-height:2; margin-top:15px; white-space:pre-wrap;}
.card .id .intro.empty{color:var(--faint);}
.tags{display:flex; flex-wrap:wrap; gap:7px; margin-top:15px;}
.tags span{font-size:10.5px; letter-spacing:.06em; color:var(--ink); border:1px solid var(--faint); padding:3px 9px;}
.mine{font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.2em; color:var(--space); background:var(--spark); padding:3px 7px;}
.stat{display:flex; flex-wrap:wrap; gap:0 26px; margin-top:22px; padding-top:18px; border-top:1px solid var(--faint);}
.stat div{font-size:11px; color:var(--faint); letter-spacing:.06em; padding:4px 0;}
.stat b{font-family:Silkscreen,monospace; font-size:13px; color:var(--ink); font-weight:400; margin-right:5px;}
.acts{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}

/* ══ 編輯 ══ */
.edit{margin-top:22px; padding-top:20px; border-top:1px solid var(--faint);}
.fld{margin-bottom:16px;}
.fld label{display:block; font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.2em; color:var(--faint); margin-bottom:7px;}
.fld input, .fld textarea{
  width:100%; background:none; border:none; border-bottom:1px solid var(--faint);
  font-family:'Noto Sans TC',sans-serif; font-size:14px; color:var(--ink);
  padding:5px 2px; font-weight:300;
}
.fld textarea{border:1px solid var(--faint); padding:10px; line-height:1.9; resize:vertical; min-height:86px;}
.fld input:focus, .fld textarea:focus{outline:none; border-color:var(--ink);}
.row2{display:flex; gap:18px; flex-wrap:wrap;}
.row2 .fld{flex:1; min-width:130px;}
.fld input[type=color]{height:34px; padding:0; border:1px solid var(--faint); cursor:pointer;}
.chk{display:flex; align-items:center; gap:9px; font-size:12.5px; cursor:pointer; color:var(--ink);}
.chk input{width:15px; height:15px; accent-color:var(--spark);}
.pad{margin-top:14px; display:none;}
.pad.open{display:block;}
.foot{
  display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  margin-top:40px; padding-top:20px; border-top:1px solid var(--faint);
}
.foot .sp{margin-left:auto;}

/* ══ 手機：點角色從下面彈出小窗 ══ */
.scrim{
  position:fixed; inset:0; background:rgba(40,30,20,.3); z-index:19;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.sheetclose{
  position:absolute; top:10px; right:12px; z-index:22; display:none;
  width:32px; height:32px; border-radius:50%;
  border:1.5px solid var(--faint); background:var(--space); color:var(--ink);
  font-size:14px; line-height:1; cursor:pointer; padding:0;
}

/* ══ 只有手機：點角色從下面彈出小窗 ══ */
@media (max-width:720px){
  .body{display:block;}
  .side{width:100%;}
  .cast{grid-template-columns:repeat(auto-fill, minmax(74px, 1fr)); gap:16px 6px;}
  .actor .fig{width:32px; height:48px;}
  .actor .nm{font-size:11.5px;}
  .count{text-align:left;}
  .flip.prev{left:6px;}
  .flip.next{right:6px;}
  .card .big{width:64px; height:98px;}

  .card{
    position:fixed; z-index:20; left:0; right:0; bottom:0; margin:0;
    max-height:88vh; overflow-y:auto; overscroll-behavior:contain;
    padding:16px 12px calc(24px + env(safe-area-inset-bottom));
    background-color:var(--space);
    box-shadow:0 -3px 0 rgba(0,0,0,.07);
    transform:translateY(102%);
    transition:transform .28s cubic-bezier(.2,.85,.3,1.05);
  }
  .card::before{                       /* 上緣的握把 */
    content:''; display:block; width:38px; height:3px; border-radius:2px;
    background:var(--faint); margin:0 auto 12px;
  }
  body.sheet{overflow:hidden;}
  body.sheet .card{transform:translateY(0);}
  body.sheet .scrim{opacity:1; pointer-events:auto;}
  .sheetclose{display:block;}
  .card .sheet{padding:16px 14px 20px;}
  .card .top{gap:16px;}

  @media (prefers-reduced-motion: reduce){ .card{transition:none;} }
}
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="../book/">← DESK</a>

  <div class="mark">
    <h1 class="zh">角 色 館</h1>
    <div class="en">ROSTER</div>
  </div>
  <p class="lede">一起走過的人，都在這裡。<br>兩本書共用同一份名冊。</p>

  <div class="body">
    <div class="card" id="card" role="group" aria-label="角色">
      <button class="sheetclose" onclick="closeSheet()" aria-label="關閉">✕</button>
      <button class="flip prev" onclick="flip(-1)" aria-label="上一位">‹</button>
      <button class="flip next" onclick="flip(1)" aria-label="下一位">›</button>
      <div id="cardBody"></div>
    </div>
    <div class="side">
      <div class="selbox">
        <div class="inner">
          <div class="cap">SELECT <b id="count"></b></div>
          <div class="cast" id="cast"></div>
          <div class="pager" id="pager"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">
    <button class="ln" onclick="newChar()">＋ 新角色</button>
    <button class="ln ghost" onclick="doExport()">匯出 JSON</button>
    <button class="ln ghost" onclick="document.getElementById('imp').click()">匯入</button>
    <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="doImport(this)">
    <span class="hint sp" id="saveHint">存在這台裝置的瀏覽器裡</span>
  </div>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>

<script src="../shared/util.js"></script>
<script src="../shared/theme.js"></script>
<script src="../shared/sprites.js"></script>
<script src="../shared/roster.js"></script>
<script src="../shared/pixelpad.js"></script>
<script>
Theme.mount();
Roster.startTicker();

// 出場統計：先用書桌抓下來的台灣打卡快取，統一版接上資料庫後換成 API。
// 舊資料的 who 欄存的是名字，所以用名字比對。
Roster.addStats(ch => {
  let data = null;
  try { data = JSON.parse(localStorage.getItem('book_tw_cache') || 'null'); } catch (e) {}
  if (!Array.isArray(data)) return null;
  const n = data.filter(c => c.who === ch.name && c.type !== 'wish').length;
  if (!n) return null;
  const days = new Set(data.filter(c => c.who === ch.name).map(c => String(c.time).slice(0, 10))).size;
  return [`<b>${n}</b>次島內腳印`, `<b>${days}</b>天出遊`];
});

const esc = U.esc;                      // shared/util.js

// 桌機一進來就攤開第一位；手機因為彈窗預設是收起的，不會擋畫面
let sel = (Roster.all()[0] || {}).id || null;
let editing = false;
let padSprite = null;      // 編輯中暫存的自畫像素圖

// 遊標：四個角，不是框
const CURSOR = `<svg class="cur" viewBox="0 0 40 60" preserveAspectRatio="none" aria-hidden="true">
  <path d="M 1 9 V 1 H 9 M 31 1 H 39 V 9 M 39 51 V 59 H 31 M 9 59 H 1 V 51"/></svg>`;

const PER_PAGE = 12;              // 一頁 12 位，滿了就翻頁
let page = 0;

function pageCount(){ return Math.max(1, Math.ceil(Roster.all().length / PER_PAGE)); }
function pageOf(id){
  const i = Roster.all().findIndex(c => c.id === id);
  return i < 0 ? 0 : Math.floor(i / PER_PAGE);
}
function goPage(p){
  page = Math.min(Math.max(0, p), pageCount() - 1);
  renderCast();
}

function renderCast(){
  const list = Roster.all();
  page = Math.min(page, pageCount() - 1);
  const box = document.getElementById('cast');
  box.innerHTML = list.slice(page * PER_PAGE, (page + 1) * PER_PAGE).map(c => `
    <button class="actor ${c.id === sel ? 'on' : ''}" data-id="${esc(c.id)}" title="${esc(c.name)}">
      ${CURSOR}
      ${c.isMe ? '<span class="me">ME</span>' : ''}
      <span class="fig">${Roster.spriteSvg(c)}</span>
      <span class="nm">${esc(c.name) || '？'}</span>
    </button>`).join('');
  document.getElementById('count').textContent = list.length + ' 位';
  box.querySelectorAll('.actor').forEach(el =>
    el.addEventListener('click', () => openSheet(el.dataset.id)));

  // 翻頁列：只有一頁就不佔位置
  const pg = document.getElementById('pager');
  const n = pageCount();
  if (n <= 1){ pg.innerHTML = ''; pg.style.display = 'none'; return; }
  pg.style.display = '';
  pg.innerHTML = `
    <div class="dots">${Array.from({ length:n }, (_, i) =>
      `<i class="${i === page ? 'on' : ''}" data-p="${i}" title="第 ${i + 1} 頁"></i>`).join('')}</div>
    <button ${page === 0 ? 'disabled' : ''} data-step="-1" aria-label="上一頁">‹</button>
    <span class="no">${page + 1} / ${n}</span>
    <button ${page === n - 1 ? 'disabled' : ''} data-step="1" aria-label="下一頁">›</button>`;
  pg.querySelectorAll('button[data-step]').forEach(b =>
    b.addEventListener('click', () => goPage(page + (+b.dataset.step))));
  pg.querySelectorAll('.dots i').forEach(d =>
    d.addEventListener('click', () => goPage(+d.dataset.p)));
}

/* ══ 左右換人：大格的箭頭、鍵盤方向鍵、手機上滑動 ══ */
function flip(step){
  const list = Roster.all();
  if (!list.length) return;
  const i = list.findIndex(c => c.id === sel);
  const next = list[((i < 0 ? 0 : i + step) + list.length) % list.length];
  sel = next.id; editing = false; padSprite = null;
  page = pageOf(sel);                    // 換到別頁的人時，選格跟著翻過去
  render();
  const el = document.querySelector('.actor.on');
  if (el) el.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

/* ══ 選角色：桌機就在下面換內容，手機才彈出小窗 ══ */
const isPhone = () => window.matchMedia('(max-width:720px)').matches;

function openSheet(id){
  sel = id; editing = false; padSprite = null;
  page = pageOf(sel);
  render();
  if (isPhone()){
    document.body.classList.add('sheet');
    document.getElementById('card').scrollTop = 0;
  }
}
function closeSheet(){
  document.body.classList.remove('sheet');
  editing = false; padSprite = null;
  // 桌機沒有「關掉」這回事，卡片一直在，就退回第一位
  sel = isPhone() ? null : ((Roster.all()[0] || {}).id || null);
  render();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('sheet')){ closeSheet(); return; }
  if (editing) return;                                  // 編輯時方向鍵歸輸入框
  if (/^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''))) return;
  if (e.key === 'ArrowLeft'){ e.preventDefault(); flip(-1); }
  if (e.key === 'ArrowRight'){ e.preventDefault(); flip(1); }
});

// 手機彈窗上左右滑動也能換人
(function(){
  let x0 = null, y0 = null;
  const card = () => document.getElementById('card');
  document.addEventListener('touchstart', e => {
    if (!document.body.classList.contains('sheet') || editing) return;
    if (!card().contains(e.target)) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive:true });
  document.addEventListener('touchend', e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    x0 = y0 = null;
    if (Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.6) flip(dx < 0 ? 1 : -1);
  }, { passive:true });
})();
// 轉螢幕方向／改視窗寬度時，彈窗狀態不要卡住
window.addEventListener('resize', () => {
  if (!isPhone() && document.body.classList.contains('sheet')){
    document.body.classList.remove('sheet');
    if (!sel) { sel = (Roster.all()[0] || {}).id || null; render(); }
  }
});

function renderCard(){
  const box = document.getElementById('cardBody');
  const c = Roster.get(sel);
  if (!c){
    box.innerHTML = '<div class="sheet"><p class="hint">名冊是空的。按下面的「＋ 新角色」開始。</p></div>';
    return;
  }

  if (editing){ box.innerHTML = editForm(c); bindEdit(c); return; }

  const st = Roster.stats(c);
  box.innerHTML = `
    <div class="sheet">
      <div class="top">
        <div class="big">${Roster.spriteSvg(c)}</div>
        <div class="id">
          <h2><span class="sw" style="background:${esc(c.color)}"></span>${esc(c.name) || '未命名'}
            ${c.isMe ? '<span class="mine">ME</span>' : ''}</h2>
          <div class="alias">${esc(c.alias)}</div>
          <div class="intro ${c.intro ? '' : 'empty'}">${c.intro ? esc(c.intro) : '還沒有介紹。按「編輯」寫幾句。'}</div>
          ${c.tags && c.tags.length ? `<div class="tags">${c.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
        </div>
      </div>
      <div class="stat">
        ${st.length ? st.map(s => `<div>${s}</div>`).join('')
          : '<div>出場統計要等統一版接上資料後才會有。</div>'}
        ${c.since ? `<div><b>${esc(c.since)}</b>起同行</div>` : ''}
      </div>
      <div class="acts">
        <button class="ln" onclick="startEdit()">編輯</button>
        <a class="ln" href="../shared/spritetool.html" target="_blank">像素圖工具</a>
      </div>
    </div>`;
}

function editForm(c){
  return `
    <div class="sheet">
      <div class="edit" style="margin-top:0; padding-top:0; border:none;">
        <div class="row2">
          <div class="fld"><label>NAME 名字</label><input id="fName" value="${esc(c.name)}"></div>
          <div class="fld"><label>ALIAS 稱號</label><input id="fAlias" value="${esc(c.alias)}" placeholder="一句話身分"></div>
        </div>
        <div class="row2">
          <div class="fld" style="max-width:110px;"><label>COLOR 代表色</label><input type="color" id="fColor" value="${esc(c.color || '#9a9088')}"></div>
          <div class="fld" style="max-width:110px;"><label>EMOJI 備援</label><input id="fIcon" value="${esc(c.icon)}" maxlength="4"></div>
          <div class="fld" style="max-width:130px;"><label>SINCE 起始年</label><input id="fSince" value="${esc(c.since)}" placeholder="2019"></div>
        </div>
        <div class="fld"><label>TAGS 標籤（逗號分隔）</label><input id="fTags" value="${esc((c.tags || []).join('、'))}" placeholder="怕冷、負責訂房"></div>
        <div class="fld"><label>INTRO 介紹</label><textarea id="fIntro" placeholder="這個人是誰、跟你怎麼認識、旅行時負責什麼。">${esc(c.intro)}</textarea></div>
        <div class="fld">
          <label>ME 本人</label>
          <label class="chk"><input type="checkbox" id="fMe" ${c.isMe ? 'checked' : ''}>
            這是我（打卡時預設的記錄者，只能有一位）</label>
        </div>
        <div class="fld">
          <label>SPRITE 像素圖</label>
          <div class="acts" style="margin-top:0;">
            <button class="ln" onclick="togglePad()">🎨 用畫板畫</button>
            <button class="ln ghost" id="padClear" style="display:${(padSprite || c.sprite) ? '' : 'none'}"
              onclick="clearSprite()">✕ 清除自畫圖</button>
          </div>
          <p class="hint" style="margin:9px 0 0;">
            ${c.spriteKey ? `目前用 spritetool 綁定的動畫（${esc(c.spriteKey)}），自畫圖不會蓋掉它。` : '沒有綁定動畫，自畫圖就是頭像。'}
          </p>
          <div class="pad" id="pad"></div>
        </div>
        <div class="acts">
          <button class="ln warm" onclick="saveEdit()">儲存</button>
          <button class="ln ghost" onclick="editing=false;padSprite=null;render();">取消</button>
          <button class="ln ghost" style="margin-left:auto;color:var(--faint)" onclick="delChar()">刪除這位角色</button>
        </div>
      </div>
    </div>`;
}

function bindEdit(c){
  padSprite = padSprite || c.sprite || null;
}

function startEdit(){ editing = true; padSprite = null; render(); }

function togglePad(){
  const el = document.getElementById('pad');
  el.classList.toggle('open');
  if (el.classList.contains('open') && !el.dataset.ready){
    PixelPad.mount(el, { onDone: res => { padSprite = res.svgData ? { rects: res.svgData, grid: res.grid } : null; } });
    const c = Roster.get(sel);
    const s = padSprite || (c && c.sprite);
    if (s && s.rects) PixelPad.loadRects(s.rects, s.grid);
    el.dataset.ready = '1';
  }
}
function clearSprite(){
  padSprite = null;
  const c = Roster.get(sel); if (c) c.sprite = null;
  document.getElementById('padClear').style.display = 'none';
}

function saveEdit(){
  const c = Roster.get(sel);
  const name = document.getElementById('fName').value.trim();
  if (!name){ alert('名字不能空白'); return; }
  // 畫板開著就把當下的畫收進來，不用先按畫板自己的完成鍵
  if (document.getElementById('pad').dataset.ready){
    const r = PixelPad.getResult();
    if (r.svgData) padSprite = { rects: r.svgData, grid: r.grid };
  }
  Roster.upsert({
    id: c.id,
    name,
    alias: document.getElementById('fAlias').value.trim(),
    color: document.getElementById('fColor').value,
    icon:  document.getElementById('fIcon').value.trim(),
    since: document.getElementById('fSince').value.trim(),
    tags:  document.getElementById('fTags').value.split(/[、,，]/).map(s => s.trim()).filter(Boolean),
    intro: document.getElementById('fIntro').value.trim(),
    isMe:  document.getElementById('fMe').checked,
    sprite: padSprite,
  });
  const ok = Roster.save();
  document.getElementById('saveHint').textContent = ok ? '已存到這台裝置' : '⚠ 存不進去（瀏覽器空間或隱私模式）';
  editing = false; padSprite = null; render();
}

function newChar(){
  const c = Roster.upsert({ name: '新角色', color: '#9a9088', icon: '🙂' });
  Roster.save();
  openSheet(c.id);
  editing = true; render();
}

function delChar(){
  const c = Roster.get(sel);
  if (!c) return;
  if (!confirm(`刪除「${c.name}」？既有紀錄裡的名字不會跟著消失。`)) return;
  Roster.remove(sel);
  Roster.save();
  closeSheet();
}

function doExport(){
  const blob = new Blob([Roster.exportJSON()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'roster.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function doImport(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      Roster.importJSON(r.result);
      Roster.save();
      closeSheet();
      document.getElementById('saveHint').textContent = '已匯入';
    } catch (e) { alert('匯入失敗：' + e.message); }
  };
  r.readAsText(f);
  input.value = '';
}

function render(){ renderCast(); renderCard(); }
render();
</script>
</body>
</html>
