<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界旅人帳</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  min-height:100vh;
  background:#1d2530;
  font-family:'Silkscreen',monospace;
  color:#e8e4dc;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:28px;padding:24px;
}
h1{font-size:18px;letter-spacing:3px;}
.sub{font-size:9px;color:#8a95a4;letter-spacing:2px;margin-top:6px;text-align:center;}
.cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.card{
  width:200px;padding:22px 18px;
  border:2px solid #3f4b5a;border-radius:10px;
  background:#2b3440;color:#e8e4dc;text-decoration:none;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:4px 4px 0 rgba(0,0,0,0.3);
  transition:transform .1s;
}
.card:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(0,0,0,0.3);}
.card:active{transform:translate(1px,1px);box-shadow:2px 2px 0 rgba(0,0,0,0.3);}
.card .flag{font-size:36px;}
.card .name{font-size:12px;letter-spacing:1px;}
.card .desc{font-size:8px;color:#8a95a4;text-align:center;line-height:1.6;}
.card.tw{border-color:#e0b35e;background:#fffaf0;color:#5a4632;}
.card.tw .desc{color:#b3946a;}
.foot{font-size:8px;color:#5a6577;letter-spacing:1px;}
</style>
</head>
<body>
  <div style="text-align:center;">
    <h1>🌏 世界旅人帳</h1>
    <div class="sub">WORLD TRAVELERS' LEDGER</div>
  </div>
  <div class="cards">
    <a class="card tw" href="taiwan/">
      <div class="flag">🍉</div>
      <div class="name">台灣腳印日記</div>
      <div class="desc">日常打卡 · 小旅程 · 縣市踩點</div>
    </a>
    <a class="card" href="iceland/">
      <div class="flag">🇮🇸</div>
      <div class="name">冰島小帳</div>
      <div class="desc">Iceland 2026 夏 · 旅遊計劃</div>
    </a>
  </div>
  <div class="foot">more journeys to come…</div>
</body>
</html>
