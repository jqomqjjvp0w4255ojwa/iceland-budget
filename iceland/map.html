<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>腳印地圖</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="sprites.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#222a34;
  --panel:#2b3440;
  --panel2:#323d4b;
  --border:#3f4b5a;
  --text:#e8e4dc;
  --muted:#8a95a4;
  --accent:#d05868;
  --accent2:#5a9ab8;
  --gold:#d8a838;
  --green:#5aa86a;
  --px:'Silkscreen',monospace;
  --radius:8px;
}

html,body{overscroll-behavior:none;}
body{
  background:var(--bg);
  font-family:var(--px);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  color:var(--text);
}

/* ── 頂部標題列 */
.topbar{
  background:var(--panel);
  border-bottom:1.5px solid var(--border);
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
  z-index:1000;
}
.topbar-menu{font-size:16px;cursor:pointer;color:var(--muted);padding:2px 6px;}
.topbar-menu:active{color:var(--text);}
.topbar-title{font-size:11px;color:var(--text);letter-spacing:1px;flex:1;}
.topbar-members{display:flex;gap:6px;}
.member-avatar{
  width:30px;height:30px;border-radius:4px;
  border:2px solid var(--border);
  background:var(--panel2);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;
  image-rendering:pixelated;
  overflow:hidden;
}
.member-avatar.on{border-color:var(--accent);}
.member-avatar svg{width:100%;height:100%;image-rendering:pixelated;}

/* ── 主區域 */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}

/* ── 地圖 */
.map-wrap{flex:1;position:relative;min-height:0;}
#map{
  width:100%;height:100%;
  /* 防止 iOS 長按出現放大鏡/選取/拷貝選單 */
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
#map *{-webkit-touch-callout:none;}
/* 復古地圖色調 */
#map.retro .leaflet-tile-pane{filter:sepia(.35) saturate(.75) hue-rotate(-8deg) brightness(.96);}
#map.dark .leaflet-tile-pane{filter:none;}

/* ── 地圖上的浮動按鈕 */
.map-fab{position:absolute;z-index:500;}
.map-fab.layers{top:84px;left:12px;}   /* 縮放 +/− 正下方 */
.map-fab.checkin{bottom:16px;right:12px;}

.fab-btn{
  background:var(--panel);
  border:2px solid var(--border);
  border-radius:var(--radius);
  padding:8px 14px;
  font-family:var(--px);
  font-size:10px;
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  box-shadow:2px 2px 0 rgba(0,0,0,0.3);
}
/* 打卡鈕：改用金色＋像素腳印，跟足跡連線、像素風主視覺一致
   （原本的粉紅圓底配 emoji 跟整體調性搭不起來） */
.fab-btn.primary{
  background:var(--gold);
  border:2px solid #8a6a1c;
  width:48px;height:48px;
  border-radius:50%;
  padding:0;
  justify-content:center;
  box-shadow:2px 2px 0 rgba(0,0,0,0.35);
}
.fab-btn.primary:active{
  transform:translate(1px,1px);
  box-shadow:1px 1px 0 rgba(0,0,0,0.35);
}
.fab-btn.square{
  width:34px;height:34px;
  padding:0;justify-content:center;
  font-size:15px;
}
.fab-btn:active{transform:translate(1px,1px);}

/* ── 圖層選單 */
.layers-menu{
  display:none;
  position:absolute;
  top:124px;left:12px;
  z-index:600;
  background:var(--panel);
  border:2px solid var(--border);
  border-radius:var(--radius);
  box-shadow:3px 3px 0 rgba(0,0,0,0.3);
  padding:10px 12px;
  min-width:170px;
}
.layers-menu.show{display:block;}
.layers-section{font-size:8px;color:var(--muted);letter-spacing:1px;margin:8px 0 6px;}
.layers-section:first-child{margin-top:0;}
.layer-opt{
  display:flex;align-items:center;gap:8px;
  padding:6px 4px;
  font-size:9px;color:var(--text);
  cursor:pointer;user-select:none;-webkit-user-select:none;
  border-radius:4px;
}
.layer-opt:active{background:var(--panel2);}
.layer-check{
  width:14px;height:14px;flex-shrink:0;
  border:1.5px solid var(--border);
  border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:#fff;
  background:var(--panel2);
}
.layer-opt.on .layer-check{background:var(--accent);border-color:var(--accent);}
.layer-opt.on .layer-check::after{content:'✓';}
.style-opt .layer-check{border-radius:50%;}
.style-opt.on .layer-check::after{content:'●';font-size:7px;}

/* ── 時間軸滑桿 */
/* 日期列：橫向捲動，視覺語言比照日程頁的 D1–D15 跳轉列 */
.day-bar{
  /* 左邊讓開縮放 +/− 那一欄，不然會疊在一起 */
  position:absolute;left:58px;right:12px;top:10px;
  z-index:600;display:flex;align-items:center;gap:6px;
  background:var(--panel);border:2px solid var(--border);
  border-radius:var(--radius);padding:5px 7px;
  box-shadow:2px 2px 0 rgba(0,0,0,0.3);
}
.day-scroll{
  flex:1;display:flex;align-items:center;gap:4px;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;
}
.day-scroll::-webkit-scrollbar{display:none;height:0;}
.day-chip{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:1px;
  background:transparent;border:1px solid var(--border2);border-radius:6px;
  color:var(--muted);cursor:pointer;padding:3px 8px;font-family:inherit;line-height:1.1;
}
.day-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.day-chip.today{border-color:var(--gold);color:var(--gold);}
.day-chip.today.on{color:#fff;}
.day-chip .d-num{font-size:11px;font-weight:700;}
.day-chip .d-date{font-size:8px;opacity:.8;}
.day-chip.all{padding:6px 9px;font-size:10px;}

.time-bar{
  position:absolute;left:12px;right:12px;bottom:16px;
  z-index:600;
  display:flex;align-items:center;gap:10px;
  background:var(--panel);
  border:2px solid var(--border);
  border-radius:var(--radius);
  padding:8px 12px;
  box-shadow:2px 2px 0 rgba(0,0,0,0.3);
}
.time-play{
  flex-shrink:0;width:30px;height:30px;
  background:var(--accent);border:none;border-radius:6px;
  color:#fff;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;
}
.time-bar input[type=range]{
  flex:1;min-width:0;height:4px;
  -webkit-appearance:none;appearance:none;
  background:var(--border);border-radius:2px;outline:none;cursor:pointer;
  touch-action:none;
}
.time-bar input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--gold);border:2px solid var(--bg);cursor:pointer;
}
.time-label{font-size:8px;color:var(--muted);white-space:nowrap;flex-shrink:0;}
.time-step{
  flex-shrink:0;width:26px;height:26px;
  background:var(--panel2);border:1.5px solid var(--border);border-radius:5px;
  color:var(--text);font-family:var(--px);font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;
}
.time-step:active{background:var(--border);}

/* ── 底部卡片區（抽屜式） */
.card-drawer{
  background:var(--panel);
  border-top:1.5px solid var(--border);
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  transition:height .3s ease;
  height:54px;
  overflow:hidden;
  z-index:500;
}
.card-drawer.expanded{height:55vh;}

.drawer-handle{
  display:flex;
  flex-direction:column;
  padding:6px 14px 0;
  cursor:grab;
  flex-shrink:0;
  gap:4px;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}
.drawer-pill{
  width:40px;height:4px;
  background:var(--border);
  border-radius:2px;
  margin:0 auto;
  flex-shrink:0;
}
.drawer-row{display:flex;align-items:center;gap:10px;width:100%;padding-bottom:4px;}
.drawer-tabs{display:flex;gap:0;flex:1;}
.dtab{
  font-family:var(--px);
  font-size:9px;
  padding:4px 10px;
  border:none;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  border-bottom:2px solid transparent;
  white-space:nowrap;
}
.dtab.on{color:var(--accent);border-bottom-color:var(--accent);}

.card-list{
  overflow-y:auto;
  flex:1;
  padding:8px;
}

/* ── 打卡卡片 */
.diary-card{
  display:flex;
  gap:10px;
  padding:10px;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:8px;
  cursor:pointer;
  transition:box-shadow .1s;
}
.diary-card:active{box-shadow:inset 0 0 0 2px var(--border);}
.diary-thumb{
  width:56px;height:56px;
  border-radius:4px;
  border:1px solid var(--border);
  flex-shrink:0;
  background:#faf6ee;
  image-rendering:pixelated;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
.diary-thumb img,.diary-thumb svg{width:100%;height:100%;image-rendering:pixelated;}
.diary-info{flex:1;min-width:0;}
.diary-name{font-size:10px;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.diary-meta{display:flex;gap:6px;align-items:center;margin-bottom:4px;}
.diary-tag{
  font-size:8px;padding:2px 6px;border-radius:3px;
  font-family:var(--px);white-space:nowrap;
}
.tag-checkin{background:#4a2a32;color:#f0a0b0;border:1px solid #7a4050;}
.tag-sched{background:#1c3a4a;color:#60c8e8;border:1px solid #30647a;}
/* 計畫節點：純色圓點。旁邊都是 emoji pin，圓點要夠重才不會被吃掉 */
.sched-pin{
  width:15px;height:15px;border-radius:50%;
  background:#1e88d0;border:3px solid #fff;
  box-shadow:0 0 0 1.5px rgba(0,0,0,.45), 1px 1px 2px rgba(0,0,0,.35);
}
.sched-pin.ref{
  width:11px;height:11px;border-width:2px;
  background:#5fb8e8;box-shadow:0 0 0 1px rgba(0,0,0,.4);
}
.sched-emoji{
  font-size:18px;line-height:1;text-align:center;
  filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.4));
}
/* 路線圖例 */
.route-legend{
  position:absolute;left:12px;bottom:16px;z-index:550;
  display:flex;gap:10px;align-items:center;
  background:var(--panel);border:2px solid var(--border);border-radius:var(--radius);
  padding:4px 9px;font-family:var(--px);font-size:8px;color:var(--text);
  box-shadow:2px 2px 0 rgba(0,0,0,0.3);
}
.route-legend span{display:flex;align-items:center;gap:4px;}
.lg-line{width:18px;height:3px;display:inline-block;border-radius:2px;background:#2f8fd0;}
.lg-line.real{background:#c08a10;}

/* 預覽模式：只留地圖本身，其餘操作介面全部收起來 */
body.preview .topbar,
body.preview .card-drawer,
body.preview .map-fab,
body.preview .day-bar,
body.preview .time-bar,
body.preview .route-legend,
body.preview .layers-menu{display:none !important;}
body.preview #map{top:0 !important;height:100% !important;}

/* 路線頭尾記號：空心圈＝起點，實心點＝終點 */
.route-end{width:12px;height:12px;border-radius:50%;}
.route-end.start{background:#fff;border:2.5px solid;}
.route-end.finish{border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);}
.tag-stay{background:#1e3a4a;color:#80c0e0;border:1px solid #356a88;}
.tag-expense{background:#1e4030;color:#8ad8a8;border:1px solid #357a52;}
.diary-date{font-size:8px;color:var(--muted);}
.diary-note{font-size:9px;color:var(--muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.diary-footer{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
.diary-comments{font-size:8px;color:var(--muted);}
.diary-author{width:20px;height:30px;flex-shrink:0;}
.diary-author svg{width:100%;height:100%;image-rendering:pixelated;}

/* ── Popup */
.px-popup{
  font-family:var(--px) !important;
  min-width:220px;
}
.px-popup .leaflet-popup-content-wrapper{
  background:var(--panel);
  color:var(--text);
  border:2px solid var(--border);
  border-radius:var(--radius);
  box-shadow:4px 4px 0 rgba(0,0,0,0.35);
  padding:0;
}
.px-popup .leaflet-popup-tip{background:var(--panel);border:1px solid var(--border);}
.px-popup .leaflet-popup-content{margin:0;width:auto !important;}
.popup-inner{padding:12px 14px;}
.popup-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.popup-icon{width:28px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.popup-icon svg{width:100%;height:100%;image-rendering:pixelated;}
.popup-title{font-size:10px;color:var(--text);flex:1;}
.popup-img{
  width:100%;aspect-ratio:1;
  background:#faf6ee;
  border-radius:4px;
  border:1px solid var(--border);
  image-rendering:pixelated;
  margin-bottom:8px;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.popup-img svg,.popup-img img{width:100%;height:100%;image-rendering:pixelated;object-fit:contain;}
.popup-note{font-size:9px;color:var(--text);line-height:1.6;margin-bottom:8px;}
.popup-actions{display:flex;gap:6px;margin-top:10px;border-top:1px solid var(--border);padding-top:8px;}
.popup-action-btn{
  flex:1;padding:7px 6px;
  border:1px solid var(--border);
  background:var(--panel2);
  font-family:var(--px);font-size:8px;
  color:var(--text);cursor:pointer;
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.popup-action-btn:active{background:var(--border);}
.popup-more{
  flex-shrink:0;align-self:flex-start;
  background:none;border:1px solid var(--border);border-radius:4px;
  color:var(--muted);font-family:var(--px);font-size:12px;
  padding:1px 8px;cursor:pointer;line-height:1.4;
}
.popup-more:active{color:var(--text);background:var(--panel2);}
/* 「…」下拉選單（貼著按鈕展開，蓋在塗鴉之上） */
.popup-header{position:relative;z-index:100;}
.popup-img{position:relative;z-index:0;}
.popup-extra{
  display:none;
  position:absolute;top:26px;right:0;
  flex-direction:column;gap:4px;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:6px;
  min-width:100px;
  z-index:999;
  box-shadow:2px 2px 0 rgba(0,0,0,0.35);
}
.popup-extra .popup-action-btn{background:transparent;border:none;justify-content:flex-start;padding:7px 10px;}

/* ── Modal 共用 */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.6);
  z-index:2000;
  align-items:flex-end;justify-content:center;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:var(--panel);
  border-radius:12px 12px 0 0;
  border-top:2px solid var(--border);
  width:100%;max-width:480px;
  max-height:90vh;
  overflow-y:auto;
}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--panel);z-index:1;
}
.modal-title{font-size:11px;color:var(--text);letter-spacing:1px;}
.modal-close{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;}
.modal-body{padding:14px 16px;}

.step-row{margin-bottom:16px;}
.step-label{
  display:flex;align-items:center;gap:8px;
  font-size:9px;color:var(--muted);
  margin-bottom:8px;letter-spacing:1px;
}
.step-num{
  width:18px;height:18px;border-radius:50%;
  background:var(--accent);color:#fff;
  font-size:9px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}

/* 類型選擇 */
.type-row{display:flex;gap:8px;}
.type-chip{
  flex:1;padding:10px 6px;
  border:2px solid var(--border);
  border-radius:var(--radius);
  background:var(--panel2);
  font-family:var(--px);font-size:10px;color:var(--text);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.type-chip.on{border-color:var(--accent);background:#3c2a32;color:#f0a0b0;}

.location-card{
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:10px 12px;
  display:flex;align-items:center;gap:10px;
  cursor:pointer;
  background:var(--panel2);
}
.location-card:active{background:var(--border);}
.location-name{font-size:10px;color:var(--text);flex:1;}
.location-coord{font-size:8px;color:var(--muted);}
.location-edit{font-size:16px;color:var(--muted);}

.name-input{
  width:100%;
  background:var(--panel2);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:10px 12px;
  font-family:var(--px);font-size:10px;
  color:var(--text);outline:none;
  margin-top:8px;
}
.name-input:focus{border-color:var(--accent);}

.member-grid{display:flex;gap:8px;flex-wrap:wrap;}
.member-choice{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 12px;
  border:2px solid var(--border);
  border-radius:var(--radius);
  cursor:pointer;
  background:var(--panel2);
  position:relative;
  min-width:70px;
}
.member-choice.on{border-color:var(--accent);background:#3c2a32;}
.member-choice .check{
  position:absolute;top:-6px;right:-6px;
  width:16px;height:16px;
  background:var(--accent);border-radius:50%;
  display:none;align-items:center;justify-content:center;
  font-size:10px;color:#fff;
}
.member-choice.on .check{display:flex;}
.member-choice-avatar{width:32px;height:52px;image-rendering:pixelated;display:flex;align-items:center;justify-content:center;}
.member-choice-avatar svg{width:100%;height:100%;image-rendering:pixelated;}
.member-choice-name{font-size:8px;color:var(--text);}

.diary-textarea{
  width:100%;
  background:var(--panel2);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:10px 12px;
  font-family:var(--px);
  font-size:10px;
  color:var(--text);
  resize:none;
  height:90px;
  outline:none;
  line-height:1.6;
}
.diary-textarea:focus{border-color:var(--accent);}
.char-count{font-size:8px;color:var(--muted);text-align:right;margin-top:4px;}

.draw-preview-row{display:flex;gap:10px;align-items:center;}
.draw-thumb{
  width:64px;height:64px;
  border:2px solid var(--border);
  border-radius:6px;
  background:#faf6ee;
  image-rendering:pixelated;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;flex-shrink:0;
}
.draw-thumb svg{width:100%;height:100%;image-rendering:pixelated;}
.draw-edit-btn{
  flex:1;padding:10px;
  border:1.5px solid var(--accent);
  background:#3c2a32;
  color:#f0a0b0;
  font-family:var(--px);font-size:10px;
  border-radius:var(--radius);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.draw-edit-btn:active{background:#4a3038;}

.submit-btn{
  width:100%;padding:14px;
  background:var(--accent);

/* ── 留言 Modal */
.comment-item{

}
.comment-item:last-child{border-bottom:none;}

/* ── 自訂 cluster（無泡泡，數字直接顯示在下方） */

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// ══════════════════════════════════════════
//  設定（從 config.js 讀）
// ══════════════════════════════════════════
const TRIP_CONFIG = window.TRIP_CONFIG || {};
const R2_WORKER = TRIP_CONFIG.r2Worker || 'https://worker-little-field-805c.xfish7.workers.dev';

// ══════════════════════════════════════════
//  成員 sprite（從 sprites.js 讀，第 1 格靜態）
// ══════════════════════════════════════════
// ── 文字跳脫（Sheet／使用者輸入進 innerHTML 前用）
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function spriteSvg(m, attrs) {
  const frames = window.SPRITES?.[m.spriteKey];
  if (frames?.[0]) {
    return `<svg viewBox="0 0 16 28" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;image-rendering:pixelated;display:block;" ${attrs||''}>${frames[0]}</svg>`;
  }
  return `<span style="font-size:16px;">${m.icon||'📍'}</span>`;
}

// 成員小圖示（spritetool 綁定的 iconKey 單格圖；沒有就用 emoji）
function iconSvg(m) {
  const frame = m.iconKey && window.SPRITES?.[m.iconKey];
  if (frame) {
    const g = m.iconGrid || 16;
    return `<svg viewBox="0 0 ${g} ${g}" style="width:100%;height:100%;image-rendering:pixelated;display:block;">${frame}</svg>`;
  }
  return `<span style="font-size:16px;">${m.icon||'📍'}</span>`;
}

// ══════════════════════════════════════════
//  住宿點（從 GAS ?sheet=staymap 載入）
// ══════════════════════════════════════════
let STAYS = [];

async function loadStays() {
  const gasBase = TRIP_CONFIG.apiBase || '';
  if (!gasBase) return;
  try {
    const res = await fetch(gasBase + '?sheet=staymap', { cache:'no-store' });
    const data = await res.json();
    if (data.stays && Array.isArray(data.stays)) {
      STAYS = data.stays.map((s, i) => ({ id:'s'+i, ...s }));
      renderStayLine();
      buildSched();
      renderMarkers();
    }
  } catch(e) { console.warn('住宿資料載入失敗', e); }
}

// 打卡資料（從 GAS 載入）
let checkins = [];
// 消費資料（從帳簿 sheet 讀，有座標的才會出現）
let expenses = [];
// 住宿轉成列表項目（卡片/分頁用）
function stayItems() {
  return STAYS.map(s => ({
    id: s.id, type: 'stay', who: '',
    name: s.name, date: s.date,
    lat: s.lat, lng: s.lng,
    note: '', time: '',
  }));
}
// ── 日程（計畫）資料：從「日程」表讀，有座標的才上地圖
// 主要節點＝景點/住宿/活動/補給；參考點是附屬層級，另外用圖層開關控制
let SCHED = [];          // [{id,type:'sched',dayNum,dayKey,category,title,note,place,lat,lng,stay,url,isRef}]
let SCHED_DAYS = [];     // [{key:'9/17', dayNum:4, d:Date}] 只含有座標的日子

const SCHED_MAIN_CATS = ['景點', '住宿', '活動', '補給', '其他'];
const SCHED_ICONS = { '景點':'📍', '住宿':'🏠', '活動':'🎯', '補給':'🛒', '參考':'·', '其他':'🚗' };

// 參考點是附屬層級：縮小看全局時不顯示，放大到一定倍率才浮出來
// （手動勾選「參考點」圖層可強制顯示，當作覆寫）
const REF_ZOOM = 10;
function schedItems() {
  return SCHED.filter(x => {
    if (!x.isRef) return filters.sched;
    if (!filters.sched) return false;
    return filters.ref || map.getZoom() >= REF_ZOOM;
  });
}

// 地圖上所有項目（打卡 + 消費 + 住宿 + 日程）
function allItems() { return checkins.concat(expenses, stayItems(), schedItems()); }

// 「9/17」→ Date（行程都在同一年，年份取自 config 的出發日）
function schedParseDate(s, year) {
  const m = String(s || '').match(/(\d{1,2})\s*[\/月-]\s*(\d{1,2})/);
  return m ? new Date(year, +m[1] - 1, +m[2]) : null;
}

let SCHED_RAW = [];
let _dayAutoDone = false;   // 只在第一次載入時自動跳到今天

// 日程離線快取：地圖最需要行程圖層的場景就是荒野沒訊號的時候，
// 所以先用上次存的立刻畫，抓到新的再覆蓋（跟主頁 localStorage 快取同一套思路）
const SCHED_CACHE_KEY = 'cached_iceland_schedule';

async function loadSchedule() {
  try {
    const cached = JSON.parse(localStorage.getItem(SCHED_CACHE_KEY) || 'null');
    if (Array.isArray(cached) && cached.length) { SCHED_RAW = cached; buildSched(); }
  } catch(e) { /* 快取壞了就當沒有 */ }

  const gasBase = TRIP_CONFIG.apiBase || '';
  if (!gasBase) return;
  try {
    const res = await fetch(gasBase + '?sheet=schedule&_=' + Date.now(), { cache:'no-store' });
    const data = await res.json();
    const rows = Array.isArray(data.schedule) ? data.schedule : [];
    if (!rows.length) return;   // 伺服器回空的不覆蓋快取，離線資料比沒有好
    SCHED_RAW = rows;
    try { localStorage.setItem(SCHED_CACHE_KEY, JSON.stringify(rows)); } catch(e) {}
    buildSched();
  } catch(e) { console.warn('日程載入失敗，使用快取資料', e); }
}

// 住宿座標要等住宿表載入才補得齊，所以兩邊載完都呼叫這裡重建一次
function buildSched() {
  try {
    const rows = SCHED_RAW.map(r => ({ ...r }));
    if (!rows.length) return;
    const year = new Date(TRIP_CONFIG.dates?.depart || Date.now()).getFullYear();

    // 先算出每個日期是第幾天（依日期排序，不管有沒有座標）
    const dayOrder = [];
    rows.forEach(r => {
      const d = schedParseDate(r.date, year);
      if (d && !dayOrder.some(x => x.key === r.date)) dayOrder.push({ key:r.date, d });
    });
    dayOrder.sort((a,b) => a.d - b.d);
    // D1＝抵達冰島那天；出發、轉機那幾天是 D0、D-1
    const arr = TRIP_CONFIG.dates?.arrive ? new Date(TRIP_CONFIG.dates.arrive) : null;
    let base = 0;
    if (arr) {
      const i = dayOrder.findIndex(x =>
        x.d.getMonth() === arr.getUTCMonth() && x.d.getDate() === arr.getUTCDate());
      if (i >= 0) base = i;
    }
    dayOrder.forEach((x, i) => { x.dayNum = i - base + 1; });
    const dayMap = Object.fromEntries(dayOrder.map(x => [x.key, x]));

    // 沒填時間的節點沿用「前一個有填時間的節點」的時間，跟行程頁
    // buildScheduleDays() 同一套規則。要用「全部列」（含沒座標的交通列）
    // 才能算對，晚一步等座標篩完再算的話，會漏掉時間線索。
    Object.values(dayMap).forEach(day => day._rows = []);
    rows.forEach(r => { if (dayMap[r.date]) dayMap[r.date]._rows.push(r); });
    Object.values(dayMap).forEach(day => {
      const seq = [...day._rows].sort((a, b) => (a.order || 0) - (b.order || 0));
      let carried = 0;
      seq.forEach(r => {
        const t = schedTimeMin(r.time);
        if (t < 100000) carried = t;
        r._sortT = carried;
      });
    });

    // 住宿列常常沒填座標（座標在住宿表裡），先用名稱去住宿表補上，
    // 否則它會被當成沒座標而排除，當天路線就會在住宿這一站斷掉
    rows.forEach(r => {
      if (r.lat && r.lng) return;
      if (r.category !== '住宿') return;
      const t = String(r.title || '').trim();
      const hit = STAYS.find(s => {
        const n = String(s.name || '').trim();
        return n && t && (n === t || n.includes(t) || t.includes(n));
      });
      if (hit) { r.lat = hit.lat; r.lng = hit.lng; }
    });

    SCHED = rows
      .filter(r => r.lat && r.lng)
      .map((r, i) => {
        const day = dayMap[r.date] || {};
        return {
          id: 'sch' + i, type: 'sched', who: '',
          dayNum: day.dayNum || 0, dayKey: r.date,
          category: r.category || '其他',
          isRef: r.category === '參考',
          name: r.title, title: r.title, note: r.note || '', place: r.place || '',
          lat: r.lat, lng: r.lng, stayTime: r.stay || '', url: r.url || '',
          date: r.date, time: r.time || '',
          order: r.order || i, _sortT: r._sortT ?? 0,
        };
      });

    // 日期列列出全部「在冰島」的日子：沒座標的也要能選，
    // 否則那天的打卡／消費就沒辦法單獨看。抵達前（D0 以前）不列，
    // 那幾天人還在飛機上，對這張地圖沒有意義。
    SCHED_DAYS = dayOrder.filter(x => x.dayNum >= 1);

    // 旅途中預設就停在今天：打開地圖最想知道的是「今天要去哪」
    if (!_dayAutoDone) {
      _dayAutoDone = true;
      const now = new Date();
      const today = SCHED_DAYS.find(x =>
        x.d.getFullYear() === now.getFullYear() &&
        x.d.getMonth() === now.getMonth() &&
        x.d.getDate() === now.getDate());
      if (today) { dayFilter = today.dayNum; }
    }

    buildDayBar();
    renderStayLine();
    renderMarkers();
  } catch(e) { console.warn('日程資料載入失敗', e); }
}

let stayLine = null;
// 住宿的日期欄可能是「9/15 9/16」這種多晚，逐一比對是不是選定的那天
function stayOnDay(s, dayNum) {
  if (dayNum === null) return true;
  const day = SCHED_DAYS.find(x => x.dayNum === dayNum);
  if (!day) return false;
  return String(s.date || '').split(/[\s,、]+/).filter(Boolean)
    .some(tok => {
      const m = tok.match(/(\d{1,2})\s*[\/月-]\s*(\d{1,2})/);
      return m && +m[1] === day.d.getMonth() + 1 && +m[2] === day.d.getDate();
    });
}

// ══════════════════════════════════════════
//  渲染 Markers
// ══════════════════════════════════════════
// 長文字截斷（地圖小標籤用，完整內容看 popup/卡片）
function truncName(n, max) {
  n = String(n||'');
  max = max || 10;
  return n.length > max ? n.slice(0, max) + '…' : n;
}

// 取打卡時間戳（排序與「最新」判斷用）
function itemTs(it) {
  if (it.time) { const t = Date.parse(it.time); if (!isNaN(t)) return t; }
  const m = String(it.id||'').match(/(\d{10,})/);
  return m ? +m[1] : 0;
}

// 打卡時間序連線
let trailLine = null;
// 當天節點的先後順序：跟行程頁同一套規則（先比時間，時間相同或空白時照列順序）
function schedTimeMin(t) {
  const s = String(t || '').trim();
  if (!s) return 100000;
  const m = s.match(/(\d{1,2})\s*[:：]\s*(\d{2})/);
  if (m) {
    let h = +m[1];
    if (/下午|晚/.test(s) && h < 12) h += 12;
    if (/上午|早/.test(s) && h === 12) h = 0;
    return h * 60 + +m[2];
  }
  if (/上午|早/.test(s)) return 8 * 60;
  if (/中午/.test(s))    return 12 * 60;
  if (/下午/.test(s))    return 14 * 60;
  if (/傍晚/.test(s))    return 17 * 60;
  if (/晚/.test(s))      return 19 * 60;
  return 100000;
}
// 排序改用 buildSched() 裡算好的 _sortT（沒填時間的節點沿用前一個有填
// 時間節點的時間，不會被誤判成「當天最晚」），跟行程頁同一套規則
function schedSeq(a, b) {
  return (a._sortT - b._sortT) || ((a.order || 0) - (b.order || 0));
}

// 路線方向：每段拆成兩截，前段淡、後段濃，中間放一個圓點當分界。
// 顏色由淡到濃就是行進方向——不用算方位角，高緯度也不會畫歪。
// 路線：單一顏色的虛線（不再逐段拆濃淡＋插點，那樣元素太多反而亂）。
// 方向只在整條路線的頭尾各標一個記號：空心圈＝起點、實心點＝終點，
// 「今天從哪出發、在哪結束」才是真正有用的資訊，不用每一段都交代方向。
// 每段路都彎成一點弧度（固定往行進方向左側凸），不是直線硬連。
// 好處是同一條路來回走時，去程跟回程的凸向自動相反，兩條線會自己
// 分開，不會整條疊在一起看不出走了兩趟；不重疊的路段也只是多一點弧度，
// 不影響閱讀。用二次貝茲曲線取樣點，不需要真實方位角，高緯度也不會算歪。
function bowSegment(p1, p2, bowFrac, steps) {
  const [y1, x1] = p1, [y2, x2] = p2;
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  // 方向向量 (dy,dx) 逆時針轉 90 度＝ (-dx,dy)，當作彎曲的控制點偏移方向
  const cx = mx - (y2 - y1) * bowFrac;
  const cy = my + (x2 - x1) * bowFrac;
  const out = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const y = (1 - t) ** 2 * y1 + 2 * (1 - t) * t * cy + t ** 2 * y2;
    const x = (1 - t) ** 2 * x1 + 2 * (1 - t) * t * cx + t ** 2 * x2;
    out.push([y, x]);
  }
  return out;
}
function bowRoute(pts, bowFrac = 0.12, steps = 10) {
  if (pts.length < 2) return pts;
  let out = [pts[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    out = out.concat(bowSegment(pts[i], pts[i + 1], bowFrac, steps).slice(1));
  }
  return out;
}

function makeRoute(pts, light, dark, dash) {
  const g = L.layerGroup();
  g.addLayer(L.polyline(bowRoute(pts), {
    color: dark, weight: 2.5, dashArray: dash, opacity: 0.85, interactive: false,
  }));
  g.addLayer(L.marker(pts[0], {
    interactive: false,
    icon: L.divIcon({
      className: '',
      html: `<div class="route-end start" style="border-color:${dark};"></div>`,
      iconSize: [12, 12], iconAnchor: [6, 6],
    }),
  }));
  g.addLayer(L.marker(pts[pts.length - 1], {
    interactive: false,
    icon: L.divIcon({
      className: '',
      html: `<div class="route-end finish" style="background:${dark};"></div>`,
      iconSize: [12, 12], iconAnchor: [6, 6],
    }),
  }));
  return g;
}

// 計畫路線：選某一天＝那天的行程順序；選「全部」＝整趟依日期串起來
let planLine = null;
function renderPlanLine() {
  if (planLine) { map.removeLayer(planLine); planLine = null; }
  if (!filters.sched) return;
  const pts = SCHED
    .filter(x => !x.isRef && (dayFilter === null || x.dayNum === dayFilter))
    .filter(x => dayFilter !== null || x.dayNum >= 1)   // 全覽時不畫出發日
    .sort((a, b) => (a.dayNum - b.dayNum) || schedSeq(a, b))
    .map(x => [x.lat, x.lng]);
  if (pts.length < 2) return;
  planLine = makeRoute(pts, '#a8d8f0', '#2f8fd0', '7,5').addTo(map);
}

function renderTrail(visible) {
  if (trailLine)   { map.removeLayer(trailLine);   trailLine = null; }
  if (!filters.trail) return;
  // 打卡＋消費一起連線（圖層取消勾選消費時自然不參與）
  const pts = visible
    .filter(it => it.type === 'checkin' || it.type === 'expense')
    .sort((a,b) => itemTs(a) - itemTs(b))
    .map(it => [it.lat, it.lng]);
  if (pts.length < 2) return;
  trailLine = makeRoute(pts, '#efdcae', '#c08a10', '2,6').addTo(map);
}

function renderMarkers() {
  clusterGroup.clearLayers();
  markers = {};
  const zoom = map.getZoom();

  // 住宿點（行程表）
  if (filters.stay) {
    STAYS.filter(s => stayOnDay(s, dayFilter)).forEach(s => {
      const m = L.marker([s.lat, s.lng], {
        icon: L.divIcon({
          html:`<div style="font-size:20px;line-height:1;filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.4));">🏠</div>`,
          className:'', iconSize:[26,26], iconAnchor:[13,13],
        }),
        fallbackIcon:'🏠', memberColor:'#6a8aa8', svgData:null,
      }).bindPopup(`<div class="popup-inner">
        <div class="popup-header"><div class="popup-icon">🏠</div><div class="popup-title">${esc(s.name)}</div></div>
        <div class="popup-note">${esc(s.date)}</div>
        <div class="popup-actions">
          <button class="popup-action-btn" onclick="openSchedCard('住宿','${esc(s.name)}','${esc(s.date)}')">📋 詳細</button>
          <button class="popup-action-btn" onclick="window.open('https://maps.google.com/?q=${s.lat},${s.lng}','_blank')">➤ 導航</button>
        </div>
      </div>`, {className:'px-popup', maxWidth:250, closeButton:false});
      markers[s.id] = m;
      clusterGroup.addLayer(m);
    });
  }

  // 打卡足跡
  const visible = getVisible();
  // 消費標籤只給最新 5 筆，其餘收成 💰 角標
  const labeledIds = new Set(
    visible.filter(it => it.type==='expense')
      .sort((a,b) => itemTs(b) - itemTs(a))
      .slice(0, 5).map(it => it.id)
  );
  visible.forEach(item => {
    if (item.type === 'stay') return;   // 住宿 marker 上面已畫
    // 日程表的住宿列跟住宿表指同一間，只留住宿表那顆，免得同一點疊兩個 marker
    // （這裡不畫，但它仍留在 SCHED 裡供路線計算使用）
    if (item.type === 'sched' && item.category === '住宿') return;
    if (item.type === 'sched') {        // 計畫節點：分類圖示，不用成員小人
      const m2 = L.marker([item.lat, item.lng], {
        icon: schedIcon(item),
        isSched: true,
        fallbackIcon: SCHED_ICONS[item.category] || '·',
        memberColor:'#58b0e8', svgData:null,
      }).bindPopup(() => buildSchedPopup(item), { className:'px-popup', maxWidth:250, closeButton:false });
      markers[item.id] = m2;
      clusterGroup.addLayer(m2);
      return;
    }
    const icon = makeMarkerIcon(item, zoom, labeledIds.has(item.id));
    const m = getMemberByName(item.who);
    const marker = L.marker([item.lat, item.lng], {
      icon,
      ts: itemTs(item),
      memberColor: item.type==='stay' ? '#6a8aa8' : m.color,
      svgData: item.svgData,
      svgGrid: item.svgGrid || 16,
      spriteHtml: (item.type==='checkin'||item.type==='expense') ? spriteSvg(m) : null,
      fallbackIcon: item.type==='stay' ? '🏠' : m.icon,
    }).bindPopup(() => buildPopupContent(item), { className:'px-popup', maxWidth:240, closeButton:false });
    markers[item.id] = marker;
    clusterGroup.addLayer(marker);
  });

  renderTrail(visible);
  renderPlanLine();
  // 圖例只在真的兩條線都畫得出來時才出現，平常不佔畫面
  const lg = document.getElementById('routeLegend');
  if (lg) lg.style.display = (planLine && trailLine) ? 'flex' : 'none';
  renderCards();
}

function typeMeta(t) {
  return t==='stay'    ? { label:'住宿', tag:'tag-stay', icon:'🏠' }
       : t==='expense' ? { label:'消費', tag:'tag-expense', icon:'💰' }
       : t==='sched'   ? { label:'行程', tag:'tag-sched', icon:'📅' }
       : { label:'打卡', tag:'tag-checkin', icon:'🐾' };
}

// 計畫節點圖示：景點用純色圓點（數量最多，用 emoji 會滿版干擾），
// 其他類別維持辨識度較高的 emoji
function schedIcon(item) {
  if (item.isRef) {
    return L.divIcon({ html:`<div class="sched-pin ref"></div>`, className:'',
                       iconSize:[15,15], iconAnchor:[7.5,7.5] });
  }
  if (item.category === '景點') {
    return L.divIcon({ html:`<div class="sched-pin"></div>`, className:'',
                       iconSize:[21,21], iconAnchor:[10.5,10.5] });
  }
  return L.divIcon({
    html:`<div class="sched-emoji">${SCHED_ICONS[item.category] || '📍'}</div>`,
    className:'', iconSize:[24,24], iconAnchor:[12,12],
  });
}

// 計畫節點的 popup：唯讀，只顯示行程資訊 + 導航／連結
function buildSchedPopup(x) {
  const meta = [x.time, x.stayTime && ('停留 ' + x.stayTime)].filter(Boolean).join(' · ');
  return `<div class="popup-inner">
    <div class="popup-header">
      <div class="popup-icon">${SCHED_ICONS[x.category] || '📍'}</div>
      <div class="popup-title">${esc(x.title)}</div>
    </div>
    <div class="popup-meta"><span class="tag tag-sched">D${x.dayNum} ${esc(x.dayKey)}</span>${
      meta ? `<span class="popup-time">${esc(meta)}</span>` : ''}</div>
    ${x.place ? `<div class="popup-note">📍 ${esc(x.place)}</div>` : ''}
    ${x.note ? `<div class="popup-note">${esc(x.note)}</div>` : ''}
    <div class="popup-actions">
      ${(x.category === '住宿' || x.category === '活動')
        ? `<button class="popup-action-btn" onclick="openSchedCard('${esc(x.category)}','${esc(x.title)}','${esc(x.dayKey)}')">📋 詳細</button>` : ''}
      <button class="popup-action-btn" onclick="window.open('https://maps.google.com/?q=${x.lat},${x.lng}','_blank')">➤ 導航</button>
      ${/^https?:\/\//i.test(x.url) ? `<button class="popup-action-btn" onclick="window.open('${esc(x.url)}','_blank')">🔗 詳情</button>` : ''}
    </div>
  </div>`;
}

// 地圖在 iframe 裡，開住宿／活動卡要請外層主頁面處理（那裡才有完整資料與彈窗）
function openSchedCard(category, title, dayKey) {
  if (window.parent === window) return;   // 單獨開啟 map.html 時沒有外層可呼叫
  window.parent.postMessage({
    source: 'iceland-map',
    action: category === '住宿' ? 'openStay' : 'openAct',
    title, dayKey,
  }, '*');
}

function itemImgHtml(item) {
  const g = item.svgGrid || 16;
  if (item.svgData) return `<div class="popup-img"><svg viewBox="0 0 ${g} ${g}" style="image-rendering:pixelated;width:100%;height:100%;">${item.svgData}</svg></div>`;
  if (item.imageUrl) return `<div class="popup-img"><img src="${item.imageUrl}" alt=""></div>`;
  return '';
}

function buildPopupContent(item) {
  const m = getMemberByName(item.who);
  const t = typeMeta(item.type);
  const isExp = item.type === 'expense';
  const headIcon = (item.type==='checkin' || isExp) ? spriteSvg(m) : t.icon;

  // 打卡與消費共用同一個窗：有資料的欄位才顯示
  const el = document.createElement('div');
  el.className = 'popup-inner';
  el.innerHTML = `
    <div class="popup-header">
      <div class="popup-icon">${headIcon}</div>
      <div style="flex:1;">
        <div class="popup-title">${esc(item.name)}</div>
        <div style="display:flex;gap:6px;align-items:center;margin-top:3px;">
          <span class="diary-tag ${t.tag}">${t.label}</span>
          ${item.date?`<span style="font-size:8px;color:var(--muted)">${item.date}</span>`:''}
        </div>
      </div>
      ${isExp?`<span style="width:13px;height:13px;border-radius:50%;background:var(--gold);color:#332b10;font-family:var(--px);font-size:9px;line-height:13px;text-align:center;flex-shrink:0;margin-right:2px;">$</span>`:''}
      <button class="popup-more" title="更多"
        onclick="const x=this.closest('.popup-header').querySelector('.popup-extra');x.style.display=x.style.display==='flex'?'none':'flex';">…</button>
      <div class="popup-extra">
        <button class="popup-action-btn" onclick="startEditCheckin('${item.id}')">✎ 編輯</button>
        <button class="popup-action-btn" style="color:#e08090;" onclick="deleteCheckin('${item.id}')">🗑 刪除</button>
      </div>
    </div>
    ${itemImgHtml(item)}
    ${item.note?`<div class="popup-note">${esc(item.note)}</div>`:''}
    ${isExp?`<div class="popup-note" style="color:var(--gold);cursor:pointer;" onclick="openExpenseCard('${item.id}')">🧾 ${esc(item.name)}　−${esc(item.amount)} ${esc(item.currency)}　›</div>`:''}
    ${isExp&&item.locName?`<div class="popup-note" style="color:var(--muted);">📍 ${esc(item.locName)}</div>`:''}
    <div class="popup-actions">
      <button class="popup-action-btn" onclick="openComments('${item.id}')">💬 查看留言（${item.comments?.length||0}）</button>
      <button class="popup-action-btn" onclick="navigateTo(${item.lat},${item.lng})">➤ 導航</button>
    </div>
  `;
  return el;
}

// ══════════════════════════════════════════
//  卡片列表
// ══════════════════════════════════════════
const TABS = [
  { key:'all', label:'全部' },
  { key:'checkin', label:'打卡' },
  { key:'stay', label:'住宿' },
  { key:'expense', label:'消費' },
  { key:'sched', label:'行程' },
];

function buildTabs() {
  const el = document.getElementById('drawerTabs');
  el.innerHTML = TABS.map(t =>
    `<button class="dtab ${t.key===currentTab?'on':''}" onclick="setTab('${t.key}');event.stopPropagation();">${t.label}</button>`
  ).join('');
}

function setTab(key) {
  currentTab = key;
  buildTabs();
  renderCards();
  if (!drawerOpen) toggleDrawer();
}

function getVisible() {
  return allItems().filter(item => {
    // 日程項目的開關由 schedItems() 依 sched/ref 決定，這裡不再查 filters
    if (item.type !== 'sched' && !filters[item.type]) return false;
    if (currentTab !== 'all' && item.type !== currentTab) return false;
    // 成員篩選只針對「誰做的」紀錄；計畫節點沒有歸屬，不該因此消失
    if (memberFilter && item.type !== 'sched' && item.who !== memberFilter) return false;
    if (timeFilterTs && itemTs(item) > timeFilterTs) return false;
    if (dayFilter !== null) {
      // 計畫項目比對第幾天；打卡／消費比對實際發生日期
      if (item.type === 'sched') { if (item.dayNum !== dayFilter) return false; }
      else if (!isItemOnDay(item, dayFilter)) return false;
    }
    return true;
  });
}

// 打卡／消費是否發生在第 N 天（用該天的日期比對時間戳）
function isItemOnDay(item, dayNum) {
  const day = SCHED_DAYS.find(x => x.dayNum === dayNum);
  if (!day) return false;
  const ts = itemTs(item);
  if (!ts) return false;
  const t = new Date(ts);
  return t.getFullYear() === day.d.getFullYear()
      && t.getMonth() === day.d.getMonth()
      && t.getDate() === day.d.getDate();
}

// ── 日期列
function buildDayBar() {
  const bar = document.getElementById('dayBar');
  const box = document.getElementById('dayScroll');
  if (!bar || !box) return;
  if (!SCHED_DAYS.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  const now = new Date();
  box.innerHTML = SCHED_DAYS.map(x => {
    const isToday = x.d.getFullYear() === now.getFullYear()
                 && x.d.getMonth() === now.getMonth()
                 && x.d.getDate() === now.getDate();
    return `
    <button class="day-chip${dayFilter === x.dayNum ? ' on' : ''}${isToday ? ' today' : ''}"
            onclick="setDayFilter(${x.dayNum})">
      <span class="d-num">D${x.dayNum}</span>
      <span class="d-date">${esc(x.key)}</span>
    </button>`;
  }).join('');
  document.getElementById('dayAll').classList.toggle('on', dayFilter === null);
  // 選中的那天捲進視野，不然選了看不到自己選在哪
  const on = box.querySelector('.day-chip.on') || box.querySelector('.day-chip.today');
  if (on) box.scrollLeft = on.offsetLeft - (box.clientWidth - on.offsetWidth) / 2;

  // 滑鼠滾輪＝橫向捲動（不然桌機上只能用拖的，很難滑到頭尾）
  if (!box._wheelBound) {
    box._wheelBound = true;
    box.addEventListener('wheel', (e) => {
      const d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      if (!d) return;
      e.preventDefault();
      box.scrollLeft += d;
    }, { passive:false });
  }
}

function setDayFilter(n) {
  dayFilter = (dayFilter === n) ? null : n;
  buildDayBar();
  renderStayLine();
  renderMarkers();
  // 選了某一天就把畫面帶到那天的範圍，不用自己找
  if (dayFilter !== null) {
    const pts = SCHED.filter(x => x.dayNum === dayFilter && !x.isRef).map(x => [x.lat, x.lng]);
    if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding:[60,60], maxZoom:11 });
  }
}

// ══════════════════════════════════════════
//  時間軸滑桿（拖到哪、看到哪之前的足跡；▶ 縮時播放）
// ══════════════════════════════════════════
let timeFilterTs = null;
let timeBarOn = false;
let tlStamps = [], tlTimer = null;   // 刻度＝每筆紀錄，不是均分時間

function toggleTimeBar() {
  if (!timeBarOn) {
    tlStamps = allItems().map(itemTs).filter(Boolean).sort((a,b)=>a-b);
    if (tlStamps.length < 2) { alert('紀錄還太少，多打幾次卡再來玩時間軸吧'); return; }
    timeBarOn = true;
    const r = document.getElementById('timeRange');
    r.max = tlStamps.length;          // 一格＝一筆紀錄，永遠停得準
    r.value = tlStamps.length;
    document.getElementById('timeBar').style.display = 'flex';
    document.getElementById('checkinFab').style.display = 'none';
    setTimeFilter(tlStamps.length);
  } else {
    timeBarOn = false;
    stopTimePlay();
    timeFilterTs = null;
    document.getElementById('timeBar').style.display = 'none';
    document.getElementById('checkinFab').style.display = '';
    renderMarkers();
  }
  document.getElementById('lo-timebar').classList.toggle('on', timeBarOn);
  closeLayers();
}

function setTimeFilter(n) {
  n = +n;
  const total = tlStamps.length;
  timeFilterTs = n >= total ? null : (n <= 0 ? -1 : tlStamps[n-1]);
  const d = new Date(n >= total ? tlStamps[total-1] : (n <= 0 ? tlStamps[0] : tlStamps[n-1]));
  const dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  document.getElementById('timeLabel').textContent =
    n >= total ? `全部 ${total} 筆` : `${dateStr} · ${Math.max(0,n)}/${total}`;
  renderMarkers();
}

function playTimeline() {
  if (tlTimer) { stopTimePlay(); return; }
  const r = document.getElementById('timeRange');
  r.value = 0;
  setTimeFilter(0);
  document.getElementById('timePlay').textContent = '⏸';
  tlTimer = setInterval(() => {
    const v = Math.min(+r.max, +r.value + 1);   // 一次浮現一筆
    r.value = v;
    setTimeFilter(v);
    if (v >= +r.max) stopTimePlay();
  }, 350);
}

// +/− 一格（一筆紀錄）前進後退
function stepTimeline(dir) {
  stopTimePlay();
  const r = document.getElementById('timeRange');
  r.value = Math.max(0, Math.min(+r.max, +r.value + dir));
  setTimeFilter(r.value);
}

function stopTimePlay() {
  if (!tlTimer) return;
  clearInterval(tlTimer);
  tlTimer = null;
  document.getElementById('timePlay').textContent = '▶';
}

function renderCards() {
  const list = document.getElementById('cardList');
  const visible = getVisible();
  document.getElementById('drawerCount').textContent = visible.length + ' 筆';

  list.innerHTML = visible.map(item => {
    const m = getMemberByName(item.who);
    const t = typeMeta(item.type);
    const g = item.svgGrid || 16;
    const thumb = item.svgData
      ? `<svg viewBox="0 0 ${g} ${g}" style="image-rendering:pixelated;width:100%;height:100%;">${item.svgData}</svg>`
      : item.imageUrl
      ? `<img src="${item.imageUrl}" alt="">`
      : (item.type==='checkin'||item.type==='expense')
      ? spriteSvg(m)
      : `<span style="font-size:24px;">${t.icon}</span>`;

    return `<div class="diary-card" onclick="flyTo(${item.lat},${item.lng},'${item.id}')">
      <div class="diary-thumb">${thumb}</div>
      <div class="diary-info">
        <div class="diary-name">${esc(item.name)}</div>
        <div class="diary-meta">
          <span class="diary-tag ${t.tag}">${t.label}</span>
          ${item.date?`<span class="diary-date">${item.date}</span>`:''}
        </div>
        ${(() => {
          const n = item.type==='expense'
            ? `−${esc(item.amount)} ${esc(item.currency)}${item.note?' · '+esc(item.note):''}`
            : esc(item.note);
          return n ? `<div class="diary-note">${n}</div>` : '';
        })()}
        <div class="diary-footer">
          <span class="diary-comments">${item.comments?.length?`💬 ${item.comments.length}`:''}</span>
          <div class="diary-author">${spriteSvg(m)}</div>
        </div>
      </div>
    </div>`;
  }).join('') || `<div style="text-align:center;padding:24px;font-size:9px;color:var(--muted);">還沒有紀錄</div>`;
}

function flyTo(lat, lng, id) {
  map.flyTo([lat, lng], 12, { duration: 1 });
  setTimeout(() => { if(markers[id]) markers[id].openPopup(); }, 1000);
}

//  抽屜
// ══════════════════════════════════════════
function toggleDrawer() {
  drawerOpen = !drawerOpen;
  document.getElementById('cardDrawer').classList.toggle('expanded', drawerOpen);
  if (drawerOpen) map.invalidateSize();
}
function setDrawer(open) {
  if (drawerOpen !== open) toggleDrawer();
}
// 把手：拖曳展開/收合＋點擊切換（分頁按鈕除外）
bindDragToggle(document.getElementById('drawerHandle'), {
  onUp:   () => setDrawer(true),
  onDown: () => setDrawer(false),
  onTap:  toggleDrawer,
});

// ══════════════════════════════════════════
//  圖層選單
// ══════════════════════════════════════════
let layersOpen = false;
function toggleLayers() {
  layersOpen = !layersOpen;
  document.getElementById('layersMenu').classList.toggle('show', layersOpen);
}
function closeLayers() {
  layersOpen = false;
  document.getElementById('layersMenu').classList.remove('show');
}
function toggleFilter(key) {
  filters[key] = !filters[key];
  document.getElementById('lo-'+key).classList.toggle('on', filters[key]);
  if (key === 'stay') renderStayLine();
  renderMarkers();
}

// ══════════════════════════════════════════
//  打卡 Modal
// ══════════════════════════════════════════
function selectType(t) {
  pendingCheckin.type = t;
  document.querySelectorAll('#typeRow .type-chip').forEach(b =>
    b.classList.toggle('on', b.dataset.type===t));
  const btn = document.getElementById('submitBtn');
  btn.innerHTML = typeMeta(t).icon + ' 儲存';
  checkSubmitReady();
}

function buildMemberGrid() {
  const el = document.getElementById('memberGrid');
  el.innerHTML = members.map(m =>
    `<div class="member-choice ${pendingCheckin.who===m.name?'on':''}" onclick="selectMember('${m.name}')">
      <div class="check">✓</div>
      <div class="member-choice-avatar">${spriteSvg(m)}</div>
      <div class="member-choice-name">${m.name}</div>
    </div>`
  ).join('');
}

function selectMember(name) {
  pendingCheckin.who = name;
  buildMemberGrid();
  checkSubmitReady();
}

let editingId = null;

function setStepsVisible(showAll) {
  ['stepType','stepLocation','stepMember'].forEach(id =>
    document.getElementById(id).style.display = showAll ? '' : 'none');
}

function openCheckin() {
  editingId = null;
  pendingCheckin = { type:'checkin', lat:null, lng:null, who:null, text:'', svgData:null, svgGrid:16, pngBlob:null };
  selectType('checkin');
  setStepsVisible(true);
  document.getElementById('stepDate').style.display = '';
  document.getElementById('expenseInfoRow').style.display = 'none';
  document.getElementById('checkinSheet').classList.remove('tall');
  document.getElementById('checkinModalTitle').textContent = '新增紀錄';
  // 日期預設今天
  const now = new Date();
  document.getElementById('checkinDate').value =
    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  document.getElementById('locationName').textContent = '點地圖選擇地點';
  document.getElementById('locationCoord').textContent = '';
  document.getElementById('placeName').value = '';
  document.getElementById('diaryText').value = '';
  document.getElementById('charCount').textContent = '0';
  document.getElementById('drawThumb').innerHTML = '🖼';
  document.getElementById('submitBtn').disabled = true;
  buildMemberGrid();
  document.getElementById('checkinModal').classList.add('show');
  tryGPS();
}

// 開啟打卡時預設抓 GPS 定位（點地點卡片仍可改成手動選點）
// force=true：使用者按 GPS 鈕，即使已手動選點也覆蓋
function tryGPS(force) {
  if (!navigator.geolocation) return;
  document.getElementById('locationName').textContent = '📡 定位中…';
  document.getElementById('locationCoord').textContent = '點此可改手動選點';
  navigator.geolocation.getCurrentPosition(pos => {
    // 非強制時：使用者已手動選點或進入編輯就不覆蓋
    if (!force && (editingId || pendingCheckin.lat)) return;
    pendingCheckin.lat = pos.coords.latitude;
    pendingCheckin.lng = pos.coords.longitude;
    document.getElementById('locationName').textContent =
      `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
    document.getElementById('locationCoord').textContent = '目前位置（GPS）· 點此可改手動選點';
    checkSubmitReady();
  }, () => {
    if (!pendingCheckin.lat) {
      document.getElementById('locationName').textContent = '點地圖選擇地點';
      document.getElementById('locationCoord').textContent = '（無法取得定位）';
    }
  }, { enableHighAccuracy:true, timeout:8000, maximumAge:60000 });
}

// 編輯既有打卡/消費（同一個窗：改日記與塗鴉，地點/角色/類型固定）
function startEditCheckin(id) {
  const item = allItems().find(c=>c.id===id);
  if (!item) return;
  const isExp = item.type === 'expense';
  map.closePopup();
  editingId = id;
  pendingCheckin = {
    type:item.type, lat:item.lat, lng:item.lng, who:item.who,
    text:item.note||'', svgData:item.svgData||null, svgGrid:item.svgGrid||16, pngBlob:null,
  };
  setStepsVisible(false);
  // 消費：日期/金額在帳簿管理 → 藏日期欄、顯示帳目資訊列
  document.getElementById('stepDate').style.display = isExp ? 'none' : '';
  const expRow = document.getElementById('expenseInfoRow');
  expRow.style.display = isExp ? '' : 'none';
  if (isExp) {
    expRow.innerHTML = `🧾 ${esc(item.name)}　−${esc(item.amount)} ${esc(item.currency)}`;
    expRow.onclick = () => openExpenseCard(item.id);
  }
  document.getElementById('checkinSheet').classList.remove('tall');
  document.getElementById('checkinModalTitle').textContent = '編輯：' + (item.name||'');
  // 顯示原日期，可修改
  document.getElementById('checkinDate').value = (item.date||'').slice(0,10).replace(/\//g,'-');
  document.getElementById('diaryText').value = item.note||'';
  document.getElementById('charCount').textContent = String((item.note||'').length);
  document.getElementById('drawThumb').innerHTML = item.svgData
    ? `<svg viewBox="0 0 ${item.svgGrid||16} ${item.svgGrid||16}" style="image-rendering:pixelated;width:100%;height:100%;">${item.svgData}</svg>`
    : '🖼';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('checkinModal').classList.add('show');
}

// 刪除打卡/消費
async function deleteCheckin(id) {
  // 消費：同步刪除帳簿那一列
  const expItem = expenses.find(c=>c.id===id);
  if (expItem) {
    if (!confirm(`刪除「${expItem.name}」？\n帳簿裡這筆消費也會一併刪除`)) return;
    map.closePopup();
    expenses = expenses.filter(c=>c.id!==id);
    renderMarkers();
    const gasBase = TRIP_CONFIG.apiBase || '';
    if (gasBase && expItem._rowIndex) {
      try {
        await fetch(gasBase, { method:'POST', body: JSON.stringify({
          action:'deleteExpense', rowIndex:expItem._rowIndex,
        })});
        loadExpenses();
      } catch(e) { console.warn('雲端刪除失敗', e); }
    }
    return;
  }
  const item = checkins.find(c=>c.id===id);
  if (!item) return;
  if (!confirm(`刪除「${item.name}」這筆紀錄？`)) return;
  map.closePopup();
  checkins = checkins.filter(c=>c.id!==id);
  renderMarkers();
  const gasBase = TRIP_CONFIG.apiBase || '';
  if (gasBase && item._rowIndex) {
    try {
      await fetch(gasBase, { method:'POST', body: JSON.stringify({
        action:'deleteCheckin', rowIndex:item._rowIndex,
      })});
      // 刪行後其他列的 rowIndex 會位移，重新載入校正
      loadCheckins();
    } catch(e) { console.warn('雲端刪除失敗', e); }
  }
}

// 共用拖曳把手：上拖 onUp、下拖 onDown、沒拖到就當點擊 onTap（按鈕不攔）
function bindDragToggle(zone, { onUp, onDown, onTap }) {
  let startY = null, dragged = false;
  zone.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    startY = e.clientY; dragged = false;
    zone.setPointerCapture(e.pointerId);
  });
  zone.addEventListener('pointermove', e => {
    if (startY === null) return;
    const dy = e.clientY - startY;
    if (dy < -20) { onUp?.();   dragged = true; startY = e.clientY; }
    if (dy >  20) { onDown?.(); dragged = true; startY = e.clientY; }
  });
  // iOS 上 pointer capture 會吃掉 click，改在 pointerup 判斷「沒拖就是點」
  zone.addEventListener('pointerup', e => {
    if (startY !== null && !dragged && !e.target.closest('button')) onTap?.();
    startY = null; dragged = false;
  });
  zone.addEventListener('pointercancel', () => { startY = null; dragged = false; });
  zone.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
}

async function uploadImageToR2(blob) {
  const formData = new FormData();
  formData.append('file', blob, 'checkin.png');
  const res = await fetch(R2_WORKER, { method:'POST', body: formData });
  const data = await res.json();

}

async function submitCheckin() {
  if (!pendingCheckin.lat || !pendingCheckin.who) return;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '送出中…';

  // ── 編輯模式：更新日記與塗鴉（打卡與消費共用此窗）
  if (editingId) {
    try {
      const expItem = expenses.find(c=>c.id===editingId);
      if (expItem) {
        expItem.note    = pendingCheckin.text;
        expItem.svgData = pendingCheckin.svgData;
        expItem.svgGrid = pendingCheckin.svgGrid;
        const gasBase = TRIP_CONFIG.apiBase || '';
        if (gasBase && expItem._rowIndex) {
          await fetch(gasBase, { method:'POST', body: JSON.stringify({
            action:   'expenseMapEdit',
            rowIndex: expItem._rowIndex,
            note:     expItem.note,
            svgData:  expItem.svgData || '',
            svgGrid:  expItem.svgGrid || 16,
          })});
        }
        editingId = null;
        closeCheckin();
        renderMarkers();
        return;
      }
      const item = checkins.find(c=>c.id===editingId);
      if (item) {
        let imageUrl = item.imageUrl || '';
        if (pendingCheckin.pngBlob) {
          try { imageUrl = await uploadImageToR2(pendingCheckin.pngBlob); }
          catch(e) { console.warn('圖片上傳失敗', e); }
        }
        item.note     = pendingCheckin.text;
        item.svgData  = pendingCheckin.svgData;
        item.svgGrid  = pendingCheckin.svgGrid;
        item.imageUrl = imageUrl;
        // 日期若有改，更新 date 與 time
        const picked = document.getElementById('checkinDate').value;
        if (picked && picked.replace(/-/g,'/') !== item.date) {
          item.date = picked.replace(/-/g,'/');
          item.time = new Date(picked + 'T12:00:00').toISOString();
        }
        const gasBase = TRIP_CONFIG.apiBase || '';
        if (gasBase && item._rowIndex) {
          await fetch(gasBase, { method:'POST', body: JSON.stringify({
            action:   'editCheckin',
            rowIndex: item._rowIndex,
            note:     item.note,
            time:     item.time,
            imageUrl: imageUrl,
            svgData:  item.svgData || '',
            svgGrid:  item.svgGrid || 16,
          })});
        }
      }
      editingId = null;
      closeCheckin();
      renderMarkers();
    } catch(e) {
      console.error('編輯送出失敗', e);
      alert('送出失敗，請稍後再試');
    } finally {
      btn.disabled = false;
      btn.innerHTML = typeMeta(pendingCheckin.type).icon + ' 儲存';
    }
    return;
  }

  try {
    const now = new Date();
    // 用使用者選的日期（預設今天）；選今天就帶現在時刻，補登舊日期則取當天中午
    const picked = document.getElementById('checkinDate').value;   // YYYY-MM-DD
    const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    const timeISO = (!picked || picked === todayStr)
      ? now.toISOString()
      : new Date(picked + 'T12:00:00').toISOString();
    const dateStr = (picked || todayStr).replace(/-/g,'/');

    // 若有畫圖，先上傳到 R2
    let imageUrl = '';
    if (pendingCheckin.pngBlob) {
      try {
        imageUrl = await uploadImageToR2(pendingCheckin.pngBlob);
      } catch(e) {
        console.warn('圖片上傳失敗，繼續送出打卡', e);
      }
    }

    const customName = document.getElementById('placeName').value.trim();
    const item = {
      id:       'c' + Date.now(),
      type:     pendingCheckin.type,
      who:      pendingCheckin.who,
      lat:      pendingCheckin.lat,
      lng:      pendingCheckin.lng,
      name:     customName || document.getElementById('locationName').textContent,
      date:     dateStr,
      time:     timeISO,
      note:     pendingCheckin.text,
      comments: [],
      imageUrl: imageUrl,
      svgData:  pendingCheckin.svgData,
      svgGrid:  pendingCheckin.svgGrid,
    };

    // POST 到 GAS
    const gasBase = TRIP_CONFIG.apiBase || '';
    if (gasBase) {
      const resp = await fetch(gasBase, {
        method:'POST',
        body: JSON.stringify({
          action:   'addCheckin',
          type:     item.type,
          who:      item.who,
          lat:      item.lat,
          lng:      item.lng,
          name:     item.name,
          note:     item.note,
          time:     item.time,
          imageUrl: item.imageUrl,
          svgData:  item.svgData || '',
          svgGrid:  item.svgGrid || 16,
        }),
      });
      // 採用 GAS 回傳的正式 ID，重載時才認得是同一筆（避免本地+雲端雙重顯示）
      try {
        const r = await resp.json();
        if (r?.ok && r.msg?.id) item.id = r.msg.id;
      } catch(e) { /* 回應讀不到就留臨時 ID，5 分鐘保護仍適用 */ }
    }

    checkins.unshift(item);
    closeCheckin();
    renderMarkers();
    map.flyTo([item.lat, item.lng], 12);
    // 重新載入以取得雲端 rowIndex（編輯/刪除需要）
    if (gasBase) loadCheckins();

  } catch(e) {
    console.error('打卡送出失敗', e);
    alert('送出失敗，請稍後再試');
  } finally {
    btn.disabled = false;
    btn.innerHTML = typeMeta(pendingCheckin.type).icon + ' 儲存';
  }
}

// 套用雲端打卡：缺塗鴉保留本地新畫的；雲端還沒有的本地新項目不丟
function applyCheckins(cloud) {
  const localById = {};
  checkins.forEach(c => { localById[c.id] = c; });
  const cloudIds = new Set(cloud.map(c => c.id));
  const merged = cloud.map(c => {
    const local = localById[c.id];
    return {
      ...c,
      svgData: c.svgData || local?.svgData || null,
      svgGrid: c.svgGrid || local?.svgGrid || 16,
    };
  });
  // 樂觀更新保護：剛送出、雲端尚未出現的本地項目（5 分鐘內）保留
  // 雲端已有同人同座標的就視為同一筆，不重複顯示
  const cloudKeys = new Set(cloud.map(c =>
    `${c.who}|${(+c.lat).toFixed(5)}|${(+c.lng).toFixed(5)}`));
  checkins.forEach(c => {
    const key = `${c.who}|${(+c.lat).toFixed(5)}|${(+c.lng).toFixed(5)}`;
    if (!cloudIds.has(c.id) && !cloudKeys.has(key) &&
        Date.now() - itemTs(c) < 5*60*1000) merged.unshift(c);
  });
  checkins = merged;
}

function applyExpenses(cloud) {
  const localById = {};
  expenses.forEach(c => { localById[c.id] = c; });
  expenses = cloud.map(e => ({
    id:       e.id,
    type:     'expense',
    who:      e.payer,
    lat:      e.lat,
    lng:      e.lng,
    name:     e.title || e.category || e.location || '消費',
    category: e.category || '',
    qty:      e.qty || '',
    locName:  e.location || '',
    date:     e.date,
    time:     e.date,            // itemTs 用 Date.parse 解析
    amount:   e.amount,
    currency: e.currency,
    twd:      e.twd || 0,
    total:    e.total || 0,
    burden:   e.burden || {},
    isShared: !!e.isShared,
    tags:     e.tags || '',
    note:     e.note || '',
    comments: e.comments || [],
    svgData:  e.svgData || localById[e.id]?.svgData || null,
    svgGrid:  e.svgGrid || localById[e.id]?.svgGrid || 16,
    _rowIndex: e._rowIndex,
  }));
}

  const gasBase = TRIP_CONFIG.apiBase || '';

// 地圖初次載入：一次拿齊打卡＋消費＋住宿（GAS 冷啟動只等一次）
// 打卡／消費／住宿也一樣先吃快取再更新：沒訊號時打開地圖，
// 至少看得到上次同步的足跡，而不是一張空地圖
const MAPDATA_CACHE_KEY = 'cached_iceland_mapdata';

function applyMapData(data) {
  if (Array.isArray(data.checkins)) applyCheckins(data.checkins);
  if (Array.isArray(data.expenses)) applyExpenses(data.expenses);
  if (Array.isArray(data.stays)) {
    STAYS = data.stays.map((st, i) => ({ id:'s'+i, ...st }));
    renderStayLine();
    buildSched();          // 住宿座標到齊，重建日程把住宿站補回路線
  }
  renderMarkers();
}

async function loadMapData() {
  try {
    const cached = JSON.parse(localStorage.getItem(MAPDATA_CACHE_KEY) || 'null');
    if (cached) applyMapData(cached);
  } catch(e) { /* 快取壞了就當沒有 */ }

  const gasBase = TRIP_CONFIG.apiBase || '';
  if (!gasBase) return;
  try {
    const res = await fetch(gasBase + '?sheet=mapdata', { cache:'no-store' });
    const data = await res.json();
    applyMapData(data);
    try { localStorage.setItem(MAPDATA_CACHE_KEY, JSON.stringify(data)); } catch(e) {}
  } catch(e) {
    console.warn('地圖資料載入失敗，改逐項載入', e);
    loadCheckins(); loadExpenses(); loadStays();
  }
}

  L.marker([lat, lng], {
    icon: L.divIcon({ html:`<div class="sched-pin"></div>`, className:'',
                      iconSize:[21,21], iconAnchor:[10.5,10.5] }),
  }).addTo(map);
})();

buildTopbarMembers();
buildTabs();
renderMarkers();
if (!document.body.classList.contains('preview')) {
  loadMapData();
  loadSchedule();
}
// 修正容器尺寸計算延遲導致 tile 不載入
setTimeout(() => map.invalidateSize(), 200);
</script>

<script src="../shared/pixelpad.js"></script>
<script>
// ══════════════════════════════════════════
//  畫板掛載（共用 pixelpad.js）
// ══════════════════════════════════════════
let padMounted = false;

function ensurePad() {
  if (!padMounted) {
    PixelPad.mount(document.getElementById('pixelPadMount'), { onDone: onPadDone });
    padMounted = true;
  }
}

function openDrawPanel() {
  document.getElementById('drawModal').classList.add('show');
  ensurePad();
  // 有既有塗鴉（編輯中）就載入，否則開全新空白畫布
  if (pendingCheckin.svgData) {
    PixelPad.loadRects(pendingCheckin.svgData, pendingCheckin.svgGrid || 16);
  } else {
    PixelPad.reset();
  }
}

function onPadDone(res) {
  document.getElementById('drawModal').classList.remove('show');
  pendingCheckin.svgData = res.svgData;
  pendingCheckin.svgGrid = res.grid;
  if (res.svgData) {
    PixelPad.toPNGBlob(blob => { pendingCheckin.pngBlob = blob; });
    document.getElementById('drawThumb').innerHTML =
      `<svg viewBox="0 0 ${res.grid} ${res.grid}" style="image-rendering:pixelated;width:100%;height:100%;">${res.svgData}</svg>`;
  } else {
    pendingCheckin.pngBlob = null;
    document.getElementById('drawThumb').innerHTML = '🖼';
  }
}
</script>

</body>
</html>
