<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>腳印地圖</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="sprites.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#222a34;
  --panel:#2b3440;
  --panel2:#323d4b;
  --border:#3f4b5a;
  --text:#e8e4dc;
  --muted:#8a95a4;
  --accent:#d05868;
  --accent2:#5a9ab8;
  --gold:#d8a838;
  --green:#5aa86a;
  --px:'Silkscreen',monospace;
  --radius:8px;
}

html,body{overscroll-behavior:none;}
body{
  background:var(--bg);
  font-family:var(--px);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  color:var(--text);
}

/* ── 頂部標題列 */
.topbar{
  background:var(--panel);
  border-bottom:1.5px solid var(--border);
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
  z-index:1000;
}
.topbar-menu{font-size:16px;cursor:pointer;color:var(--muted);padding:2px 6px;}
.topbar-menu:active{color:var(--text);}
.topbar-title{font-size:11px;color:var(--text);letter-spacing:1px;flex:1;}
.topbar-members{display:flex;gap:6px;}
.member-avatar{
  width:30px;height:30px;border-radius:4px;
  border:2px solid var(--border);
  background:var(--panel2);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;
  image-rendering:pixelated;
  overflow:hidden;
}
.member-avatar.on{border-color:var(--accent);}
.member-avatar svg{width:100%;height:100%;image-rendering:pixelated;}

/* ── 主區域 */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}

/* ── 地圖 */
.map-wrap{flex:1;position:relative;min-height:0;}
#map{
  width:100%;height:100%;
  /* 防止 iOS 長按出現放大鏡/選取/拷貝選單 */
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
#map *{-webkit-touch-callout:none;}
/* 復古地圖色調 */
#map.retro .leaflet-tile-pane{filter:sepia(.35) saturate(.75) hue-rotate(-8deg) brightness(.96);}
#map.dark .leaflet-tile-pane{filter:none;}

/* ── 地圖上的浮動按鈕 */
.map-fab{position:absolute;z-index:500;}
.map-fab.layers{top:84px;left:12px;}   /* 縮放 +/− 正下方 */
.map-fab.checkin{bottom:16px;right:12px;}

.fab-btn{
  background:var(--panel);
  border:2px solid var(--border);
  border-radius:var(--radius);
  padding:8px 14px;
  font-family:var(--px);
  font-size:10px;
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  box-shadow:2px 2px 0 rgba(0,0,0,0.3);
}
.fab-btn.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
  width:56px;height:56px;
  border-radius:50%;
  font-size:24px;
  padding:0;
  justify-content:center;
}
.fab-btn.square{
  width:34px;height:34px;
  padding:0;justify-content:center;
  font-size:15px;
}
.fab-btn:active{transform:translate(1px,1px);}

/* ── 圖層選單 */
.layers-menu{
  display:none;
  position:absolute;
  top:124px;left:12px;
  z-index:600;
  background:var(--panel);
  border:2px solid var(--border);
  border-radius:var(--radius);
  box-shadow:3px 3px 0 rgba(0,0,0,0.3);
  padding:10px 12px;
  min-width:170px;
}
.layers-menu.show{display:block;}
.layers-section{font-size:8px;color:var(--muted);letter-spacing:1px;margin:8px 0 6px;}
.layers-section:first-child{margin-top:0;}
.layer-opt{
  display:flex;align-items:center;gap:8px;
  padding:6px 4px;
  font-size:9px;color:var(--text);
  cursor:pointer;user-select:none;-webkit-user-select:none;
  border-radius:4px;
}
.layer-opt:active{background:var(--panel2);}
.layer-check{
  width:14px;height:14px;flex-shrink:0;
  border:1.5px solid var(--border);
  border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:#fff;
  background:var(--panel2);
}
.layer-opt.on .layer-check{background:var(--accent);border-color:var(--accent);}
.layer-opt.on .layer-check::after{content:'✓';}
.style-opt .layer-check{border-radius:50%;}
.style-opt.on .layer-check::after{content:'●';font-size:7px;}

/* ── 時間軸滑桿 */
.time-bar{
  position:absolute;left:12px;right:12px;bottom:16px;
  z-index:600;
  display:flex;align-items:center;gap:10px;
  background:var(--panel);
  border:2px solid var(--border);
  border-radius:var(--radius);
  padding:8px 12px;
  box-shadow:2px 2px 0 rgba(0,0,0,0.3);
}
.time-play{
  flex-shrink:0;width:30px;height:30px;
  background:var(--accent);border:none;border-radius:6px;
  color:#fff;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;
}
.time-bar input[type=range]{
  flex:1;min-width:0;height:4px;
  -webkit-appearance:none;appearance:none;
  background:var(--border);border-radius:2px;outline:none;cursor:pointer;
  touch-action:none;
}
.time-bar input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--gold);border:2px solid var(--bg);cursor:pointer;
}
.time-label{font-size:8px;color:var(--muted);white-space:nowrap;flex-shrink:0;}
.time-step{
  flex-shrink:0;width:26px;height:26px;
  background:var(--panel2);border:1.5px solid var(--border);border-radius:5px;
  color:var(--text);font-family:var(--px);font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;
}
.time-step:active{background:var(--border);}

/* ── 底部卡片區（抽屜式） */
.card-drawer{
  background:var(--panel);
  border-top:1.5px solid var(--border);
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  transition:height .3s ease;
  height:54px;
  overflow:hidden;
  z-index:500;
}
.card-drawer.expanded{height:55vh;}

.drawer-handle{
  display:flex;
  flex-direction:column;
  padding:6px 14px 0;
  cursor:grab;
  flex-shrink:0;
  gap:4px;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}
.drawer-pill{
  width:40px;height:4px;
  background:var(--border);
  border-radius:2px;
  margin:0 auto;
  flex-shrink:0;
}
.drawer-row{display:flex;align-items:center;gap:10px;width:100%;padding-bottom:4px;}
.drawer-tabs{display:flex;gap:0;flex:1;}
.dtab{
  font-family:var(--px);
  font-size:9px;
  padding:4px 10px;
  border:none;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  border-bottom:2px solid transparent;
  white-space:nowrap;
}
.dtab.on{color:var(--accent);border-bottom-color:var(--accent);}

.card-list{
  overflow-y:auto;
  flex:1;
  padding:8px;
}

/* ── 打卡卡片 */
.diary-card{
  display:flex;
  gap:10px;
  padding:10px;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:8px;
  cursor:pointer;
  transition:box-shadow .1s;
}
.diary-card:active{box-shadow:inset 0 0 0 2px var(--border);}
.diary-thumb{
  width:56px;height:56px;
  border-radius:4px;
  border:1px solid var(--border);
  flex-shrink:0;
  background:#faf6ee;
  image-rendering:pixelated;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
.diary-thumb img,.diary-thumb svg{width:100%;height:100%;image-rendering:pixelated;}
.diary-info{flex:1;min-width:0;}
.diary-name{font-size:10px;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.diary-meta{display:flex;gap:6px;align-items:center;margin-bottom:4px;}
.diary-tag{
  font-size:8px;padding:2px 6px;border-radius:3px;
  font-family:var(--px);white-space:nowrap;
}
.tag-checkin{background:#4a2a32;color:#f0a0b0;border:1px solid #7a4050;}
.tag-wish{background:#4a3c1c;color:#e8c060;border:1px solid #7a6430;}
.tag-stay{background:#1e3a4a;color:#80c0e0;border:1px solid #356a88;}
.tag-expense{background:#1e4030;color:#8ad8a8;border:1px solid #357a52;}
.diary-date{font-size:8px;color:var(--muted);}
.diary-note{font-size:9px;color:var(--muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.diary-footer{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
.diary-comments{font-size:8px;color:var(--muted);}
.diary-author{width:20px;height:30px;flex-shrink:0;}
.diary-author svg{width:100%;height:100%;image-rendering:pixelated;}

/* ── Popup */
.px-popup{
  font-family:var(--px) !important;
  min-width:220px;
}
.px-popup .leaflet-popup-content-wrapper{
  background:var(--panel);
  color:var(--text);
  border:2px solid var(--border);
  border-radius:var(--radius);
  box-shadow:4px 4px 0 rgba(0,0,0,0.35);
  padding:0;
}
.px-popup .leaflet-popup-tip{background:var(--panel);border:1px solid var(--border);}
.px-popup .leaflet-popup-content{margin:0;width:auto !important;}
.popup-inner{padding:12px 14px;}
.popup-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.popup-icon{width:28px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.popup-icon svg{width:100%;height:100%;image-rendering:pixelated;}
.popup-title{font-size:10px;color:var(--text);flex:1;}
.popup-img{
  width:100%;aspect-ratio:1;
  background:#faf6ee;
  border-radius:4px;
  border:1px solid var(--border);
  image-rendering:pixelated;
  margin-bottom:8px;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.popup-img svg,.popup-img img{width:100%;height:100%;image-rendering:pixelated;object-fit:contain;}
.popup-note{font-size:9px;color:var(--text);line-height:1.6;margin-bottom:8px;}
.popup-actions{display:flex;gap:6px;margin-top:10px;border-top:1px solid var(--border);padding-top:8px;}
.popup-action-btn{
  flex:1;padding:7px 6px;
  border:1px solid var(--border);
  background:var(--panel2);
  font-family:var(--px);font-size:8px;
  color:var(--text);cursor:pointer;
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.popup-action-btn:active{background:var(--border);}
.popup-more{
  flex-shrink:0;align-self:flex-start;
  background:none;border:1px solid var(--border);border-radius:4px;
  color:var(--muted);font-family:var(--px);font-size:12px;
  padding:1px 8px;cursor:pointer;line-height:1.4;
}
.popup-more:active{color:var(--text);background:var(--panel2);}
/* 「…」下拉選單（貼著按鈕展開，蓋在塗鴉之上） */
.popup-header{position:relative;z-index:100;}
.popup-img{position:relative;z-index:0;}
.popup-extra{
  display:none;
  position:absolute;top:26px;right:0;
  flex-direction:column;gap:4px;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:6px;
  min-width:100px;
  z-index:999;
  box-shadow:2px 2px 0 rgba(0,0,0,0.35);
}
.popup-extra .popup-action-btn{background:transparent;border:none;justify-content:flex-start;padding:7px 10px;}

/* ── Modal 共用 */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.6);
  z-index:2000;
  align-items:flex-end;justify-content:center;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:var(--panel);
  border-radius:12px 12px 0 0;
  border-top:2px solid var(--border);
  width:100%;max-width:480px;
  max-height:90vh;
  overflow-y:auto;
}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--panel);z-index:1;
}
.modal-title{font-size:11px;color:var(--text);letter-spacing:1px;}
.modal-close{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;}
.modal-body{padding:14px 16px;}

.step-row{margin-bottom:16px;}
.step-label{
  display:flex;align-items:center;gap:8px;
  font-size:9px;color:var(--muted);
  margin-bottom:8px;letter-spacing:1px;
}
.step-num{
  width:18px;height:18px;border-radius:50%;
  background:var(--accent);color:#fff;
  font-size:9px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}

/* 類型選擇 */
.type-row{display:flex;gap:8px;}
.type-chip{
  flex:1;padding:10px 6px;
  border:2px solid var(--border);
  border-radius:var(--radius);
  background:var(--panel2);
  font-family:var(--px);font-size:10px;color:var(--text);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.type-chip.on{border-color:var(--accent);background:#3c2a32;color:#f0a0b0;}

.location-card{
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:10px 12px;
  display:flex;align-items:center;gap:10px;
  cursor:pointer;
  background:var(--panel2);
}
.location-card:active{background:var(--border);}
.location-name{font-size:10px;color:var(--text);flex:1;}
.location-coord{font-size:8px;color:var(--muted);}
.location-edit{font-size:16px;color:var(--muted);}

.name-input{
  width:100%;
  background:var(--panel2);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:10px 12px;
  font-family:var(--px);font-size:10px;
  color:var(--text);outline:none;
  margin-top:8px;
}
.name-input:focus{border-color:var(--accent);}

.member-grid{display:flex;gap:8px;flex-wrap:wrap;}
.member-choice{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 12px;
  border:2px solid var(--border);
  border-radius:var(--radius);
  cursor:pointer;
  background:var(--panel2);
  position:relative;
  min-width:70px;
}
.member-choice.on{border-color:var(--accent);background:#3c2a32;}
.member-choice .check{
  position:absolute;top:-6px;right:-6px;
  width:16px;height:16px;
  background:var(--accent);border-radius:50%;
  display:none;align-items:center;justify-content:center;
  font-size:10px;color:#fff;
}
.member-choice.on .check{display:flex;}
.member-choice-avatar{width:32px;height:52px;image-rendering:pixelated;display:flex;align-items:center;justify-content:center;}
.member-choice-avatar svg{width:100%;height:100%;image-rendering:pixelated;}
.member-choice-name{font-size:8px;color:var(--text);}

.diary-textarea{
  width:100%;
  background:var(--panel2);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:10px 12px;
  font-family:var(--px);
  font-size:10px;
  color:var(--text);
  resize:none;
  height:90px;
  outline:none;
  line-height:1.6;
}
.diary-textarea:focus{border-color:var(--accent);}
.char-count{font-size:8px;color:var(--muted);text-align:right;margin-top:4px;}

.draw-preview-row{display:flex;gap:10px;align-items:center;}
.draw-thumb{
  width:64px;height:64px;
  border:2px solid var(--border);
  border-radius:6px;
  background:#faf6ee;
  image-rendering:pixelated;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;flex-shrink:0;
}
.draw-thumb svg{width:100%;height:100%;image-rendering:pixelated;}
.draw-edit-btn{
  flex:1;padding:10px;
  border:1.5px solid var(--accent);
  background:#3c2a32;
  color:#f0a0b0;
  font-family:var(--px);font-size:10px;
  border-radius:var(--radius);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.draw-edit-btn:active{background:#4a3038;}

.submit-btn{
  width:100%;padding:14px;
  background:var(--accent);
  border:none;border-radius:var(--radius);
  color:#fff;font-family:var(--px);font-size:11px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:8px;
  letter-spacing:1px;
}
.submit-btn:active{background:#a84050;}
.submit-btn:disabled{background:#4a5260;cursor:not-allowed;}

/* ── 留言 Modal */
.comment-item{
  display:flex;gap:10px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
}
.comment-item:last-child{border-bottom:none;}
.comment-avatar{width:24px;height:40px;flex-shrink:0;image-rendering:pixelated;display:flex;align-items:center;justify-content:center;}
.comment-avatar svg{width:100%;height:100%;image-rendering:pixelated;}
.comment-body{flex:1;}
.comment-name{font-size:9px;color:var(--text);margin-bottom:3px;}
.comment-text{font-size:10px;color:var(--muted);line-height:1.6;}
.comment-time{font-size:8px;color:var(--border);margin-top:3px;}
.comment-input-row{
  display:flex;gap:8px;
  padding:10px 16px;
  border-top:1px solid var(--border);
  position:sticky;bottom:0;background:var(--panel);
}
.comment-input{
  flex:1;background:var(--panel2);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:8px 12px;
  font-family:var(--px);font-size:10px;
  color:var(--text);outline:none;
}
.comment-input:focus{border-color:var(--accent);}
.comment-send{
  padding:8px 14px;
  background:var(--accent);border:none;
  color:#fff;font-family:var(--px);font-size:10px;
  border-radius:var(--radius);cursor:pointer;
}

/* ── Leaflet 覆蓋 */
.leaflet-container{background:#2a3138 !important;}
.leaflet-control-zoom a{
  background:var(--panel) !important;
  color:var(--text) !important;
  border:1px solid var(--border) !important;
  font-family:var(--px) !important;
  font-size:14px !important;
}
.leaflet-control-attribution{
  font-family:sans-serif;
  font-size:9px;
  background:rgba(43,52,64,0.8) !important;
  color:var(--muted) !important;
}
.leaflet-control-attribution a{color:var(--accent2) !important;}
.leaflet-marker-icon{transition:none !important;}

/* ── 自訂 cluster（無泡泡，數字直接顯示在下方） */
.px-cluster{
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;
  image-rendering:pixelated;
  filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.45));
}
.px-cluster-count{
  font-family:var(--px);font-size:9px;
  color:#fff;line-height:1;margin-top:2px;
  text-shadow:1px 1px 0 #1a2026,-1px 1px 0 #1a2026,1px -1px 0 #1a2026,-1px -1px 0 #1a2026;
}

/* ── 手機觸控：按鈕不觸發雙擊縮放 */
button,.fab-btn,.dtab,.member-avatar,.layer-opt,.type-chip,.diary-card{touch-action:manipulation;}

/* ── 打卡視窗：半屏 sheet，上方仍可看地圖（overlay 不遮地圖） */
#checkinModal{background:transparent;pointer-events:none;}
#checkinModal .modal-box{
  pointer-events:auto;
  height:52vh;
  border:2px solid var(--border);
  border-bottom:none;
  box-shadow:0 -6px 20px rgba(0,0,0,0.5);
  transition:height .25s ease;
  /* pill 與標題固定在頂部，只有內容捲動 */
  display:flex;flex-direction:column;overflow:hidden;
}
#checkinModal .modal-box.tall{height:92vh;}
#checkinModal .modal-header{flex-shrink:0;position:static;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
#checkinModal .modal-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.sheet-pill{
  height:18px;display:flex;align-items:center;justify-content:center;
  cursor:grab;flex-shrink:0;touch-action:none;
}
.sheet-pill::before{
  content:'';width:40px;height:4px;border-radius:2px;background:var(--border);
}

</style>
</head>
<body>

<!-- 頂部標題列 -->
<div class="topbar">
  <div class="topbar-title" id="tripTitle">冰島旅行日記</div>
  <div class="topbar-members" id="topbarMembers"></div>
</div>

<!-- 主區域 -->
<div class="main">
  <div class="map-wrap">
    <div id="map" class="retro"></div>

    <!-- 圖層按鈕 -->
    <div class="map-fab layers">
      <button class="fab-btn square" onclick="toggleLayers()" title="圖層">⊞</button>
    </div>

    <!-- 圖層選單 -->
    <div class="layers-menu" id="layersMenu">
      <div class="layers-section">顯示項目</div>
      <div class="layer-opt on" id="lo-checkin" onclick="toggleFilter('checkin')"><span class="layer-check"></span>🐾 打卡</div>
      <div class="layer-opt on" id="lo-wish" onclick="toggleFilter('wish')"><span class="layer-check"></span>💗 想去</div>
      <div class="layer-opt on" id="lo-stay" onclick="toggleFilter('stay')"><span class="layer-check"></span>🏠 住宿</div>
      <div class="layer-opt on" id="lo-expense" onclick="toggleFilter('expense')"><span class="layer-check"></span>💰 消費</div>
      <div class="layer-opt on" id="lo-trail" onclick="toggleFilter('trail')"><span class="layer-check"></span>〰 足跡連線</div>
      <div class="layer-opt" id="lo-timebar" onclick="toggleTimeBar()"><span class="layer-check"></span>⏳ 時間軸</div>
      <div class="layers-section">地圖風格</div>
      <div class="layer-opt style-opt on" id="ls-retro" onclick="setMapStyle('retro')"><span class="layer-check"></span>復古</div>
      <div class="layer-opt style-opt" id="ls-light" onclick="setMapStyle('light')"><span class="layer-check"></span>明亮</div>
      <div class="layer-opt style-opt" id="ls-dark" onclick="setMapStyle('dark')"><span class="layer-check"></span>暗色</div>
    </div>

    <!-- 打卡按鈕 -->
    <div class="map-fab checkin" id="checkinFab">
      <button class="fab-btn primary" onclick="openCheckin()" title="打卡">🐾</button>
    </div>

    <!-- 時間軸滑桿 -->
    <div class="time-bar" id="timeBar" style="display:none;">
      <button class="time-play" id="timePlay" onclick="playTimeline()">▶</button>
      <button class="time-step" onclick="stepTimeline(-1)">−</button>
      <input type="range" id="timeRange" min="0" max="100" step="1" value="100" oninput="stopTimePlay();setTimeFilter(this.value)">
      <button class="time-step" onclick="stepTimeline(1)">＋</button>
      <span class="time-label" id="timeLabel"></span>
    </div>
  </div>

  <!-- 底部抽屜 -->
  <div class="card-drawer" id="cardDrawer">
    <div class="drawer-handle" id="drawerHandle">
      <div class="drawer-pill"></div>
      <div class="drawer-row">
        <div class="drawer-tabs" id="drawerTabs"></div>
        <div style="font-size:10px;color:var(--muted);white-space:nowrap;" id="drawerCount">0 筆</div>
      </div>
    </div>
    <div class="card-list" id="cardList"></div>
  </div>
</div>

<!-- 新增打卡 Modal -->
<div class="modal-overlay" id="checkinModal">
  <div class="modal-box" id="checkinSheet">
    <div class="sheet-pill" id="sheetPill"></div>
    <div class="modal-header">
      <div class="modal-title" id="checkinModalTitle">新增紀錄</div>
      <button class="modal-close" onclick="closeCheckin()">✕</button>
    </div>
    <div class="modal-body">
      <!-- Step 1: 類型 -->
      <div class="step-row" id="stepType">
        <div class="step-label"><div class="step-num">1</div>選擇類型</div>
        <div class="type-row" id="typeRow">
          <button class="type-chip on" data-type="checkin" onclick="selectType('checkin')">🐾 打卡</button>
          <button class="type-chip" data-type="wish" onclick="selectType('wish')">💗 想去</button>
          <button class="type-chip" data-type="stay" onclick="selectType('stay')">🏠 住宿</button>
        </div>
      </div>

      <!-- Step 2: 地點 -->
      <div class="step-row" id="stepLocation">
        <div class="step-label"><div class="step-num">2</div>選擇地點</div>
        <div style="display:flex;gap:8px;">
          <div class="location-card" id="locationCard" onclick="pickLocation()" style="flex:1;">
            <div style="font-size:18px;">📍</div>
            <div style="flex:1;">
              <div class="location-name" id="locationName">點地圖選擇地點</div>
              <div class="location-coord" id="locationCoord"></div>
            </div>
            <div class="location-edit">✎</div>
          </div>
          <button class="type-chip" style="flex:0 0 auto;padding:10px 14px;font-size:18px;" onclick="tryGPS(true)" title="用目前位置">⌖</button>
        </div>
        <input class="name-input" id="placeName" placeholder="地點名稱（選填，預設用座標）" maxlength="40">
      </div>

      <!-- 消費帳目資訊（編輯消費時顯示，點了去帳簿） -->
      <div class="step-row" id="expenseInfoRow" style="display:none;font-size:10px;color:var(--gold);cursor:pointer;padding:10px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);"></div>

      <!-- 日期（編輯時也會顯示） -->
      <div class="step-row" id="stepDate">
        <div class="step-label"><div class="step-num">📅</div>日期</div>
        <input type="date" class="name-input" id="checkinDate" style="margin-top:0;color-scheme:dark;">
      </div>

      <!-- Step 3: 角色 -->
      <div class="step-row" id="stepMember">
        <div class="step-label"><div class="step-num">3</div>選擇角色</div>
        <div class="member-grid" id="memberGrid"></div>
      </div>

      <!-- Step 4: 日記 -->
      <div class="step-row">
        <div class="step-label"><div class="step-num">4</div>寫下你的日記</div>
        <textarea class="diary-textarea" id="diaryText" placeholder="記錄此刻的感受…" maxlength="200" oninput="updateCharCount()"></textarea>
        <div class="char-count"><span id="charCount">0</span>/200</div>
      </div>

      <!-- Step 5: 畫圖 -->
      <div class="step-row">
        <div class="step-label"><div class="step-num">5</div>畫一張圖（可選）</div>
        <div class="draw-preview-row">
          <div class="draw-thumb" id="drawThumb">🖼</div>
          <button class="draw-edit-btn" onclick="openDrawPanel()">✏ 編輯畫圖</button>
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitCheckin()" disabled>🐾 儲存</button>
    </div>
  </div>
</div>

<!-- 留言 Modal -->
<div class="modal-overlay" id="commentModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="commentModalTitle">留言</div>
      <button class="modal-close" onclick="closeComments()">✕</button>
    </div>
    <div style="padding:8px 16px;flex:1;" id="commentList"></div>
    <div class="comment-input-row">
      <input class="comment-input" id="commentInput" placeholder="寫下留言…" onkeydown="if(event.key==='Enter')sendComment()">
      <button class="comment-send" onclick="sendComment()">送出</button>
    </div>
  </div>
</div>

<!-- 消費卡片 Modal（地圖上直接看，不跳頁） -->
<div class="modal-overlay" id="expCardModal" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal-box" style="max-width:360px;border-radius:12px;border:2px solid var(--border);margin-bottom:10vh;">
    <div class="modal-header">
      <div class="modal-title">🧾 帳目卡片</div>
      <button class="modal-close" onclick="document.getElementById('expCardModal').classList.remove('show')">✕</button>
    </div>
    <div class="modal-body" id="expCardBody"></div>
  </div>
</div>

<!-- 畫板 Modal（共用 pixelpad.js） -->
<div class="modal-overlay" id="drawModal">
  <div class="modal-box" style="max-height:95vh;">
    <div class="modal-header">
      <div class="modal-title">畫一張圖</div>
      <button class="modal-close" onclick="document.getElementById('drawModal').classList.remove('show')">✕</button>
    </div>
    <div id="pixelPadMount"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// ══════════════════════════════════════════
//  設定（從 config.js 讀）
// ══════════════════════════════════════════
const TRIP_CONFIG = window.TRIP_CONFIG || {};
const R2_WORKER = TRIP_CONFIG.r2Worker || 'https://worker-little-field-805c.xfish7.workers.dev';

// ══════════════════════════════════════════
//  成員 sprite（從 sprites.js 讀，第 1 格靜態）
// ══════════════════════════════════════════
function spriteSvg(m, attrs) {
  const frames = window.SPRITES?.[m.spriteKey];
  if (frames?.[0]) {
    return `<svg viewBox="0 0 16 28" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;image-rendering:pixelated;display:block;" ${attrs||''}>${frames[0]}</svg>`;
  }
  return `<span style="font-size:16px;">${m.icon||'📍'}</span>`;
}

// 成員小圖示（spritetool 綁定的 iconKey 單格圖；沒有就用 emoji）
function iconSvg(m) {
  const frame = m.iconKey && window.SPRITES?.[m.iconKey];
  if (frame) {
    const g = m.iconGrid || 16;
    return `<svg viewBox="0 0 ${g} ${g}" style="width:100%;height:100%;image-rendering:pixelated;display:block;">${frame}</svg>`;
  }
  return `<span style="font-size:16px;">${m.icon||'📍'}</span>`;
}

// ══════════════════════════════════════════
//  住宿點（從 GAS ?sheet=staymap 載入）
// ══════════════════════════════════════════
let STAYS = [];

async function loadStays() {
  const gasBase = TRIP_CONFIG.apiBase || '';
  if (!gasBase) return;
  try {
    const res = await fetch(gasBase + '?sheet=staymap', { cache:'no-store' });
    const data = await res.json();
    if (data.stays && Array.isArray(data.stays)) {
      STAYS = data.stays.map((s, i) => ({ id:'s'+i, ...s }));
      renderStayLine();
      renderMarkers();
    }
  } catch(e) { console.warn('住宿資料載入失敗', e); }
}

// 打卡資料（從 GAS 載入）
let checkins = [];
// 消費資料（從帳簿 sheet 讀，有座標的才會出現）
let expenses = [];
// 地圖上所有項目（打卡 + 消費）
function allItems() { return checkins.concat(expenses); }

// ══════════════════════════════════════════
//  狀態
// ══════════════════════════════════════════
let filters = { checkin:true, wish:true, stay:true, expense:true, trail:true };
let members = TRIP_CONFIG.members || [];
let drawerOpen = false;
let currentTab = 'all';
let memberFilter = null;
let pendingCheckin = { type:'checkin', lat:null, lng:null, who:null, text:'', svgData:null, svgGrid:16, pngBlob:null };
let currentCommentId = null;
let pickingLocation = false;
let markers = {};

// ══════════════════════════════════════════
//  地圖初始化
// ══════════════════════════════════════════
const map = L.map('map', {
  center: TRIP_CONFIG.mapCenter || [64.9, -19],
  zoom: TRIP_CONFIG.mapZoom || 6,
  zoomControl: true,
});

const TILE_STYLES = {
  retro: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  light: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  dark:  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
};
let tileLayer = L.tileLayer(TILE_STYLES.retro, { attribution:'© OSM · CARTO', maxZoom:19 }).addTo(map);
let mapStyle = 'retro';

function setMapStyle(style) {
  if (!TILE_STYLES[style]) return;
  mapStyle = style;
  tileLayer.setUrl(TILE_STYLES[style]);
  const el = document.getElementById('map');
  el.classList.toggle('retro', style==='retro');
  el.classList.toggle('dark', style!=='retro');
  ['retro','light','dark'].forEach(s =>
    document.getElementById('ls-'+s).classList.toggle('on', s===style));
}

// 住宿路線
let stayLine = null;
function renderStayLine() {
  if (stayLine) { map.removeLayer(stayLine); stayLine = null; }
  if (!filters.stay || STAYS.length < 2) return;
  stayLine = L.polyline(
    STAYS.map(s=>[s.lat,s.lng]),
    { color:'#6a8aa8', weight:2, dashArray:'6,4', opacity:0.7 }
  ).addTo(map);
}

// Cluster group
const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 36,
  // 同座標多筆：點 cluster 在最大縮放時展開成一圈選項（spiderfy 圓輪）
  spiderfyOnMaxZoom: true,
  spiderfyDistanceMultiplier: 1.8,
  zoomToBoundsOnClick: true,
  iconCreateFunction: cluster => {
    const children = cluster.getAllChildMarkers();
    // 取時間最新的一筆當代表縮圖
    const latest = children.reduce((a,b) =>
      ((b.options?.ts||0) > (a.options?.ts||0) ? b : a), children[0]);
    const o = latest?.options || {};
    const count = cluster.getChildCount();
    let inner = '';
    if (o.svgData) {
      inner = `<svg width="36" height="36" viewBox="0 0 ${o.svgGrid||16} ${o.svgGrid||16}" style="image-rendering:pixelated;display:block;">${o.svgData}</svg>`;
    } else if (o.spriteHtml) {
      inner = `<div style="width:24px;height:36px;">${o.spriteHtml}</div>`;
    } else {
      inner = `<div style="font-size:18px;line-height:36px;">${o.fallbackIcon||'📍'}</div>`;
    }
    return L.divIcon({
      html:`<div class="px-cluster" style="width:44px;height:56px;">
        ${inner}
        <div class="px-cluster-count">${count}</div>
      </div>`,
      className:'', iconSize:[44,56], iconAnchor:[22,28],
    });
  }
});
map.addLayer(clusterGroup);

// zoom 切換 marker 樣式
map.on('zoomend', () => renderMarkers());

// 點地圖選位置（順便關掉圖層選單）
map.on('click', e => {
  closeLayers();
  if (pickingLocation) {
    pendingCheckin.lat = e.latlng.lat;
    pendingCheckin.lng = e.latlng.lng;
    pickingLocation = false;
    map.getContainer().style.cursor = '';
    document.getElementById('locationName').textContent = `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
    document.getElementById('locationCoord').textContent = '點擊位置';
    document.getElementById('checkinModal').classList.add('show');
    checkSubmitReady();
  }
});

// 長按地圖（手機）／右鍵（電腦）→ 快速放標籤
map.on('contextmenu', e => {
  if (pickingLocation) return;
  showQuickTag(e.latlng);
});

// ── 點地圖快速放標籤（打卡/想去） ──────────
const quickTagPopup = L.popup({ className:'px-popup', closeButton:false, maxWidth:200, autoPan:false, offset:[0,-4] });

function showQuickTag(latlng) {
  const lat = latlng.lat, lng = latlng.lng;
  quickTagPopup.setLatLng(latlng).setContent(`
    <div class="popup-inner" style="padding:8px 10px;">
      <div style="font-size:8px;color:var(--muted);margin-bottom:6px;">${lat.toFixed(4)}, ${lng.toFixed(4)}</div>
      <div style="display:flex;gap:6px;">
        <button class="popup-action-btn" onclick="quickAdd('checkin',${lat},${lng})">🐾 打卡</button>
        <button class="popup-action-btn" onclick="quickAdd('wish',${lat},${lng})">💗 想去</button>
      </div>
    </div>
  `).openOn(map);
}

function quickAdd(type, lat, lng) {
  map.closePopup(quickTagPopup);
  openCheckin();
  selectType(type);
  pendingCheckin.lat = lat;
  pendingCheckin.lng = lng;
  document.getElementById('locationName').textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  document.getElementById('locationCoord').textContent = '地圖標記位置 · 點此可重選';
  checkSubmitReady();
}

// ══════════════════════════════════════════
//  Marker 圖示
// ══════════════════════════════════════════
function getMemberByName(name) {
  const m = members.find(mm=>mm.name===name);
  return { name, color:'#8a95a4', icon:'📍', ...(m||{}) };
}

function makeMarkerIcon(item, zoom, labeled) {
  const m = getMemberByName(item.who);

  // 消費：跟普通打卡同樣長相，sprite 角落多一顆金色 $ 點；
  // 最新幾筆加品項金額小標籤，其餘收起
  if (item.type === 'expense') {
    if (zoom < 7) {
      return L.divIcon({
        html:`<div style="width:11px;height:11px;border-radius:50%;background:var(--gold);color:#332b10;font-family:var(--px);font-size:8px;line-height:11px;text-align:center;filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.4));">$</div>`,
        className:'', iconSize:[13,13], iconAnchor:[6,6],
      });
    }
    const dollarDot = `<span style="position:absolute;right:-7px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--gold);color:#332b10;font-family:var(--px);font-size:8px;line-height:12px;text-align:center;">$</span>`;
    const label = labeled
      ? `<div style="font-family:var(--px);font-size:7px;color:#f0e2b0;background:rgba(50,42,16,.88);border:1px solid var(--gold);border-radius:3px;padding:1px 4px;white-space:nowrap;margin-top:1px;">${truncName(item.name)} −${item.amount} ${item.currency}</div>`
      : '';
    // 有補畫塗鴉 → 顯示塗鴉磚（金框）
    if (item.svgData) {
      const g = item.svgGrid || 16;
      return L.divIcon({
        html:`<div style="display:flex;flex-direction:column;align-items:center;">
          <div style="width:40px;height:40px;border:2px solid var(--gold);border-radius:4px;background:#faf6ee;overflow:hidden;box-shadow:2px 2px 0 rgba(0,0,0,0.3);image-rendering:pixelated;position:relative;">
            <svg width="40" height="40" viewBox="0 0 ${g} ${g}" style="image-rendering:pixelated;display:block;">${item.svgData}</svg>
            ${dollarDot}
          </div>${label}
        </div>`,
        className:'', iconSize:[labeled?90:44, labeled?56:44], iconAnchor:[labeled?45:22, labeled?28:22],
      });
    }
    return L.divIcon({
      html:`<div style="display:flex;flex-direction:column;align-items:center;filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.4));">
        <div style="width:22px;height:36px;position:relative;">
          ${spriteSvg(m)}
          ${dollarDot}
        </div>${label}
      </div>`,
      className:'', iconSize:[labeled?90:26, labeled?52:38], iconAnchor:[labeled?45:13, 36],
    });
  }

  // 稍微放大就顯示塗鴉（讓地圖長滿塗鴉的感覺）
  if (zoom >= 7 && item.svgData) {
    const g = item.svgGrid || 16;
    return L.divIcon({
      html:`<div style="width:40px;height:40px;border:2px solid ${m.color};border-radius:4px;background:#faf6ee;overflow:hidden;box-shadow:2px 2px 0 rgba(0,0,0,0.3);image-rendering:pixelated;">
        <svg width="40" height="40" viewBox="0 0 ${g} ${g}" style="image-rendering:pixelated;display:block;">${item.svgData}</svg>
      </div>`,
      className:'', iconSize:[40,40], iconAnchor:[20,20],
    });
  }

  // 想去/住宿 → 固定圖示
  if (item.type==='wish' || item.type==='stay') {
    return L.divIcon({
      html:`<div style="font-size:${zoom>=7?22:16}px;line-height:1;filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.4));">${item.type==='wish'?'💗':'🏠'}</div>`,
      className:'', iconSize:[28,28], iconAnchor:[14,14],
    });
  }

  // 打卡 → 成員 sprite（縮小時也是像素小人，只是小一點）
  if (zoom < 7) {
    return L.divIcon({
      html:`<div style="width:14px;height:24px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.4));">${spriteSvg(m)}</div>`,
      className:'', iconSize:[14,24], iconAnchor:[7,22],
    });
  }
  return L.divIcon({
    html:`<div style="width:24px;height:40px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.4));">${spriteSvg(m)}</div>`,
    className:'', iconSize:[24,40], iconAnchor:[12,38],
  });
}

// ══════════════════════════════════════════
//  渲染 Markers
// ══════════════════════════════════════════
// 長文字截斷（地圖小標籤用，完整內容看 popup/卡片）
function truncName(n, max) {
  n = String(n||'');
  max = max || 10;
  return n.length > max ? n.slice(0, max) + '…' : n;
}

// 取打卡時間戳（排序與「最新」判斷用）
function itemTs(it) {
  if (it.time) { const t = Date.parse(it.time); if (!isNaN(t)) return t; }
  const m = String(it.id||'').match(/(\d{10,})/);
  return m ? +m[1] : 0;
}

// 打卡時間序連線
let trailLine = null;
function renderTrail(visible) {
  if (trailLine) { map.removeLayer(trailLine); trailLine = null; }
  if (!filters.trail) return;
  // 打卡＋消費一起連線（圖層取消勾選消費時自然不參與）
  const pts = visible
    .filter(it => it.type === 'checkin' || it.type === 'expense')
    .sort((a,b) => itemTs(a) - itemTs(b))
    .map(it => [it.lat, it.lng]);
  if (pts.length < 2) return;
  trailLine = L.polyline(pts, {
    color:'#d8a838', weight:2, dashArray:'2,6', opacity:0.8,
  }).addTo(map);
}

function renderMarkers() {
  clusterGroup.clearLayers();
  markers = {};
  const zoom = map.getZoom();

  // 住宿點（行程表）
  if (filters.stay) {
    STAYS.forEach(s => {
      const m = L.marker([s.lat, s.lng], {
        icon: L.divIcon({
          html:`<div style="font-size:20px;line-height:1;filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.4));">🏠</div>`,
          className:'', iconSize:[26,26], iconAnchor:[13,13],
        }),
        fallbackIcon:'🏠', memberColor:'#6a8aa8', svgData:null,
      }).bindPopup(`<div class="popup-inner"><div class="popup-header"><div class="popup-icon">🏠</div><div class="popup-title">${s.name}</div></div><div class="popup-note">${s.date}</div></div>`, {className:'px-popup', maxWidth:240, closeButton:false});
      clusterGroup.addLayer(m);
    });
  }

  // 打卡足跡
  const visible = getVisible();
  // 消費標籤只給最新 5 筆，其餘收成 💰 角標
  const labeledIds = new Set(
    visible.filter(it => it.type==='expense')
      .sort((a,b) => itemTs(b) - itemTs(a))
      .slice(0, 5).map(it => it.id)
  );
  visible.forEach(item => {
    const icon = makeMarkerIcon(item, zoom, labeledIds.has(item.id));
    const m = getMemberByName(item.who);
    const marker = L.marker([item.lat, item.lng], {
      icon,
      ts: itemTs(item),
      memberColor: item.type==='stay' ? '#6a8aa8' : m.color,
      svgData: item.svgData,
      svgGrid: item.svgGrid || 16,
      spriteHtml: (item.type==='checkin'||item.type==='expense') ? spriteSvg(m) : null,
      fallbackIcon: item.type==='wish' ? '💗' : item.type==='stay' ? '🏠' : m.icon,
    }).bindPopup(() => buildPopupContent(item), { className:'px-popup', maxWidth:240, closeButton:false });
    markers[item.id] = marker;
    clusterGroup.addLayer(marker);
  });

  renderTrail(visible);
  renderCards();
}

function typeMeta(t) {
  return t==='wish'    ? { label:'想去', tag:'tag-wish', icon:'💗' }
       : t==='stay'    ? { label:'住宿', tag:'tag-stay', icon:'🏠' }
       : t==='expense' ? { label:'消費', tag:'tag-expense', icon:'💰' }
       : { label:'打卡', tag:'tag-checkin', icon:'🐾' };
}

function itemImgHtml(item) {
  const g = item.svgGrid || 16;
  if (item.svgData) return `<div class="popup-img"><svg viewBox="0 0 ${g} ${g}" style="image-rendering:pixelated;width:100%;height:100%;">${item.svgData}</svg></div>`;
  if (item.imageUrl) return `<div class="popup-img"><img src="${item.imageUrl}" alt=""></div>`;
  return '';
}

function buildPopupContent(item) {
  const m = getMemberByName(item.who);
  const t = typeMeta(item.type);
  const isExp = item.type === 'expense';
  const headIcon = (item.type==='checkin' || isExp) ? spriteSvg(m) : t.icon;

  // 打卡與消費共用同一個窗：有資料的欄位才顯示
  const el = document.createElement('div');
  el.className = 'popup-inner';
  el.innerHTML = `
    <div class="popup-header">
      <div class="popup-icon">${headIcon}</div>
      <div style="flex:1;">
        <div class="popup-title">${item.name}</div>
        <div style="display:flex;gap:6px;align-items:center;margin-top:3px;">
          <span class="diary-tag ${t.tag}">${t.label}</span>
          ${item.date?`<span style="font-size:8px;color:var(--muted)">${item.date}</span>`:''}
        </div>
      </div>
      ${isExp?`<span style="width:13px;height:13px;border-radius:50%;background:var(--gold);color:#332b10;font-family:var(--px);font-size:9px;line-height:13px;text-align:center;flex-shrink:0;margin-right:2px;">$</span>`:''}
      <button class="popup-more" title="更多"
        onclick="const x=this.closest('.popup-header').querySelector('.popup-extra');x.style.display=x.style.display==='flex'?'none':'flex';">…</button>
      <div class="popup-extra">
        <button class="popup-action-btn" onclick="startEditCheckin('${item.id}')">✎ 編輯</button>
        <button class="popup-action-btn" style="color:#e08090;" onclick="deleteCheckin('${item.id}')">🗑 刪除</button>
      </div>
    </div>
    ${itemImgHtml(item)}
    ${item.note?`<div class="popup-note">${item.note}</div>`:''}
    ${isExp?`<div class="popup-note" style="color:var(--gold);cursor:pointer;" onclick="openExpenseCard('${item.id}')">🧾 ${item.name}　−${item.amount} ${item.currency}　›</div>`:''}
    ${isExp&&item.locName?`<div class="popup-note" style="color:var(--muted);">📍 ${item.locName}</div>`:''}
    <div class="popup-actions">
      <button class="popup-action-btn" onclick="openComments('${item.id}')">💬 查看留言（${item.comments?.length||0}）</button>
      <button class="popup-action-btn" onclick="navigateTo(${item.lat},${item.lng})">➤ 導航</button>
    </div>
  `;
  return el;
}

const TABS = [
  { key:'all', label:'全部' },
  { key:'checkin', label:'打卡' },
  { key:'wish', label:'想去' },
  { key:'stay', label:'住宿' },
  { key:'expense', label:'消費' },
];

function buildTabs() {
  const el = document.getElementById('drawerTabs');
  el.innerHTML = TABS.map(t =>
    `<button class="dtab ${t.key===currentTab?'on':''}" onclick="setTab('${t.key}');event.stopPropagation();">${t.label}</button>`
  ).join('');
}

function setTab(key) {
  currentTab = key;
  buildTabs();

function getVisible() {
  return allItems().filter(item => {
    if (!filters[item.type]) return false;
    if (currentTab !== 'all' && item.type !== currentTab) return false;
    if (memberFilter && item.who !== memberFilter) return false;
    if (timeFilterTs && itemTs(item) > timeFilterTs) return false;
    return true;
  });
}

// ══════════════════════════════════════════
//  時間軸滑桿（拖到哪、看到哪之前的足跡；▶ 縮時播放）
// ══════════════════════════════════════════
let timeFilterTs = null;
let timeBarOn = false;
let tlStamps = [], tlTimer = null;   // 刻度＝每筆紀錄，不是均分時間

function toggleTimeBar() {
  if (!timeBarOn) {
    tlStamps = allItems().map(itemTs).filter(Boolean).sort((a,b)=>a-b);
    if (tlStamps.length < 2) { alert('紀錄還太少，多打幾次卡再來玩時間軸吧'); return; }
    timeBarOn = true;
    const r = document.getElementById('timeRange');
    r.max = tlStamps.length;          // 一格＝一筆紀錄，永遠停得準
    r.value = tlStamps.length;
    document.getElementById('timeBar').style.display = 'flex';
    document.getElementById('checkinFab').style.display = 'none';
    setTimeFilter(tlStamps.length);
  } else {
    timeBarOn = false;
    stopTimePlay();
    timeFilterTs = null;
    document.getElementById('timeBar').style.display = 'none';
    document.getElementById('checkinFab').style.display = '';
    renderMarkers();
  }
  document.getElementById('lo-timebar').classList.toggle('on', timeBarOn);
  closeLayers();
}

function setTimeFilter(n) {
  n = +n;
  const total = tlStamps.length;
  timeFilterTs = n >= total ? null : (n <= 0 ? -1 : tlStamps[n-1]);
  const d = new Date(n >= total ? tlStamps[total-1] : (n <= 0 ? tlStamps[0] : tlStamps[n-1]));
  const dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  document.getElementById('timeLabel').textContent =
    n >= total ? `全部 ${total} 筆` : `${dateStr} · ${Math.max(0,n)}/${total}`;
  renderMarkers();
}

function playTimeline() {
  if (tlTimer) { stopTimePlay(); return; }
  const r = document.getElementById('timeRange');
  r.value = 0;
  setTimeFilter(0);
  document.getElementById('timePlay').textContent = '⏸';
  tlTimer = setInterval(() => {
    const v = Math.min(+r.max, +r.value + 1);   // 一次浮現一筆
    r.value = v;
    setTimeFilter(v);
    if (v >= +r.max) stopTimePlay();
  }, 350);
}

// +/− 一格（一筆紀錄）前進後退
function stepTimeline(dir) {
  stopTimePlay();
  const r = document.getElementById('timeRange');
  r.value = Math.max(0, Math.min(+r.max, +r.value + dir));
  setTimeFilter(r.value);
}

function stopTimePlay() {
  if (!tlTimer) return;
  clearInterval(tlTimer);
  tlTimer = null;
  document.getElementById('timePlay').textContent = '▶';
}

function renderCards() {
  const list = document.getElementById('cardList');
  const visible = getVisible();
  document.getElementById('drawerCount').textContent = visible.length + ' 筆';

  list.innerHTML = visible.map(item => {
    const m = getMemberByName(item.who);
    const t = typeMeta(item.type);
    const g = item.svgGrid || 16;
    const thumb = item.svgData
      ? `<svg viewBox="0 0 ${g} ${g}" style="image-rendering:pixelated;width:100%;height:100%;">${item.svgData}</svg>`
      : item.imageUrl
      ? `<img src="${item.imageUrl}" alt="">`
      : (item.type==='checkin'||item.type==='expense')
      ? spriteSvg(m)
      : `<span style="font-size:24px;">${t.icon}</span>`;

    return `<div class="diary-card" onclick="flyTo(${item.lat},${item.lng},'${item.id}')">
      <div class="diary-thumb">${thumb}</div>
      <div class="diary-info">
        <div class="diary-name">${item.name}</div>
        <div class="diary-meta">
          <span class="diary-tag ${t.tag}">${t.label}</span>
          ${item.date?`<span class="diary-date">${item.date}</span>`:''}
        </div>
        ${(() => {
          const n = item.type==='expense'
            ? `−${item.amount} ${item.currency}${item.note?' · '+item.note:''}`
            : item.note;
          return n ? `<div class="diary-note">${n}</div>` : '';
        })()}
        <div class="diary-footer">
          <span class="diary-comments">${item.comments?.length?`💬 ${item.comments.length}`:''}</span>
          <div class="diary-author">${spriteSvg(m)}</div>
        </div>
      </div>
    </div>`;
  }).join('') || `<div style="text-align:center;padding:24px;font-size:9px;color:var(--muted);">還沒有紀錄</div>`;
}

function flyTo(lat, lng, id) {

// 開啟打卡時預設抓 GPS 定位（點地點卡片仍可改成手動選點）
// force=true：使用者按 GPS 鈕，即使已手動選點也覆蓋
function tryGPS(force) {
  if (!navigator.geolocation) return;
  document.getElementById('locationName').textContent = '📡 定位中…';
  document.getElementById('locationCoord').textContent = '點此可改手動選點';
  navigator.geolocation.getCurrentPosition(pos => {
    // 非強制時：使用者已手動選點或進入編輯就不覆蓋
    if (!force && (editingId || pendingCheckin.lat)) return;
    pendingCheckin.lat = pos.coords.latitude;
    pendingCheckin.lng = pos.coords.longitude;
    document.getElementById('locationName').textContent =
      `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
    document.getElementById('locationCoord').textContent = '目前位置（GPS）· 點此可改手動選點';
    checkSubmitReady();
  }, () => {
    if (!pendingCheckin.lat) {
      document.getElementById('locationName').textContent = '點地圖選擇地點';
      document.getElementById('locationCoord').textContent = '（無法取得定位）';
    }
  }, { enableHighAccuracy:true, timeout:8000, maximumAge:60000 });
}

  editingId = id;
  pendingCheckin = {

    text:item.note||'', svgData:item.svgData||null, svgGrid:item.svgGrid||16, pngBlob:null,
  };
  setStepsVisible(false);
  // 消費：日期/金額在帳簿管理 → 藏日期欄、顯示帳目資訊列
  document.getElementById('stepDate').style.display = isExp ? 'none' : '';
  const expRow = document.getElementById('expenseInfoRow');
  expRow.style.display = isExp ? '' : 'none';
  if (isExp) {
    expRow.innerHTML = `🧾 ${item.name}　−${item.amount} ${item.currency}　<span style="color:var(--muted)">點看帳目卡片 ›</span>`;
    expRow.onclick = () => openExpenseCard(item.id);
  }
  document.getElementById('checkinSheet').classList.remove('tall');
  document.getElementById('checkinModalTitle').textContent = '編輯：' + (item.name||'');
  // 顯示原日期，可修改
  document.getElementById('checkinDate').value = (item.date||'').slice(0,10).replace(/\//g,'-');
  document.getElementById('diaryText').value = item.note||'';
  document.getElementById('charCount').textContent = String((item.note||'').length);
  document.getElementById('drawThumb').innerHTML = item.svgData
    ? `<svg viewBox="0 0 ${item.svgGrid||16} ${item.svgGrid||16}" style="image-rendering:pixelated;width:100%;height:100%;">${item.svgData}</svg>`
    : '🖼';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('checkinModal').classList.add('show');
}

// 刪除打卡/消費
async function deleteCheckin(id) {
  // 消費：同步刪除帳簿那一列
  const expItem = expenses.find(c=>c.id===id);
  if (expItem) {
    if (!confirm(`刪除「${expItem.name}」？\n帳簿裡這筆消費也會一併刪除`)) return;
    map.closePopup();
    expenses = expenses.filter(c=>c.id!==id);
    renderMarkers();
    const gasBase = TRIP_CONFIG.apiBase || '';
    if (gasBase && expItem._rowIndex) {
      try {
        await fetch(gasBase, { method:'POST', body: JSON.stringify({
          action:'deleteExpense', rowIndex:expItem._rowIndex,
        })});
        loadExpenses();
      } catch(e) { console.warn('雲端刪除失敗', e); }
    }
    return;
  }
  const item = checkins.find(c=>c.id===id);
  if (!item) return;
  if (!confirm(`刪除「${item.name}」這筆紀錄？`)) return;
  map.closePopup();
  checkins = checkins.filter(c=>c.id!==id);
  renderMarkers();
  const gasBase = TRIP_CONFIG.apiBase || '';
  if (gasBase && item._rowIndex) {
    try {
      await fetch(gasBase, { method:'POST', body: JSON.stringify({
        action:'deleteCheckin', rowIndex:item._rowIndex,
      })});
      // 刪行後其他列的 rowIndex 會位移，重新載入校正
      loadCheckins();
    } catch(e) { console.warn('雲端刪除失敗', e); }
  }
}

// 共用拖曳把手：上拖 onUp、下拖 onDown、沒拖到就當點擊 onTap（按鈕不攔）
function bindDragToggle(zone, { onUp, onDown, onTap }) {
  let startY = null, dragged = false;
  zone.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    startY = e.clientY; dragged = false;
    zone.setPointerCapture(e.pointerId);
  });
  zone.addEventListener('pointermove', e => {
    if (startY === null) return;
    const dy = e.clientY - startY;
    if (dy < -20) { onUp?.();   dragged = true; startY = e.clientY; }
    if (dy >  20) { onDown?.(); dragged = true; startY = e.clientY; }
  });
  // iOS 上 pointer capture 會吃掉 click，改在 pointerup 判斷「沒拖就是點」
  zone.addEventListener('pointerup', e => {
    if (startY !== null && !dragged && !e.target.closest('button')) onTap?.();
    startY = null; dragged = false;
  });
  zone.addEventListener('pointercancel', () => { startY = null; dragged = false; });
  zone.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
}

async function uploadImageToR2(blob) {
  const formData = new FormData();
  formData.append('file', blob, 'checkin.png');
  const res = await fetch(R2_WORKER, { method:'POST', body: formData });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'upload failed');
  return data.url;
}

async function submitCheckin() {
  if (!pendingCheckin.lat || !pendingCheckin.who) return;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '送出中…';

  // ── 編輯模式：更新日記與塗鴉（打卡與消費共用此窗）
  if (editingId) {
    try {
      const expItem = expenses.find(c=>c.id===editingId);
      if (expItem) {
        expItem.note    = pendingCheckin.text;
        expItem.svgData = pendingCheckin.svgData;
        expItem.svgGrid = pendingCheckin.svgGrid;
        const gasBase = TRIP_CONFIG.apiBase || '';
        if (gasBase && expItem._rowIndex) {
          await fetch(gasBase, { method:'POST', body: JSON.stringify({
            action:   'expenseMapEdit',
            rowIndex: expItem._rowIndex,
            note:     expItem.note,
            svgData:  expItem.svgData || '',
            svgGrid:  expItem.svgGrid || 16,
          })});
        }
        editingId = null;
        closeCheckin();
        renderMarkers();
        return;
      }
      const item = checkins.find(c=>c.id===editingId);
      if (item) {
        let imageUrl = item.imageUrl || '';
        if (pendingCheckin.pngBlob) {
          try { imageUrl = await uploadImageToR2(pendingCheckin.pngBlob); }
          catch(e) { console.warn('圖片上傳失敗', e); }
        }
        item.note     = pendingCheckin.text;
        item.svgData  = pendingCheckin.svgData;
        item.svgGrid  = pendingCheckin.svgGrid;
        item.imageUrl = imageUrl;
        // 日期若有改，更新 date 與 time
        const picked = document.getElementById('checkinDate').value;
        if (picked && picked.replace(/-/g,'/') !== item.date) {
          item.date = picked.replace(/-/g,'/');
          item.time = new Date(picked + 'T12:00:00').toISOString();
        }
        const gasBase = TRIP_CONFIG.apiBase || '';
        if (gasBase && item._rowIndex) {
          await fetch(gasBase, { method:'POST', body: JSON.stringify({
            action:   'editCheckin',
            rowIndex: item._rowIndex,
            note:     item.note,
            time:     item.time,
            imageUrl: imageUrl,
            svgData:  item.svgData || '',
            svgGrid:  item.svgGrid || 16,
          })});
        }
      }
      editingId = null;
      closeCheckin();
      renderMarkers();
    } catch(e) {
      console.error('編輯送出失敗', e);
      alert('送出失敗，請稍後再試');
    } finally {
      btn.disabled = false;
      btn.innerHTML = typeMeta(pendingCheckin.type).icon + ' 儲存';
    }
    return;
  }

  try {
    const now = new Date();
    // 用使用者選的日期（預設今天）；選今天就帶現在時刻，補登舊日期則取當天中午
    const picked = document.getElementById('checkinDate').value;   // YYYY-MM-DD
    const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    const timeISO = (!picked || picked === todayStr)
      ? now.toISOString()
      : new Date(picked + 'T12:00:00').toISOString();
    const dateStr = (picked || todayStr).replace(/-/g,'/');

    // 若有畫圖，先上傳到 R2
    let imageUrl = '';
    if (pendingCheckin.pngBlob) {
      try {
        imageUrl = await uploadImageToR2(pendingCheckin.pngBlob);
      } catch(e) {
        console.warn('圖片上傳失敗，繼續送出打卡', e);
      }
    }

    const customName = document.getElementById('placeName').value.trim();
    const item = {
      id:       'c' + Date.now(),
      type:     pendingCheckin.type,
      who:      pendingCheckin.who,
      lat:      pendingCheckin.lat,
      lng:      pendingCheckin.lng,
      name:     customName || document.getElementById('locationName').textContent,
      date:     dateStr,
      time:     timeISO,
      note:     pendingCheckin.text,
      comments: [],
      imageUrl: imageUrl,
      svgData:  pendingCheckin.svgData,
      svgGrid:  pendingCheckin.svgGrid,
    };

    // POST 到 GAS
    const gasBase = TRIP_CONFIG.apiBase || '';
    if (gasBase) {
      const resp = await fetch(gasBase, {
        method:'POST',
        body: JSON.stringify({
          action:   'addCheckin',
          type:     item.type,
          who:      item.who,
          lat:      item.lat,
          lng:      item.lng,
          name:     item.name,
          note:     item.note,
          time:     item.time,
          imageUrl: item.imageUrl,
          svgData:  item.svgData || '',
          svgGrid:  item.svgGrid || 16,
        }),
      });
      // 採用 GAS 回傳的正式 ID，重載時才認得是同一筆（避免本地+雲端雙重顯示）
      try {
        const r = await resp.json();
        if (r?.ok && r.msg?.id) item.id = r.msg.id;
      } catch(e) { /* 回應讀不到就留臨時 ID，5 分鐘保護仍適用 */ }
    }

    checkins.unshift(item);
    closeCheckin();
    renderMarkers();
    map.flyTo([item.lat, item.lng], 12);
    // 重新載入以取得雲端 rowIndex（編輯/刪除需要）
    if (gasBase) loadCheckins();

  } catch(e) {
    console.error('打卡送出失敗', e);
    alert('送出失敗，請稍後再試');
  } finally {
    btn.disabled = false;
    btn.innerHTML = typeMeta(pendingCheckin.type).icon + ' 儲存';
  }
}

// ══════════════════════════════════════════
//  留言
// ══════════════════════════════════════════
function openComments(id) {
  currentCommentId = id;
  const item = allItems().find(c=>c.id===id);
  if (!item) return;
  document.getElementById('commentModalTitle').textContent = `留言（${item.comments?.length||0}）`;
  renderComments(item);
  document.getElementById('commentModal').classList.add('show');
}

function renderComments(item) {
  const el = document.getElementById('commentList');
  el.innerHTML = (item.comments||[]).map(c => {
    const m = getMemberByName(c.who);
    return `<div class="comment-item">
      <div class="comment-avatar">${spriteSvg(m)}</div>
      <div class="comment-body">
        <div class="comment-name" style="color:${m.color}">${c.who}</div>
        <div class="comment-text">${c.text}</div>
        <div class="comment-time">${c.time||''}</div>
      </div>
    </div>`;
  }).join('') || `<div style="text-align:center;padding:24px;font-size:9px;color:var(--muted);">還沒有留言</div>`;
}

async function sendComment() {
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if (!text || !currentCommentId) return;
  const item = allItems().find(c=>c.id===currentCommentId);
  if (!item) return;

  // 先選留言者（預設第一個成員，之後可做選擇）
  const who = members[0]?.name || '';
  const now = new Date();
  const time = now.toISOString();

  item.comments = item.comments || [];
  item.comments.push({ who, text, time });
  input.value = '';
  document.getElementById('commentModalTitle').textContent = `留言（${item.comments.length}）`;
  renderComments(item);
  renderCards();
  if (markers[currentCommentId]) {
    markers[currentCommentId].setPopupContent(buildPopupContent(item));
  }

  // POST 到 GAS（消費留言存帳簿 AB 欄，打卡留言存腳印表）
  const gasBase = TRIP_CONFIG.apiBase || '';
  if (gasBase) {
    const payload = item.type === 'expense'
      ? { action:'addExpenseComment', rowIndex:item._rowIndex, who, text }
      : { action:'addComment', checkinId:item.id, who, text };
    fetch(gasBase, {
      method: 'POST',
      body: JSON.stringify(payload),
    }).catch(e => console.warn('留言同步失敗', e));
  }
}

function closeComments() {
  document.getElementById('commentModal').classList.remove('show');
  currentCommentId = null;
}

// ══════════════════════════════════════════
//  消費卡片彈窗（不跳頁，金額品項要改再去帳簿）
// ══════════════════════════════════════════

      <!-- ⋮ 選單（同帳簿卡片） -->

        onclick="const x=this.nextElementSibling;x.style.display=x.style.display==='flex'?'none':'flex';">⋮</span>
      <div style="display:none;position:absolute;right:8px;top:calc(50% + 18px);z-index:20;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.45);">
        <button class="popup-action-btn" style="border:none;justify-content:flex-start;padding:10px 14px;min-width:96px;color:#e08090;" onclick="document.getElementById('expCardModal').classList.remove('show');deleteCheckin('${item.id}')">🗑️ 刪除</button>
      </div>

        <span style="font-size:8px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 6px;white-space:nowrap;">${item.category||'雜支'}</span>
        <div style="flex:1;height:1px;background:var(--border);margin:0 4px;"></div>
        <span style="font-size:13px;color:var(--gold);white-space:nowrap;">−${item.amount} ${item.currency}</span>
      </div>
      <!-- 品項 -->

      <!-- 備註 -->
      ${item.note?`<div style="font-size:9px;color:var(--muted);line-height:1.6;margin-bottom:6px;">📌 ${item.note}</div>`:''}
      <!-- 底部：付款人 sprite + 地點 + 日期 -->
      <div style="display:flex;align-items:center;gap:8px;font-size:8px;color:var(--muted);">
        <div style="width:16px;height:26px;">${spriteSvg(m)}</div>
        ${item.locName?`<span>📍 ${item.locName}</span>`:''}

// ══════════════════════════════════════════
//  導航
// ══════════════════════════════════════════
function navigateTo(lat, lng) {
  window.open(`https://maps.google.com/?q=${lat},${lng}`, '_blank');
}

// ══════════════════════════════════════════
//  頂部成員頭像（sprite，點擊篩選單一成員）
// ══════════════════════════════════════════
function buildTopbarMembers() {
  const el = document.getElementById('topbarMembers');
  el.innerHTML = members.map(m =>
    `<div class="member-avatar ${memberFilter===m.name?'on':''}" title="${m.name}" onclick="filterByMember('${m.name}')">${spriteSvg(m)}</div>`
  ).join('');
  document.getElementById('tripTitle').textContent = TRIP_CONFIG.tripName || '旅行日記';
}

function filterByMember(name) {
  memberFilter = (memberFilter === name) ? null : name;
  buildTopbarMembers();
  renderMarkers();
}

// 套用雲端打卡：缺塗鴉保留本地新畫的；雲端還沒有的本地新項目不丟
function applyCheckins(cloud) {
  const localById = {};
  checkins.forEach(c => { localById[c.id] = c; });
  const cloudIds = new Set(cloud.map(c => c.id));
  const merged = cloud.map(c => {
    const local = localById[c.id];
    return {
      ...c,
      svgData: c.svgData || local?.svgData || null,
      svgGrid: c.svgGrid || local?.svgGrid || 16,
    };
  });
  // 樂觀更新保護：剛送出、雲端尚未出現的本地項目（5 分鐘內）保留
  // 雲端已有同人同座標的就視為同一筆，不重複顯示
  const cloudKeys = new Set(cloud.map(c =>
    `${c.who}|${(+c.lat).toFixed(5)}|${(+c.lng).toFixed(5)}`));
  checkins.forEach(c => {
    const key = `${c.who}|${(+c.lat).toFixed(5)}|${(+c.lng).toFixed(5)}`;
    if (!cloudIds.has(c.id) && !cloudKeys.has(key) &&
        Date.now() - itemTs(c) < 5*60*1000) merged.unshift(c);
  });
  checkins = merged;
}

function applyExpenses(cloud) {
  const localById = {};
  expenses.forEach(c => { localById[c.id] = c; });
  expenses = cloud.map(e => ({
    id:       e.id,
    type:     'expense',
    who:      e.payer,
    lat:      e.lat,
    lng:      e.lng,
    name:     e.title || e.category || e.location || '消費',
    category: e.category || '',
    qty:      e.qty || '',
    locName:  e.location || '',
    date:     e.date,
    time:     e.date,            // itemTs 用 Date.parse 解析
    amount:   e.amount,
    currency: e.currency,
    note:     e.note || '',
    comments: e.comments || [],
    svgData:  e.svgData || localById[e.id]?.svgData || null,
    svgGrid:  e.svgGrid || localById[e.id]?.svgGrid || 16,
    _rowIndex: e._rowIndex,
  }));
}

// ══════════════════════════════════════════
//  GAS 載入打卡資料
// ══════════════════════════════════════════
async function loadCheckins() {
  const gasBase = TRIP_CONFIG.apiBase || '';
  if (!gasBase) {
    console.log('未設定 GAS，使用空資料');
    return;
  }
  try {
    const res = await fetch(gasBase + '?sheet=checkin', { cache:'no-store' });
    const data = await res.json();
    if (data.checkins && Array.isArray(data.checkins)) {
      applyCheckins(data.checkins);
      renderMarkers();
    }
  } catch(e) {
    console.warn('打卡資料載入失敗', e);
  }
}

// ══════════════════════════════════════════
//  帳簿消費載入（有座標的雜支）
// ══════════════════════════════════════════
async function loadExpenses() {
  const gasBase = TRIP_CONFIG.apiBase || '';
  if (!gasBase) return;
  try {
    const res = await fetch(gasBase + '?sheet=expensemap', { cache:'no-store' });
    const data = await res.json();
    if (data.expenses && Array.isArray(data.expenses)) {
      applyExpenses(data.expenses);
      renderMarkers();
    }
  } catch(e) {
    console.warn('消費資料載入失敗', e);
  }
}

// 地圖初次載入：一次拿齊打卡＋消費＋住宿（GAS 冷啟動只等一次）
async function loadMapData() {
  const gasBase = TRIP_CONFIG.apiBase || '';
  if (!gasBase) return;
  try {
    const res = await fetch(gasBase + '?sheet=mapdata', { cache:'no-store' });
    const data = await res.json();
    if (Array.isArray(data.checkins)) applyCheckins(data.checkins);
    if (Array.isArray(data.expenses)) applyExpenses(data.expenses);
    if (Array.isArray(data.stays)) {
      STAYS = data.stays.map((st, i) => ({ id:'s'+i, ...st }));
      renderStayLine();
    }
    renderMarkers();
  } catch(e) {
    console.warn('地圖資料載入失敗，改逐項載入', e);
    loadCheckins(); loadExpenses(); loadStays();
  }
}

// ══════════════════════════════════════════
//  初始化
// ══════════════════════════════════════════
buildTopbarMembers();
buildTabs();
renderMarkers();
loadMapData();
// 修正容器尺寸計算延遲導致 tile 不載入
setTimeout(() => map.invalidateSize(), 200);
</script>

<script src="../shared/pixelpad.js"></script>
<script>
// ══════════════════════════════════════════
//  畫板掛載（共用 pixelpad.js）
// ══════════════════════════════════════════
let padMounted = false;

function ensurePad() {
  if (!padMounted) {
    PixelPad.mount(document.getElementById('pixelPadMount'), { onDone: onPadDone });
    padMounted = true;
  }
}

function openDrawPanel() {
  document.getElementById('drawModal').classList.add('show');
  ensurePad();
  // 有既有塗鴉（編輯中）就載入，否則開全新空白畫布
  if (pendingCheckin.svgData) {
    PixelPad.loadRects(pendingCheckin.svgData, pendingCheckin.svgGrid || 16);
  } else {
    PixelPad.reset();
  }
}

function onPadDone(res) {
  document.getElementById('drawModal').classList.remove('show');
  pendingCheckin.svgData = res.svgData;
  pendingCheckin.svgGrid = res.grid;
  if (res.svgData) {
    PixelPad.toPNGBlob(blob => { pendingCheckin.pngBlob = blob; });
    document.getElementById('drawThumb').innerHTML =
      `<svg viewBox="0 0 ${res.grid} ${res.grid}" style="image-rendering:pixelated;width:100%;height:100%;">${res.svgData}</svg>`;
  } else {
    pendingCheckin.pngBlob = null;
    document.getElementById('drawThumb').innerHTML = '🖼';
  }
}
</script>
