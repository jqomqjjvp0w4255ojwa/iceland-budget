<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@300;400;500&display=swap">
  <style>
    :root{
      --night:#262d38; --slate:#424c5a; --panel:#3b4756; --sink:#2c3238;
      --edge:#34384a; --brass:#ffc70f; --beacon:#7fd8ff; --moss:#99ff8b;
      --paper:#d1d1d3; --white:#ffffff;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; background:var(--night); color:var(--white);
      font-family:'Noto Sans TC',system-ui,sans-serif; font-weight:300;
      width:1240px; height:840px; overflow:hidden; position:relative;
    }
    body::after{
      content:''; position:absolute; inset:0; pointer-events:none; z-index:20;
      background:repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px);
    }
    .hud{
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 32px; border-bottom:2px solid var(--edge); background:var(--sink);
    }
    .back{
      font-family:Silkscreen,monospace; font-size:9px; letter-spacing:.16em;
      color:var(--paper); border:2px solid var(--edge); background:none; padding:7px 12px; cursor:pointer;
    }
    .back:hover{color:var(--brass); border-color:var(--brass);}
    .title{display:flex; align-items:baseline; gap:12px;}
    /* 手札的標題比大本輕一階：不用 900、字級小、不燙金 */
    .title .zh{font-family:'Noto Serif TC',serif; font-weight:700; font-size:17px; letter-spacing:.12em; color:var(--white);}
    .title .en{font-family:Silkscreen,monospace; font-size:8px; letter-spacing:.2em; color:var(--paper); opacity:.5;}
    .tally{font-family:Silkscreen,monospace; font-size:9px; letter-spacing:.14em; color:var(--paper); opacity:.55;}

    .body{padding:24px 32px; display:flex; gap:26px; height:calc(840px - 67px);}

    .atlas{
      position:relative; width:392px; flex-shrink:0;
      border:2px solid var(--edge); background:var(--sink); overflow:hidden;
    }
    .atlas svg{display:block; width:100%; height:100%;}
    .legend{
      position:absolute; left:11px; bottom:9px;
      font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.16em; color:var(--paper); opacity:.4;
    }
    .pin{position:absolute; transform:translate(-50%,-50%); display:grid; place-items:center;}
    .pin .core{width:9px; height:9px; background:var(--moss); box-shadow:0 0 0 2px var(--sink), 0 0 10px rgba(153,255,139,.7);}
    .pin .tag{
      position:absolute; left:16px; white-space:nowrap;
      font-family:'Noto Sans TC',sans-serif; font-size:11px; color:var(--white);
      background:rgba(38,45,56,.9); padding:2px 6px; border:1px solid var(--edge);
    }

    .side{flex:1; display:flex; flex-direction:column; gap:14px; min-width:0;}
    .lede{font-size:13px; color:var(--paper); opacity:.6; line-height:1.9;}

    .note{
      display:flex; gap:16px; align-items:flex-start;
      border-bottom:1px solid var(--edge); padding:14px 4px; cursor:pointer;
      transition:background .14s, padding-left .14s;
    }
    .note:hover{background:rgba(153,255,139,.06); padding-left:10px;}
    .ndate{
      font-family:Silkscreen,monospace; font-size:9px; color:var(--paper); opacity:.5;
      width:52px; flex-shrink:0; padding-top:3px; font-variant-numeric:tabular-nums;
    }
    .nmain{flex:1; min-width:0;}
    .nplace{font-size:16px; font-weight:400; letter-spacing:.02em;}
    .nline{font-size:12.5px; color:var(--paper); opacity:.66; margin-top:4px; line-height:1.7;}
    .nspend{
      font-family:Silkscreen,monospace; font-size:9px; color:var(--moss);
      flex-shrink:0; padding-top:4px; font-variant-numeric:tabular-nums;
    }

    /* 記一筆：低摩擦是這本書的重點，所以按鈕比條目還顯眼 */
    .quick{
      margin-top:auto; display:flex; align-items:center; gap:14px;
      border:2px solid var(--moss); background:rgba(153,255,139,.10);
      color:var(--moss); padding:18px 22px; cursor:pointer; width:100%;
      font-family:'Noto Sans TC',sans-serif; font-size:16px; letter-spacing:.04em;
    }
    .quick:hover{background:rgba(153,255,139,.18);}
    .quick .plus{font-family:Silkscreen,monospace; font-size:17px;}
    .quick small{
      margin-left:auto; font-family:Silkscreen,monospace; font-size:7px;
      letter-spacing:.14em; opacity:.7;
    }
    a{color:var(--beacon);} a:hover{color:var(--white);}
  </style>
</helmet>

<div class="hud">
  <button class="back">← 書桌</button>
  <div class="title">
    <span class="zh">島內手札</span>
    <span class="en">FIELD NOTES</span>
  </div>
  <div class="tally">3 則</div>
</div>

<div class="body">
  <div class="atlas">
    <!-- 台灣：group 直接吃 經度/緯度，translate(-11920 2550) scale(100 -100) 換算 -->
    <svg viewBox="0 0 310 380" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="tdots" width="7" height="7" patternUnits="userSpaceOnUse">
          <circle cx="3.5" cy="3.5" r="1.5" fill="#4d5867"/>
        </pattern>
      </defs>
      <g stroke="#39424f" stroke-width="1" opacity=".8">
        <line x1="0" y1="200" x2="310" y2="200" stroke-dasharray="5 5"/>
      </g>
      <g transform="translate(-11920 2550) scale(100 -100)" fill="url(#tdots)">
        <polygon points="120.1,23.1 120.0,23.6 120.2,24.3 120.8,25.0 121.5,25.3 122.0,25.0 121.9,24.5 121.6,23.8 121.4,23.1 120.9,22.3 120.6,21.9 120.3,22.5"/>
        <polygon points="119.5,23.4 119.7,23.7 119.75,23.5 119.6,23.3"/>
      </g>
      <text x="14" y="196" fill="#39424f" font-family="Silkscreen, monospace" font-size="8" letter-spacing="1">TROPIC OF CANCER</text>
    </svg>

    <div class="pin" style="left:85.3%; top:10.3%;">
      <span class="core"></span><span class="tag">九份</span>
    </div>
    <div class="pin" style="left:87.8%; top:12.6%;">
      <span class="core"></span>
    </div>
    <div class="pin" style="left:34.4%; top:75.9%;">
      <span class="core"></span><span class="tag">旗津</span>
    </div>

    <div class="legend">TAIWAN</div>
  </div>

  <div class="side">
    <p class="lede">不用建立旅程，去哪就寫哪。日期自己填今天。</p>

    <div class="note">
      <span class="ndate">05/18</span>
      <span class="nmain">
        <span class="nplace">九份</span>
        <span class="nline">下雨，但芋圓很好吃</span>
      </span>
      <span class="nspend">NT$420</span>
    </div>

    <div class="note">
      <span class="ndate">03/02</span>
      <span class="nmain">
        <span class="nplace">東北角海岸</span>
        <span class="nline">風大到走不動</span>
      </span>
      <span class="nspend">—</span>
    </div>

    <div class="note">
      <span class="ndate">11/09</span>
      <span class="nmain">
        <span class="nplace">高雄旗津</span>
        <span class="nline">渡輪五分鐘就到</span>
      </span>
      <span class="nspend">NT$180</span>
    </div>

    <button class="quick">
      <span class="plus">＋</span> 記一筆
      <small>去哪 · 一句話</small>
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
