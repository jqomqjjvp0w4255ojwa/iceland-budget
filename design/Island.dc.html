<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@300;400&display=swap">
  <style>
    :root{
      --space:#faf8f2; --ink:#3a4656; --faint:#aab4bf;
      --moss:#d3d6ab; --spark:#e0a33c;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; width:1240px; height:840px; overflow:hidden; position:relative;
      background:var(--space); color:var(--ink);
      font-family:'Noto Sans TC',system-ui,sans-serif; font-weight:300;
    }
    .back{
      position:absolute; left:72px; top:66px;
      font-family:Silkscreen,monospace; font-size:8px; letter-spacing:.24em;
      color:var(--faint); background:none; border:none; cursor:pointer; padding:0;
    }
    .back:hover{color:var(--ink);}
    .mark{position:absolute; left:72px; top:104px;}
    .mark .zh{font-family:'Noto Serif TC',serif; font-weight:900; font-size:23px; letter-spacing:.3em; margin:0;}
    .mark .en{font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.3em; color:var(--faint); margin-top:9px;}
    .lede{
      position:absolute; left:72px; top:190px; width:230px;
      font-size:12.5px; color:var(--faint); line-height:2.1; letter-spacing:.04em;
    }

    /* 台灣：一座點構成的島，浮在畫面右側 */
    .atlas{position:absolute; right:150px; top:96px; width:400px; height:650px;}
    .atlas svg{display:block; width:100%; height:100%;}
    .pt{position:absolute; transform:translate(-50%,-50%);}
    .pt i{display:block; width:7px; height:7px; border-radius:50%; background:var(--ink);}
    .pt .lbl{
      position:absolute; left:13px; top:-6px; white-space:nowrap;
      font-size:11.5px; color:var(--ink); letter-spacing:.04em;
    }

    /* 左側：手記，一行一則 */
    .notes{
      position:absolute; left:72px; top:292px; width:360px;
      display:flex; flex-direction:column;
    }
    .note{
      display:flex; gap:14px; align-items:baseline;
      background:none; border:none; cursor:pointer; padding:13px 0; text-align:left;
      position:relative;
    }
    .note + .note::before{
      content:''; position:absolute; left:0; right:20px; top:0; height:1px;
      background:var(--faint); opacity:.35;
    }
    .note:hover .place{letter-spacing:.14em;}
    .note .d{
      font-family:Silkscreen,monospace; font-size:7.5px; color:var(--faint);
      width:44px; flex-shrink:0; font-variant-numeric:tabular-nums;
    }
    .note .place{font-size:15.5px; letter-spacing:.05em; transition:letter-spacing .3s;}
    .note .line{font-size:11.5px; color:var(--faint); margin-left:auto; text-align:right;}

    /* 記一筆：這本的主要動作，唯一的暖色 */
    .quick{
      position:absolute; left:72px; bottom:70px;
      display:flex; align-items:center; gap:13px;
      background:none; border:none; cursor:pointer; padding:0;
      font-family:'Noto Sans TC',sans-serif; font-size:15px; color:var(--ink); letter-spacing:.08em;
    }
    .quick i{
      width:40px; height:40px; border-radius:50%; flex-shrink:0;
      background:var(--spark); display:grid; place-items:center;
      font-family:Silkscreen,monospace; font-size:14px; font-style:normal; color:#fff;
      transition:transform .2s;
    }
    .quick:hover i{transform:scale(1.1);}
    .quick small{font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.2em; color:var(--faint); margin-left:4px;}
    a{color:var(--ink);}
  </style>
</helmet>

<button class="back">← DESK</button>
<div class="mark">
  <h1 class="zh">島內手札</h1>
  <div class="en">FIELD NOTES</div>
</div>
<p class="lede">不用建立旅程。<br>去哪，就點在哪。</p>

<div class="atlas">
  <svg viewBox="0 0 310 380" preserveAspectRatio="xMidYMid meet">
    <defs>
      <pattern id="tdots" width="7.5" height="7.5" patternUnits="userSpaceOnUse">
        <circle cx="3.7" cy="3.7" r="1.4" fill="#aab4bf"/>
      </pattern>
    </defs>
    <line x1="0" y1="200" x2="310" y2="200" stroke="#e3ddcf" stroke-width="1" stroke-dasharray="4 6"/>
    <g transform="translate(-11920 2550) scale(100 -100)" fill="url(#tdots)">
      <polygon points="120.1,23.1 120.0,23.6 120.2,24.3 120.8,25.0 121.5,25.3 122.0,25.0 121.9,24.5 121.6,23.8 121.4,23.1 120.9,22.3 120.6,21.9 120.3,22.5"/>
      <polygon points="119.5,23.4 119.7,23.7 119.75,23.5 119.6,23.3"/>
    </g>
  </svg>
  <div class="pt" style="left:85.3%; top:10.3%;"><i></i><span class="lbl">九份</span></div>
  <div class="pt" style="left:87.8%; top:12.6%;"><i></i></div>
  <div class="pt" style="left:34.4%; top:75.9%;"><i></i><span class="lbl">旗津</span></div>
</div>

<div class="notes">
  <button class="note">
    <span class="d">05/18</span>
    <span class="place">九份</span>
    <span class="line">下雨，但芋圓很好吃</span>
  </button>
  <button class="note">
    <span class="d">03/02</span>
    <span class="place">東北角海岸</span>
    <span class="line">風大到走不動</span>
  </button>
  <button class="note">
    <span class="d">11/09</span>
    <span class="place">高雄旗津</span>
    <span class="line">渡輪五分鐘就到</span>
  </button>
</div>

<button class="quick"><i>＋</i> 記一筆 <small>去哪 · 一句話</small></button>
</x-dc>
</body>
</html>
