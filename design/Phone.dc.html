<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@300;400;500&display=swap">
  <style>
    :root{
      --night:#262d38; --slate:#424c5a; --panel:#3b4756; --sink:#2c3238;
      --edge:#34384a; --brass:#ffc70f; --beacon:#7fd8ff; --moss:#99ff8b;
      --ember:#df7687; --paper:#d1d1d3; --white:#ffffff;
      --screen:#e8f0d0; --screen-ink:#2a4a1a;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; background:var(--night); color:var(--white);
      font-family:'Noto Sans TC',system-ui,sans-serif; font-weight:300;
      width:390px; height:844px; overflow:hidden; position:relative;
      display:flex; flex-direction:column;
    }
    .top{
      padding:22px 18px 14px; background:var(--sink); border-bottom:2px solid var(--edge);
      display:flex; align-items:center; justify-content:space-between;
    }
    .daymark{display:flex; align-items:baseline; gap:9px;}
    .daymark b{font-family:Silkscreen,monospace; font-size:19px; color:var(--brass); font-variant-numeric:tabular-nums;}
    .daymark span{font-family:Silkscreen,monospace; font-size:9px; color:var(--paper); opacity:.65; font-variant-numeric:tabular-nums;}
    .sig{display:flex; gap:5px; align-items:center;}
    .sig i{display:block; width:6px; height:6px; background:var(--ember);}
    .sig span{font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.12em; color:var(--paper); opacity:.6;}

    .scroll{flex:1; overflow:hidden; padding:16px 18px; display:flex; flex-direction:column; gap:14px;}

    .now{
      border:2px solid var(--beacon); background:rgba(127,216,255,.10); padding:16px;
    }
    .kicker{
      font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.2em;
      color:var(--beacon); margin-bottom:11px;
    }
    .place{font-family:'Noto Serif TC',serif; font-weight:900; font-size:25px; letter-spacing:.04em; line-height:1.3;}
    .sub{font-size:12.5px; color:var(--paper); opacity:.72; margin-top:8px; line-height:1.75;}
    .chips{display:flex; gap:7px; margin-top:13px; flex-wrap:wrap;}
    .chip{
      font-family:Silkscreen,monospace; font-size:8px; letter-spacing:.08em;
      border:2px solid var(--edge); padding:5px 8px; color:var(--paper);
      font-variant-numeric:tabular-nums;
    }
    .chip.hot{border-color:var(--brass); color:var(--brass);}

    .nav{
      display:flex; gap:9px;
    }
    .nav button{
      flex:1; font-family:Silkscreen,monospace; font-size:9px; letter-spacing:.1em;
      border:2px solid var(--edge); background:var(--panel); color:var(--white);
      padding:12px 6px; cursor:pointer;
    }
    .nav button.go{border-color:var(--beacon); color:var(--beacon);}

    .seg{
      font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.2em;
      color:var(--paper); opacity:.5; margin-top:2px;
    }

    .line{display:flex; gap:11px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--edge);}
    .ltime{
      font-family:Silkscreen,monospace; font-size:10px; color:var(--paper); opacity:.6;
      width:38px; flex-shrink:0; padding-top:3px; font-variant-numeric:tabular-nums;
    }
    .lmain{flex:1; min-width:0;}
    .lname{font-size:15px; letter-spacing:.02em;}
    .lnote{font-size:11.5px; color:var(--paper); opacity:.6; margin-top:3px;}
    .stay{
      font-family:Silkscreen,monospace; font-size:8px; color:var(--paper); opacity:.55;
      background:var(--sink); padding:3px 6px; flex-shrink:0; margin-top:2px;
    }
    .drive{
      display:flex; align-items:center; gap:9px; padding:5px 0 5px 49px;
      font-family:Silkscreen,monospace; font-size:9px; color:var(--paper); opacity:.5;
    }
    .drive i{display:block; width:22px; height:2px; background:currentColor;}

    /* 預算：縮小版的資源條 */
    .res{border:2px solid var(--edge); background:var(--panel); padding:12px 14px;}
    .reshead{
      display:flex; justify-content:space-between; align-items:baseline;
      font-family:Silkscreen,monospace; font-size:8px; color:var(--paper); font-variant-numeric:tabular-nums;
    }
    .reshead b{color:var(--white); font-size:10px;}
    .resbar{position:relative; height:12px; background:var(--sink); border:2px solid var(--edge); margin-top:8px; overflow:hidden;}
    .resfill{position:absolute; inset:0 auto 0 0; width:47%;
      background:repeating-linear-gradient(90deg, var(--moss) 0 5px, #7fe06f 5px 10px);}
    .reslimit{position:absolute; top:0; bottom:0; left:80%; width:2px; background:var(--ember); opacity:.75;}

    /* 打卡：旅途中唯一的主要動作，做最大 */
    .stamp{
      margin-top:auto; display:flex; align-items:center; justify-content:center; gap:12px;
      border:3px solid #11151b; background:var(--brass); color:#241d02;
      padding:19px; cursor:pointer; width:100%;
      font-family:'Noto Serif TC',serif; font-weight:900; font-size:19px; letter-spacing:.2em;
      box-shadow:5px 5px 0 rgba(0,0,0,.45);
    }
    .stamp:active{transform:translate(2px,2px); box-shadow:3px 3px 0 rgba(0,0,0,.45);}
    .stamp svg{width:22px; height:22px;}

    .tabs{
      display:flex; border-top:2px solid var(--edge); background:var(--sink);
    }
    .tabs button{
      flex:1; background:none; border:none; cursor:pointer; padding:13px 4px 17px;
      display:flex; flex-direction:column; align-items:center; gap:6px;
      font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.1em;
      color:var(--paper); opacity:.5;
    }
    .tabs button.on{color:var(--brass); opacity:1;}
    .tabs svg{width:19px; height:19px;}
    a{color:var(--beacon);} a:hover{color:var(--white);}
  </style>
</helmet>

<div class="top">
  <div class="daymark"><b>D5</b><span>09/19 六</span></div>
  <div class="sig"><i></i><span>OFFLINE · 已快取</span></div>
</div>

<div class="scroll">

  <div class="now">
    <div class="kicker">▶ 下一站　09:40 集合</div>
    <div class="place">Fjallsárlón<br>冰上漂浮</div>
    <div class="sub">10 點集合，提前半小時換裝。前一天要先買好食物。</div>
    <div class="chips">
      <span class="chip hot">33 MIN 車程</span>
      <span class="chip">停留 1H30</span>
      <span class="chip">已付款</span>
    </div>
    <div class="nav" style="margin-top:14px;">
      <button class="go">➤ 導航</button>
      <button>◎ 位置</button>
      <button>詳情</button>
    </div>
  </div>

  <div class="seg">今天剩下的</div>

  <div class="drive"><i></i> 37 MIN</div>
  <div class="line">
    <span class="ltime">12:40</span>
    <span class="lmain">
      <span class="lname">斯瓦蒂佛斯 玄武岩瀑布</span>
      <span class="lnote">來回約 2.5h，停車費 1110 ISK</span>
    </span>
    <span class="stay">2H30</span>
  </div>

  <div class="drive"><i></i> 44 MIN</div>
  <div class="line">
    <span class="ltime">15:30</span>
    <span class="lmain">
      <span class="lname">鑽石冰沙灘</span>
      <span class="lnote">可順便看對面 Jökulsárlón 冰河湖</span>
    </span>
    <span class="stay">30M</span>
  </div>

  <div class="drive"><i></i> 38 MIN</div>
  <div class="line" style="border-bottom:none;">
    <span class="ltime">17:30</span>
    <span class="lmain">
      <span class="lname">Tjaldsvæðið í Svínafelli</span>
      <span class="lnote">22:00 看看有沒有極光</span>
    </span>
    <span class="stay">住宿</span>
  </div>

  <div class="res">
    <div class="reshead"><span>▶ 預算 / 人</span><b>47,000 / 100,000</b></div>
    <div class="resbar"><div class="resfill"></div><div class="reslimit"></div></div>
  </div>

  <button class="stamp">
    <svg viewBox="0 0 24 24" fill="none" stroke="#241d02" stroke-width="2.4">
      <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/>
      <circle cx="12" cy="10" r="2.6"/>
    </svg>
    打　卡
  </button>
</div>

<div class="tabs">
  <button class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    日程
  </button>
  <button>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
    地圖
  </button>
  <button>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18v12H3z"/><path d="M3 11h18"/><circle cx="17" cy="15" r="1.4"/></svg>
    記帳
  </button>
  <button>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
    手冊
  </button>
</div>
</x-dc>
</body>
</html>
