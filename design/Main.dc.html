<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@300;400;500&display=swap">
  <style>
    :root{
      --night:#262d38; --slate:#424c5a; --panel:#3b4756; --sink:#2c3238;
      --edge:#34384a; --brass:#ffc70f; --beacon:#7fd8ff; --moss:#99ff8b;
      --paper:#e9e4d6; --paper-line:#cfc8b4; --ink:#2b2b26; --ink-soft:#6d675a;
      --margin-red:#c07a7a;
      --grand:#3d4657; --grand-dark:#2b3341;
      --field:#5d5838; --field-dark:#453f28;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; background:var(--night);
      font-family:'Noto Sans TC',system-ui,sans-serif; font-weight:300;
      width:1240px; height:840px; overflow:hidden; position:relative;
    }
    /* 桌面：木紋般的細直紋 + 暈影，讓中央的紙自己亮起來 */
    .desk{
      position:absolute; inset:0;
      background:
        repeating-linear-gradient(92deg, rgba(255,255,255,.014) 0 2px, transparent 2px 9px),
        radial-gradient(ellipse 62% 55% at 50% 46%, #303845 0%, var(--night) 62%, #1c222b 100%);
    }
    .desk::after{
      content:''; position:absolute; inset:0; pointer-events:none;
      background:repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 1px, transparent 1px 3px);
    }

    /* ── 桌上的紙：兩本書的雜記總覽都寫在這 ── */
    .sheet{
      position:absolute; left:352px; top:74px; width:536px; height:694px;
      background:var(--paper); color:var(--ink);
      transform:rotate(-1.1deg);
      box-shadow:0 2px 0 rgba(0,0,0,.25), 14px 20px 44px rgba(0,0,0,.55);
      padding:34px 38px 30px 62px;
      display:flex; flex-direction:column;
      /* 橫線紙 + 左側紅色留白線 */
      background-image:
        repeating-linear-gradient(0deg, transparent 0 27px, var(--paper-line) 27px 28px),
        linear-gradient(90deg, transparent 0 46px, var(--margin-red) 46px 47px, transparent 47px);
      background-position:0 62px, 0 0;
    }
    .sheet-head{display:flex; align-items:baseline; justify-content:space-between; gap:14px;}
    .sheet-head .zh{
      font-family:'Noto Serif TC',serif; font-weight:900; font-size:26px;
      letter-spacing:.16em; margin:0;
    }
    .sheet-head .en{
      font-family:Silkscreen,monospace; font-size:8px; letter-spacing:.24em; color:var(--ink-soft);
    }
    .tally{
      font-family:Silkscreen,monospace; font-size:9px; letter-spacing:.12em;
      color:var(--ink-soft); margin-top:11px; font-variant-numeric:tabular-nums;
      border-bottom:2px solid var(--ink); padding-bottom:13px;
    }
    .seg{
      font-family:Silkscreen,monospace; font-size:8px; letter-spacing:.2em;
      color:var(--ink-soft); margin:20px 0 4px;
    }
    .log{list-style:none; margin:0; padding:0; display:flex; flex-direction:column;}
    .log li{display:flex; gap:12px; align-items:flex-start; padding:9px 0 8px;}
    .flag{width:9px; height:9px; flex-shrink:0; margin-top:7px;}
    .flag.tour{background:var(--brass); box-shadow:0 0 0 1px rgba(0,0,0,.35);}
    .flag.note{background:#7a7a4e; box-shadow:0 0 0 1px rgba(0,0,0,.25);}
    .lmain{flex:1; min-width:0;}
    .lname{font-size:17px; letter-spacing:.02em; display:flex; align-items:center; gap:9px;}
    .lname b{font-weight:500;}
    .tick{
      font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.08em;
      border:1.5px solid var(--ink); padding:2px 5px;
    }
    .lline{font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.6;}
    .ldate{
      font-family:Silkscreen,monospace; font-size:9px; color:var(--ink-soft);
      flex-shrink:0; padding-top:6px; font-variant-numeric:tabular-nums;
    }
    .newline{
      margin-top:auto; display:flex; align-items:center; gap:10px;
      border:none; background:none; cursor:pointer; padding:11px 0 0;
      border-top:2px solid var(--ink); width:100%;
      font-family:'Noto Sans TC',sans-serif; font-size:14px; color:var(--ink-soft);
    }
    .newline:hover{color:var(--ink);}
    .newline .plus{font-family:Silkscreen,monospace; font-size:13px;}
    .newline small{margin-left:auto; font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.14em; opacity:.7;}

    /* ── 書：放在紙的兩側，點了朝螢幕放大 ── */
    .vol{
      position:absolute; cursor:pointer; border:2px solid #11151b;
      box-shadow:9px 13px 0 rgba(0,0,0,.42);
      transition:transform .2s cubic-bezier(.2,.9,.3,1.1), box-shadow .2s ease;
    }
    .vol::before{
      content:''; position:absolute; inset:0; pointer-events:none;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 1px, transparent 1px 4px);
    }
    .spine{position:absolute; inset:0 auto 0 0;}
    .band{position:absolute; left:0; right:0; height:2px; background:rgba(0,0,0,.30);}
    .corner{position:absolute; width:19px; height:19px; border:3px solid var(--brass); opacity:.5;}
    .corner.tr{top:6px; right:6px; border-left:none; border-bottom:none;}
    .corner.br{bottom:6px; right:6px; border-left:none; border-top:none;}
    .cover{position:absolute; inset:0; display:flex; flex-direction:column;}
    .ctitle{
      font-family:'Noto Serif TC',serif; font-weight:900; color:var(--brass);
      letter-spacing:.16em; line-height:1.34; text-shadow:0 2px 0 rgba(0,0,0,.45);
    }
    .crule{height:2px; background:var(--brass); opacity:.5; margin-top:14px; width:40px;}
    .csub{font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.2em; color:rgba(255,255,255,.5); margin-top:11px;}
    .cfoot{margin-top:auto;}
    .badge{
      display:inline-flex; font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.1em;
      padding:5px 8px; border:2px solid var(--beacon); color:var(--beacon); background:rgba(127,216,255,.12);
    }
    .badge.quiet{border-color:rgba(255,255,255,.32); color:rgba(255,255,255,.62); background:none;}

    #tour{
      left:74px; top:236px; width:252px; height:336px; background:var(--grand);
      transform:rotate(-5deg);
    }
    #tour .spine{width:21px; background:var(--grand-dark); border-right:2px solid #11151b;}
    #tour .cover{padding:30px 22px 20px 42px;}
    #tour .ctitle{font-size:26px;}
    #tour:hover{transform:rotate(-2deg) scale(1.07) translateY(-10px); box-shadow:16px 26px 44px rgba(0,0,0,.6);}

    #notes{
      right:62px; top:352px; width:196px; height:262px; background:var(--field);
      transform:rotate(6deg);
    }
    #notes .spine{width:13px; background:var(--field-dark); border-right:2px solid #11151b;}
    #notes .cover{padding:24px 18px 16px 28px;}
    #notes .ctitle{font-size:19px;}
    #notes .strap{position:absolute; top:0; bottom:0; right:24px; width:9px; background:#22262e; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);}
    #notes:hover{transform:rotate(3deg) scale(1.07) translateY(-10px); box-shadow:16px 26px 44px rgba(0,0,0,.6);}

    .caption{
      position:absolute; font-family:Silkscreen,monospace; font-size:8px;
      letter-spacing:.16em; color:rgba(255,255,255,.42); white-space:nowrap;
    }
    #capTour{left:78px; top:596px;}
    #capNotes{right:66px; top:634px; text-align:right;}
    a{color:var(--beacon);} a:hover{color:#ffffff;}
  </style>
</helmet>

<div class="desk">

  <div class="vol" id="tour">
    <div class="spine"></div>
    <div class="band" style="top:60px;"></div>
    <div class="band" style="bottom:60px;"></div>
    <div class="corner tr"></div>
    <div class="corner br"></div>
    <div class="cover">
      <div class="ctitle">出國<br>旅行</div>
      <div class="crule"></div>
      <div class="csub">GRAND TOURS</div>
      <div class="cfoot"><span class="badge">▶ 冰島 2026</span></div>
    </div>
  </div>
  <div class="caption" id="capTour">1 趟 · 15 天 · 點開＝世界地圖</div>

  <div class="vol" id="notes">
    <div class="spine"></div>
    <div class="strap"></div>
    <div class="cover">
      <div class="ctitle">島內<br>手札</div>
      <div class="crule"></div>
      <div class="csub">FIELD NOTES</div>
      <div class="cfoot"><span class="badge quiet">3 則</span></div>
    </div>
  </div>
  <div class="caption" id="capNotes">點開＝台灣地圖</div>

  <div class="sheet">
    <div class="sheet-head">
      <h1 class="zh">旅程書</h1>
      <span class="en">TRAVEL LEDGER</span>
    </div>
    <div class="tally">2 冊　·　18 個地點　·　3 位旅伴　·　NT$141,000</div>

    <div class="seg">最近</div>
    <ul class="log">
      <li>
        <span class="flag tour"></span>
        <span class="lmain">
          <span class="lname"><b>冰島 2026</b><span class="tick">規劃中 D-15</span></span>
          <span class="lline">15 天 · 猴 花 寧 · 環島＋西峽灣＋斯奈山</span>
        </span>
        <span class="ldate">09/14</span>
      </li>
      <li>
        <span class="flag note"></span>
        <span class="lmain">
          <span class="lname">九份</span>
          <span class="lline">下雨，但芋圓很好吃</span>
        </span>
        <span class="ldate">05/18</span>
      </li>
      <li>
        <span class="flag note"></span>
        <span class="lmain">
          <span class="lname">東北角海岸</span>
          <span class="lline">風大到走不動</span>
        </span>
        <span class="ldate">03/02</span>
      </li>
      <li>
        <span class="flag note"></span>
        <span class="lmain">
          <span class="lname">高雄旗津</span>
          <span class="lline">渡輪五分鐘就到</span>
        </span>
        <span class="ldate">11/09</span>
      </li>
    </ul>

    <button class="newline">
      <span class="plus">＋</span> 新增
      <small>旅程 / 手記</small>
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
