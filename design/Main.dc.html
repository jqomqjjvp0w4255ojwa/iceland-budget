<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@300;400&display=swap">
  <style>
    *{box-sizing:border-box;}
    body{margin:0; width:1240px; height:840px; overflow:hidden;}
    .root{
      position:absolute; inset:0; overflow:hidden;
      background:var(--space); color:var(--ink);
      font-family:'Noto Sans TC',system-ui,sans-serif; font-weight:300;
    }

    .mark{position:absolute; left:72px; top:64px;}
    .mark .zh{font-family:'Noto Serif TC',serif; font-weight:900; font-size:23px; letter-spacing:.34em; margin:0;}
    .mark .en{font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.34em; color:var(--faint); margin-top:10px;}

    .tally{
      position:absolute; left:72px; bottom:64px;
      font-family:Silkscreen,monospace; font-size:8px; letter-spacing:.22em;
      color:var(--faint); font-variant-numeric:tabular-nums; line-height:2.6;
    }

    .journey{position:absolute; inset:0; pointer-events:none;}
    .journey .solid{fill:none; stroke:var(--ink); stroke-width:1.6; stroke-linecap:round;}
    .journey .dash{fill:none; stroke:var(--ink); stroke-width:1.6; stroke-linecap:round; stroke-dasharray:1 9;}
    .journey .side{fill:none; stroke:var(--faint); stroke-width:1.2; stroke-linecap:round;}

    .pt{position:absolute; transform:translate(-50%,-50%); pointer-events:none;}
    .pt i{display:block; width:7px; height:7px; border-radius:50%; background:var(--ink);}
    .pt.hollow i{background:var(--space); border:1.5px solid var(--ink);}
    .pt.next i{width:11px; height:11px; background:var(--spark);}
    .pt.next::after{
      content:''; position:absolute; inset:-9px; border:1.5px solid var(--spark);
      border-radius:50%; animation:breathe 3.2s ease-in-out infinite;
    }
    @keyframes breathe{
      0%,100%{transform:scale(.72); opacity:.75;}
      50%{transform:scale(1.15); opacity:.15;}
    }
    @media (prefers-reduced-motion: reduce){ .pt.next::after{animation:none; opacity:.4;} }
    .pt .lbl{
      position:absolute; left:14px; top:-5px; white-space:nowrap;
      font-family:Silkscreen,monospace; font-size:8px; letter-spacing:.16em; color:var(--ink);
      background:var(--space); padding:2px 6px;
    }
    .pt .sub{
      position:absolute; left:14px; top:11px; white-space:nowrap;
      font-size:11px; color:var(--faint); letter-spacing:.04em;
      background:var(--space); padding:1px 6px;
    }

    .plane{
      position:absolute; border:none; cursor:pointer; padding:0;
      display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-start;
      text-align:left; gap:6px;
      transition:transform .3s cubic-bezier(.2,.85,.3,1.05);
    }
    .plane .glyph{display:block; background:var(--space); padding:9px 12px; box-shadow:2px 3px 0 rgba(0,0,0,.08);}
    .plane .g-ink{fill:none; stroke:var(--ink); stroke-linecap:round;}
    .plane .g-dot{fill:var(--ink);}
    .plane .g-hollow{fill:var(--space); stroke:var(--ink); stroke-width:1.5;}
    .plane .g-spark{fill:var(--spark);}
    .plane .n{
      font-family:Silkscreen,monospace; font-size:7.5px; letter-spacing:.2em;
      color:var(--ink); opacity:.8; font-variant-numeric:tabular-nums;
      background:var(--space); padding:3px 8px;
    }

    #tour{
      left:668px; top:186px; width:300px; height:212px;
      background-image:radial-gradient(circle, var(--dotA) 1.5px, transparent 1.7px);
      background-size:7px 7px;
      padding:26px 30px;
      transform:rotate(-2deg);
    }
    #tour:hover{transform:rotate(-1deg) translateY(-8px);}
    #tour::before{
      content:''; position:absolute; left:-7px; top:10px; bottom:-8px; width:1.5px; background:var(--ink); opacity:.6; transform:rotate(.9deg);
    }
    #tour::after{
      content:''; position:absolute; right:12px; top:-9px; width:56%; height:1.5px; background:var(--ink); opacity:.6; transform:rotate(-.7deg);
    }

    #notes{
      left:836px; top:492px; width:212px; height:150px;
      background-image:radial-gradient(circle, var(--dotB) 1.3px, transparent 1.5px);
      background-size:8px 8px;
      padding:20px 24px;
      transform:rotate(1.6deg);
    }
    #notes:hover{transform:rotate(.6deg) translateY(-8px);}
    #notes::before{
      content:''; position:absolute; right:-7px; top:-8px; bottom:12px; width:1.5px; background:var(--ink); opacity:.6; transform:rotate(-1deg);
    }

    .recent{
      position:absolute; right:76px; bottom:64px; text-align:right;
      display:flex; flex-direction:column; gap:9px;
    }
    .recent .row{display:flex; gap:14px; justify-content:flex-end; align-items:baseline;}
    .recent .place{font-size:13.5px; letter-spacing:.06em;}
    .recent .d{font-family:Silkscreen,monospace; font-size:7.5px; color:var(--faint); font-variant-numeric:tabular-nums;}

    .add{
      position:absolute; left:72px; top:410px;
      width:44px; height:44px; border-radius:50%;
      border:1.5px solid var(--ink); background:none; cursor:pointer;
      display:grid; place-items:center;
      font-family:Silkscreen,monospace; font-size:15px; color:var(--ink);
      transition:background .2s, transform .2s;
    }
    .add:hover{background:var(--ink); color:var(--space); transform:scale(1.08);}
    .add-lbl{
      position:absolute; left:130px; top:424px;
      font-family:Silkscreen,monospace; font-size:7.5px; letter-spacing:.22em; color:var(--faint);
    }
    a{color:var(--ink);}
  </style>
</helmet>

<div class="root" style="--space:{{t.space}}; --ink:{{t.ink}}; --faint:{{t.faint}}; --dotA:{{t.dotA}}; --dotB:{{t.dotB}}; --spark:{{t.spark}};">

  <div class="mark">
    <h1 class="zh">旅程書</h1>
    <div class="en">TRAVEL LEDGER</div>
  </div>

  <svg class="journey" width="1240" height="840" viewBox="0 0 1240 840">
    <path class="solid" d="M 210 636 C 252 608, 288 576, 330 562 C 356 554, 372 588, 400 596
             C 428 604, 448 578, 470 556 C 502 524, 518 476, 556 448
             C 588 424, 626 412, 662 400 C 676 396, 688 392, 700 388"/>
    <path class="dash" d="M 700 388 C 726 378, 748 372, 764 352 C 782 330, 792 302, 800 288
             C 806 278, 809 273, 812 268"/>
    <path class="side" d="M 210 636 C 232 668, 252 692, 288 702 C 326 712, 366 708, 396 700
             C 408 697, 419 693, 428 690"/>
  </svg>

  <span class="pt hollow" style="left:210px; top:636px;">
    <i></i><span class="lbl" style="left:-8px; top:16px;">HOME</span>
  </span>
  <span class="pt" style="left:470px; top:556px;">
    <i></i><span class="sub" style="top:-22px;">九份</span>
  </span>
  <span class="pt" style="left:428px; top:690px;">
    <i></i><span class="sub">旗津</span>
  </span>
  <span class="pt next" style="left:812px; top:268px;">
    <i></i>
    <span class="lbl" style="left:20px; top:-14px;">ICELAND</span>
    <span class="sub" style="left:20px; top:2px;">D-15 · 三人</span>
  </span>

  <button class="plane" id="tour" aria-label="出國旅行">
    <svg class="glyph" width="200" height="96" viewBox="0 0 200 96" aria-hidden="true">
      <path class="g-ink" style="stroke-width:1.7" d="M 6 74 Q 54 71.6, 100 73 T 194 71.8"/>
      <path class="g-ink" style="stroke-width:1.5; stroke-dasharray:1 8" d="M 30 72 C 52 34, 96 14, 132 20 C 154 24, 168 40, 175 56"/>
      <circle class="g-hollow" cx="30" cy="72" r="4"/>
      <circle class="g-spark" cx="176" cy="60" r="4.6"/>
      <path class="g-ink" style="stroke-width:1.1; opacity:.55" d="M 96 80 Q 100 84, 104 80"/>
    </svg>
    <span class="n">1 · 15 DAYS</span>
  </button>

  <button class="plane" id="notes" aria-label="島內手札">
    <svg class="glyph" width="130" height="82" viewBox="0 0 130 82" aria-hidden="true">
      <path class="g-ink" style="stroke-width:1.6" d="M 44 14 C 70 6, 98 16, 106 34 C 113 51, 100 66, 78 70
               C 56 74, 32 68, 26 50 C 21 35, 28 20, 44 14 Z"/>
      <circle class="g-dot" cx="58" cy="38" r="3.4"/>
      <circle class="g-dot" cx="82" cy="50" r="3.4"/>
      <path class="g-ink" style="stroke-width:1.1; opacity:.6" d="M 58 38 Q 70 40, 82 50"/>
      <path class="g-ink" style="stroke-width:1.1; opacity:.45" d="M 10 74 Q 16 70, 22 74"/>
    </svg>
    <span class="n">3 NOTES</span>
  </button>

  <button class="add" aria-label="新增">＋</button>
  <span class="add-lbl">NEW</span>

  <div class="tally">
    2 VOLUMES<br>18 PLACES<br>NT$141,000
  </div>

  <div class="recent">
    <div class="row"><span class="place">九份 — 下雨，但芋圓很好吃</span><span class="d">05/18</span></div>
    <div class="row"><span class="place">東北角 — 風大到走不動</span><span class="d">03/02</span></div>
    <div class="row"><span class="place">旗津 — 渡輪五分鐘就到</span><span class="d">11/09</span></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","default":"A 大地","options":["A 大地","B 墨青","C 苔原","D 藍晒","E 燒陶","F 石墨","G 梅子抹茶","H 鮭魚湖水","I 藕紫芥末"],"section":"佈景主題"},"$preview":{"width":1240,"height":840}}'>
class Component extends DCLogic {
  renderVals() {
    const THEMES = {
      'A 大地':     { space:'#f7f1e6', ink:'#5b4a38', faint:'#b9ab94', dotA:'#cf9d7d', dotB:'#b3ad7e', spark:'#c97b3d' },
      'B 墨青':     { space:'#f4f3ee', ink:'#3f4b55', faint:'#a8b0b5', dotA:'#9fb3c0', dotB:'#b9bfa3', spark:'#c05a41' },
      'C 苔原':     { space:'#f3f0e2', ink:'#494a35', faint:'#adab8d', dotA:'#a9ad72', dotB:'#cbb289', spark:'#bf6b35' },
      'D 藍晒':     { space:'#f2f3f0', ink:'#2f4858', faint:'#9fb0b8', dotA:'#8fb0c4', dotB:'#b7c2ad', spark:'#d08c2e' },
      'E 燒陶':     { space:'#f9f1e5', ink:'#67402b', faint:'#c4a68d', dotA:'#d68f6a', dotB:'#d9c194', spark:'#a83b2c' },
      'F 石墨':     { space:'#f0eeea', ink:'#4c4a47', faint:'#b1aca3', dotA:'#b5aa9b', dotB:'#a8aaa2', spark:'#d29e3a' },
      'G 梅子抹茶': { space:'#f6f2ea', ink:'#4e4553', faint:'#b3a8ac', dotA:'#d8a0b0', dotB:'#a9bd8f', spark:'#c9a53c' },
      'H 鮭魚湖水': { space:'#f7f3ec', ink:'#46524e', faint:'#a3b0aa', dotA:'#e2a68f', dotB:'#93bfb2', spark:'#9a6b8f' },
      'I 藕紫芥末': { space:'#f4f1ea', ink:'#52493f', faint:'#b0a795', dotA:'#b9a3c4', dotB:'#cdb168', spark:'#bf5f4a' },
    };
    return { t: THEMES[this.props.theme] ?? THEMES['A 大地'] };
  }
}
</script>
</body>
</html>
