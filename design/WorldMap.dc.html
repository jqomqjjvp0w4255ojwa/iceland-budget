<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@300;400&display=swap">
  <style>
    :root{
      --space:#f7f1e6; --ink:#5b4a38; --faint:#b9ab94;
      --sea:#d9b9a0; --spark:#c97b3d;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; width:1240px; height:840px; overflow:hidden; position:relative;
      background:var(--space); color:var(--ink);
      font-family:'Noto Sans TC',system-ui,sans-serif; font-weight:300;
    }
    .back{
      position:absolute; left:72px; top:66px;
      font-family:Silkscreen,monospace; font-size:8px; letter-spacing:.24em;
      color:var(--faint); background:none; border:none; cursor:pointer; padding:0;
    }
    .back:hover{color:var(--ink);}
    .mark{position:absolute; left:72px; top:104px;}
    .mark .zh{font-family:'Noto Serif TC',serif; font-weight:900; font-size:23px; letter-spacing:.3em; margin:0;}
    .mark .en{font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.3em; color:var(--faint); margin-top:9px;}

    /* 地圖不裝框：陸地就是點的場，浮在空間裡 */
    .atlas{position:absolute; left:120px; right:90px; top:190px; height:470px;}
    .atlas svg{display:block; width:100%; height:100%;}

    .pt{position:absolute; transform:translate(-50%,-50%);}
    .pt i{display:block; width:11px; height:11px; border-radius:50%; background:var(--spark);}
    .pt::after{
      content:''; position:absolute; inset:-9px; border:1.5px solid var(--spark);
      border-radius:50%; animation:breathe 3.2s ease-in-out infinite;
    }
    @keyframes breathe{0%,100%{transform:scale(.72); opacity:.75;} 50%{transform:scale(1.15); opacity:.15;}}
    @media (prefers-reduced-motion: reduce){ .pt::after{animation:none; opacity:.4;} }
    .pt .lbl{
      position:absolute; left:18px; top:-6px; white-space:nowrap;
      font-family:Silkscreen,monospace; font-size:8px; letter-spacing:.16em; color:var(--ink);
    }
    .pt.home{transform:translate(-50%,-50%);}
    .pt.home i{width:7px; height:7px; background:var(--space); border:1.5px solid var(--ink);}
    .pt.home::after{display:none;}
    .pt.home .lbl{color:var(--faint); left:12px;}

    /* 底部：唯一一趟旅程，一行字 */
    .entry{
      position:absolute; left:120px; right:90px; bottom:72px;
      display:flex; align-items:baseline; gap:18px;
      background:none; border:none; cursor:pointer; padding:0 0 12px; text-align:left;

    }
    .entry:hover .name{letter-spacing:.3em;}
    .entry .name{
      font-family:'Noto Serif TC',serif; font-weight:600; font-size:22px;
      letter-spacing:.24em; color:var(--ink); transition:letter-spacing .3s;
    }
    .entry .meta{
      font-family:Silkscreen,monospace; font-size:8px; letter-spacing:.14em;
      color:var(--faint); font-variant-numeric:tabular-nums;
    }
    .entry .go{margin-left:auto; font-family:Silkscreen,monospace; font-size:12px; color:var(--spark);}

    .new{
      position:absolute; left:120px; bottom:30px;
      font-family:Silkscreen,monospace; font-size:7.5px; letter-spacing:.22em;
      color:var(--faint); background:none; border:none; cursor:pointer; padding:0;
    }
    .new:hover{color:var(--ink);}
    a{color:var(--ink);}
  </style>
</helmet>

<button class="back">← DESK</button>
<div class="mark">
  <h1 class="zh">出國旅行</h1>
  <div class="en">GRAND TOURS</div>
</div>

      <polygon points="-58,60 -45,60 -30,70 -20,76 -30,83 -50,82 -58,76 -60,68"/>

      <polygon points="-10,51 -6,55 -3,58 0,54 -1,51 -5,50"/>
      <polygon points="-17,15 -16,22 -10,32 0,36 10,37 20,32 32,31 35,25 43,12 51,12 42,-2 40,-15 35,-22 32,-28 25,-34 18,-34 12,-18 9,-2 5,5 -5,5 -12,10"/>
      <polygon points="43,-12 50,-15 48,-25 44,-22"/>
      <polygon points="113,-22 114,-33 118,-35 129,-32 138,-35 147,-38 153,-28 145,-15 135,-12 130,-11 122,-17"/>
      <polygon points="166,-46 174,-41 178,-37 173,-34 168,-44"/>
      <polygon points="130,32 135,34 141,40 145,44 142,45 136,36 131,31"/>
      <polygon points="-24,65 -14,66 -13,64 -22,63"/>
    </g>
    <!-- 家 → 冰島：一條虛線劃過半個地球 -->
    <path d="M 301 60 C 250 10, 200 4, 161 19" fill="none" stroke="#c97b3d"
          stroke-width="1" stroke-dasharray="1 6" stroke-linecap="round"/>
  </svg>

  <div class="pt" style="left:44.7%; top:13.4%;">
    <i></i><span class="lbl">ICELAND 2026</span>
  </div>
  <div class="pt home" style="left:83.6%; top:42.5%;">
    <i></i><span class="lbl">HOME</span>
  </div>
</div>

<button class="entry">
  <svg style="position:absolute; left:0; right:0; bottom:0; width:100%; height:6px;"
       viewBox="0 0 1030 6" preserveAspectRatio="none" aria-hidden="true">
    <path d="M 2 3.6 Q 258 1.8, 515 3.2 T 1028 2.6" fill="none" stroke="#5b4a38" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <span class="name">冰島 2026</span>
  <span class="meta">09/14 – 09/30 · 15 DAYS · 猴 花 寧 · D-15</span>
  <span class="go">▶</span>
</button>

<button class="new">＋ NEW TOUR</button>
</x-dc>
</body>
</html>
