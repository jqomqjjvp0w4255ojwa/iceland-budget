<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@300;400&display=swap">
  <style>
    :root{
      --space:#f4f3ee;        /* 純淨的底 */
      --ink:#3f4b55;          /* 線 */
      --faint:#a8b0b5;        /* 更淡的線 */
      --sea:#d9b9a0;          /* 面：出國 */
      --moss:#cdc5a2;         /* 面：手札 */
      --spark:#c05a41;        /* 唯一的暖點：下一趟 */
    }
    *{box-sizing:border-box;}
    body{
      margin:0; width:1240px; height:840px; overflow:hidden; position:relative;
      background:var(--space); color:var(--ink);
      font-family:'Noto Sans TC',system-ui,sans-serif; font-weight:300;
    }

    /* ── 字 ── */
    .mark{position:absolute; left:72px; top:64px;}
    .mark .zh{font-family:'Noto Serif TC',serif; font-weight:900; font-size:23px; letter-spacing:.34em; margin:0;}
    .mark .en{font-family:Silkscreen,monospace; font-size:7px; letter-spacing:.34em; color:var(--faint); margin-top:10px;}

    .tally{
      position:absolute; left:72px; bottom:64px;
      font-family:Silkscreen,monospace; font-size:8px; letter-spacing:.22em;
      color:var(--faint); font-variant-numeric:tabular-nums; line-height:2.6;
    }

    /* ── 線：一條穿過整個空間的旅程線 ── */
    .journey{position:absolute; inset:0; pointer-events:none;}

    /* ── 點 ── */
    .pt{position:absolute; transform:translate(-50%,-50%); pointer-events:none;}
    .pt i{display:block; width:7px; height:7px; border-radius:50%; background:var(--ink);}
    .pt.hollow i{background:var(--space); border:1.5px solid var(--ink);}
    .pt.next i{width:11px; height:11px; background:var(--spark);}
    .pt.next::after{
      content:''; position:absolute; inset:-9px; border:1.5px solid var(--spark);
      border-radius:50%; animation:breathe 3.2s ease-in-out infinite;
    }
    @keyframes breathe{
      0%,100%{transform:scale(.72); opacity:.75;}
      50%{transform:scale(1.15); opacity:.15;}
    }
    @media (prefers-reduced-motion: reduce){ .pt.next::after{animation:none; opacity:.4;} }
    .pt .lbl{
      position:absolute; left:14px; top:-5px; white-space:nowrap;
      font-family:Silkscreen,monospace; font-size:8px; letter-spacing:.16em; color:var(--ink);
    }
    .pt .sub{
      position:absolute; left:14px; top:9px; white-space:nowrap;
      font-size:11px; color:var(--faint); letter-spacing:.04em;
    }

    /* ── 面：兩本書化成的兩個面 ── */
    .plane{
      position:absolute; border:none; cursor:pointer; padding:0;
      display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-start;
      text-align:left; gap:6px;
      transition:transform .3s cubic-bezier(.2,.85,.3,1.05);
    }
    .plane .glyph{display:block;}
    .plane .n{
      font-family:Silkscreen,monospace; font-size:7.5px; letter-spacing:.2em;
      color:var(--ink); opacity:.55; font-variant-numeric:tabular-nums;
    }

    #tour{
      left:668px; top:186px; width:300px; height:212px;
      background-image:radial-gradient(circle, #9fb3c0 1.5px, transparent 1.7px);
      background-size:7px 7px;
      padding:26px 30px;
      transform:rotate(-2deg);
    }
    #tour:hover{transform:rotate(-1deg) translateY(-8px);}
    /* 面的邊不畫框，只在兩側各補一條「沒對齊的線」 */
    #tour::before{
      content:''; position:absolute; left:-7px; top:10px; bottom:-8px; width:1.5px; background:var(--ink); opacity:.6; transform:rotate(.9deg);
    }
    #tour::after{
      content:''; position:absolute; right:12px; top:-9px; width:56%; height:1.5px; background:var(--ink); opacity:.6; transform:rotate(-.7deg);
    }

    #notes{
      left:836px; top:492px; width:212px; height:150px;
      background-image:radial-gradient(circle, #b9bfa3 1.3px, transparent 1.5px);
      background-size:8px 8px;
      padding:20px 24px;
      transform:rotate(1.6deg);
    }
    #notes:hover{transform:rotate(.6deg) translateY(-8px);}
    #notes .name{font-size:17px;}
    #notes::before{
      content:''; position:absolute; right:-7px; top:-8px; bottom:12px; width:1.5px; background:var(--ink); opacity:.6; transform:rotate(-1deg);
    }

    /* ── 最近：右下三行極輕的字 ── */
    .recent{
      position:absolute; right:76px; bottom:64px; text-align:right;
      display:flex; flex-direction:column; gap:9px;
    }
    .recent .row{display:flex; gap:14px; justify-content:flex-end; align-items:baseline;}
    .recent .place{font-size:13.5px; letter-spacing:.06em;}
    .recent .d{font-family:Silkscreen,monospace; font-size:7.5px; color:var(--faint); font-variant-numeric:tabular-nums;}

    /* ── 新增：一個點 ── */
    .add{
      position:absolute; left:72px; top:410px;
      width:44px; height:44px; border-radius:50%;
      border:1.5px solid var(--ink); background:none; cursor:pointer;
      display:grid; place-items:center;
      font-family:Silkscreen,monospace; font-size:15px; color:var(--ink);
      transition:background .2s, transform .2s;
    }
    .add:hover{background:var(--ink); color:var(--space); transform:scale(1.08);}
    .add-lbl{
      position:absolute; left:130px; top:424px;
      font-family:Silkscreen,monospace; font-size:7.5px; letter-spacing:.22em; color:var(--faint);
    }
    a{color:var(--ink);}
  </style>
</helmet>

<div class="mark">
  <h1 class="zh">旅程書</h1>

</div>
