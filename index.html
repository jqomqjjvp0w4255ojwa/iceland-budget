<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111f" />
  <meta name="description" content="冰島旅遊預算清單" />
  <title>🇮🇸 冰島預算清單</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&family=Silkscreen&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#07111f; --bg2:#0d1f35; --bg3:#112540; --card:#0f2240;
      --border:#1e3a5f; --accent:#4fc3f7; --accent2:#81d4fa;
      --gold:#f0c040; --green:#4caf6e; --red:#e05555;
      --text:#e8f4fd; --muted:#7eb3d4;
      --aurora1:#00e5cc; --aurora2:#7c4dff; --aurora3:#ff6e40;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;overflow-x:hidden;}
    body::before{
      content:'';position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;
      background:
        radial-gradient(ellipse 80% 40% at 20% 10%,rgba(0,229,204,.07) 0%,transparent 60%),
        radial-gradient(ellipse 60% 30% at 80% 5%,rgba(124,77,255,.06) 0%,transparent 55%),
        radial-gradient(ellipse 50% 20% at 50% 0%,rgba(79,195,247,.05) 0%,transparent 50%);
    }
    .container{max-width:680px;margin:0 auto;padding:0 16px 80px;position:relative;z-index:1;}
    
    /* ── Header */
    header{text-align:center;padding:32px 16px 16px;}
    .aurora-line{height:2px;margin-bottom:18px;background:linear-gradient(90deg,transparent,var(--aurora1),var(--accent),var(--aurora2),transparent);animation:shimmer 3s ease-in-out infinite;}
    @keyframes shimmer{0%,100%{opacity:.6}50%{opacity:1}}
    header h1{font-family:'Cinzel',serif;font-size:1.55rem;font-weight:600;letter-spacing:.12em;color:var(--accent2);text-shadow:0 0 30px rgba(79,195,247,.4);}
    header .subtitle{font-size:.75rem;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:5px;}

    /* ── Sync bar */
    .sync-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;}
    .sync-status{font-size:.72rem;color:var(--muted);opacity:.8;}
    .sync-btn{
      display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;
      border:1px solid var(--border);background:var(--bg3);cursor:pointer;font-family:'Lato',sans-serif;
      font-size:.7rem;color:var(--muted);transition:all .2s;
    }
    .sync-btn:hover{border-color:var(--accent);color:var(--accent);}
    .sync-btn .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background .3s;}
    .dot-local{background:#f0c040;}
    .dot-cloud{background:var(--green);}
    .dot-syncing{background:var(--accent);animation:pulse .8s ease-in-out infinite;}
    .dot-offline{background:var(--aurora3);}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .sync-icon{font-size:.9rem;line-height:1;}
    .spin-icon{display:inline-block;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Summary */
    .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;}
    .summary-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;position:relative;overflow:hidden;}
    .summary-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--aurora2),var(--accent));}
    .summary-card.full{grid-column:1/-1;}
    .summary-card.full::before{background:linear-gradient(90deg,var(--aurora1),var(--gold));}
    .summary-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.15em;margin-bottom:6px;}
    .summary-value{font-family:'Cinzel',serif;font-size:1.35rem;color:var(--gold);font-weight:600;}
    .summary-card.full .summary-value{font-size:1.75rem;color:var(--accent2);}
    .summary-sub{font-size:.7rem;color:var(--muted);margin-top:4px;}

    /* ── Rate */
    .rate-bar{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 16px;display:flex;justify-content:center;gap:24px;margin-bottom:18px;font-size:.73rem;color:var(--muted);}
    .rate-bar span{display:flex;align-items:center;gap:5px;}
    .rate-bar strong{color:var(--accent);}

    /* ── Tabs */
    .tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{flex-shrink:0;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:.8rem;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;font-family:'Lato',sans-serif;}
    .tab.active{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700;}
    .tab:hover:not(.active){border-color:var(--accent);color:var(--accent);}
    .section{display:none;animation:fadeIn .3s ease;}
    .section.active{display:block;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    /* ── Card — border colour encodes paid status */
    .card{
      background:var(--card);border:1.5px solid var(--border);border-radius:14px;
      margin-bottom:11px;overflow:hidden;transition:border-color .2s,box-shadow .2s;
    }
    .card.paid-card{border-color:rgba(76,175,110,.45);}
    .card.paid-card:hover{border-color:var(--green);box-shadow:0 0 0 1px rgba(76,175,110,.2);}
    .card.unpaid-card{border-color:rgba(224,85,85,.4);}
    .card.unpaid-card:hover{border-color:var(--red);box-shadow:0 0 0 1px rgba(224,85,85,.2);}
    .card:not(.paid-card):not(.unpaid-card):hover{border-color:var(--accent);}

    /* ── Card header: date big / name small below */
    .card-header{padding:13px 16px 9px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
    .card-left{}
    .card-date{font-family:'Cinzel',serif;font-size:1rem;font-weight:600;color:var(--accent2);line-height:1.2;letter-spacing:.04em;}
    .card-nights{font-size:.68rem;color:var(--muted);margin-left:6px;}
    .card-name-row{display:flex;align-items:center;gap:6px;margin-top:4px;}
    .place-type-icon{font-size:.9rem;flex-shrink:0;}
    .card-name{font-size:.8rem;color:var(--muted);line-height:1.35;}

    /* ── Price block — per-person first */
    .card-price{text-align:right;flex-shrink:0;}
    .price-per{font-family:'Cinzel',serif;font-size:1.1rem;color:var(--gold);font-weight:600;white-space:nowrap;line-height:1.2;}
    .price-per-label{font-size:.62rem;color:var(--muted);margin-bottom:1px;}
    .price-total{font-size:.75rem;color:var(--muted);margin-top:3px;white-space:nowrap;}
    .price-orig{font-size:.68rem;color:rgba(126,179,212,.6);margin-top:1px;}

    /* ── Tags row */
    .card-body{padding:0 16px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
    .tag{font-size:.66rem;padding:3px 9px;border-radius:9px;font-weight:700;letter-spacing:.04em;white-space:nowrap;}
    .tag-paid{background:rgba(76,175,110,.15);color:var(--green);border:1px solid rgba(76,175,110,.35);}
    .tag-unpaid{background:rgba(224,85,85,.12);color:var(--red);border:1px solid rgba(224,85,85,.3);}
    .tag-cancel{background:rgba(79,195,247,.1);color:var(--accent);border:1px solid rgba(79,195,247,.25);}
    .tag-nocancel{background:rgba(255,110,64,.1);color:#ff9e80;border:1px solid rgba(255,110,64,.25);}
    .tag-person{background:rgba(124,77,255,.12);color:#c5b3f0;border:1px solid rgba(124,77,255,.3);}
    .tag-fee{background:rgba(240,192,64,.08);color:rgba(240,192,64,.7);border:1px solid rgba(240,192,64,.2);font-style:italic;}

    /* ── Note */
    .card-note{margin:0 16px 11px;font-size:.73rem;color:var(--muted);background:var(--bg3);border-radius:6px;padding:7px 10px;border-left:2px solid var(--border);}

    /* ── Car */
    .car-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px;}
    .car-header{background:linear-gradient(135deg,#112a4a,#0d1e35);padding:18px 16px;border-bottom:1px solid var(--border);}
    .car-title{font-family:'Cinzel',serif;font-size:1.1rem;color:var(--accent2);margin-bottom:3px;}
    .car-model{font-size:.78rem;color:var(--muted);}
    .car-grid{display:grid;grid-template-columns:1fr 1fr;}
    .car-item{padding:11px 16px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);}
    .car-item:nth-child(even){border-right:none;}
    .car-item:last-child,.car-item:nth-last-child(2){border-bottom:none;}
    .car-item-label{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;}
    .car-item-value{font-size:.88rem;color:var(--text);font-weight:600;}
    .car-price-row{padding:13px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:rgba(79,195,247,.04);}
    .insurance-list{margin:10px 16px;font-size:.76rem;color:var(--muted);list-style:none;}
    .insurance-list li{display:flex;align-items:center;gap:8px;padding:4px 0;}
    .insurance-list li::before{content:'✓';color:var(--green);font-weight:700;}

    /* ── Progress */
    .progress-wrap{margin:14px 0 8px;}
    .progress-label{display:flex;justify-content:space-between;font-size:.73rem;color:var(--muted);margin-bottom:5px;}
    .progress-bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;}
    .progress-fill {
  height: 100%;
  background: var(--green);
  border-radius: 4px;
  transition: width 0.3s ease;
}

    /* ── Misc */
    .loading{text-align:center;padding:60px 20px;color:var(--muted);}
    .spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
    .offline-badge{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--aurora3);color:white;font-size:.73rem;padding:6px 16px;border-radius:20px;font-weight:700;z-index:100;letter-spacing:.08em;}
    .offline-badge.show{display:block;}
    .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:.9rem;}
    .section-title{font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:18px 0 9px;display:flex;align-items:center;gap:10px;}
    .section-title::after{content:'';flex:1;height:1px;background:var(--border);}
    .total-bar{background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid var(--border);border-radius:11px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
    .total-bar-label{font-size:.75rem;color:var(--muted);}
    .total-bar-value{font-family:'Cinzel',serif;font-size:1.08rem;color:var(--gold);}
    .filter-row{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap;}
    .filter-btn{font-size:.7rem;padding:4px 11px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Lato',sans-serif;transition:all .2s;}
    .filter-btn.active{background:var(--aurora2);border-color:var(--aurora2);color:white;}

    /* ── Pixel Weather Scene */
    .px-scene-wrap{margin-bottom:14px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:transparent;}
    .px-scene{position:relative;width:100%;height:220px;overflow:hidden;border-bottom:3px solid #000;image-rendering:pixelated;background:#a8dff0;}
    .px-ground{position:absolute;bottom:0;left:0;right:0;height:44%;background:repeating-linear-gradient(90deg,#3a6a4a 0 16px,#2a5a3a 16px 32px);}
    .px-path{position:absolute;bottom:0;left:5%;right:5%;height:28%;background:repeating-linear-gradient(90deg,#8a7a5a 0 14px,#7a6a4a 14px 28px);}
    .px-mtn{position:absolute;bottom:44%;width:0;height:0;}
    .px-particles{position:absolute;inset:0;pointer-events:none;}
    .px-loc{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.75);border:2px solid #fff;font-family:'Silkscreen',monospace;font-size:8px;color:#fff;padding:2px 6px;z-index:20;}
    .px-weather{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.75);border:2px solid #ffcc00;font-family:'Silkscreen',monospace;font-size:8px;color:#ffcc00;padding:2px 6px;z-index:20;}
    .px-runner{position:absolute;bottom:18%;display:flex;flex-direction:column;align-items:center;gap:2px;transform:translateX(-50%);transition:left .8s steps(12);z-index:10;}
    .px-runner-name{font-family:'Silkscreen',monospace;font-size:7px;color:#fff;background:rgba(0,0,0,.65);padding:1px 4px;border:1px solid #fff;white-space:nowrap;}
    .px-runner svg{transition:transform .4s steps(3);image-rendering:pixelated;}
    .px-runner.dead{bottom:18% !important;}
    .px-runner.dead svg{transform:rotate(90deg);transform-origin:center;}
    .px-runner.dead .px-runner-name{color:#ff3366;border-color:#ff3366;}
    /* GB 對話框 */
    .px-dialog{background:#e8f0d0;border-top:3px solid #000;padding:10px 14px;}
    .px-dialog-title{font-family:'Silkscreen',monospace;font-size:8px;color:#2a4a1a;letter-spacing:1px;margin-bottom:7px;border-bottom:2px solid #2a4a1a;padding-bottom:4px;}
    .px-bar-label{display:flex;justify-content:space-between;font-family:'Silkscreen',monospace;font-size:8px;color:#2a4a1a;margin-bottom:3px;}
    .px-bar-bg{height:14px;background:#888;border:3px solid #000;position:relative;overflow:hidden;}
    .px-bar-fill{height:100%;position:absolute;left:0;top:0;transition:width 1s steps(20);}
    .px-bar-fill.safe{background:repeating-linear-gradient(90deg,#48b845 0 6px,#2a8a27 6px 12px);}
    .px-bar-fill.warn{background:repeating-linear-gradient(90deg,#e8c020 0 6px,#b89010 6px 12px);}
    .px-bar-fill.danger{background:repeating-linear-gradient(90deg,#e03030 0 6px,#a01010 6px 12px);}
    .px-bar-limit{position:absolute;right:0;top:-3px;bottom:-3px;width:3px;background:#000;z-index:5;}
    .px-gb-msg{margin-top:7px;text-align:center;font-family:'Silkscreen',monospace;font-size:8px;padding:4px;border:2px solid #2a4a1a;background:#c8d8a8;}
    .px-gb-msg.safe{color:#1a5a1a;} .px-gb-msg.warn{color:#7a5a00;} .px-gb-msg.danger{color:#8a1010;}
  </style>
</head>
<body>
<div class="offline-badge" id="offlineBadge">📵 離線模式</div>
<div class="container">
  <header>
    <div class="aurora-line"></div>
    <h1>🇮🇸 冰島預算清單</h1>
    <div class="subtitle">Iceland · September 2026</div>
    <div class="sync-bar">
      <span class="sync-status" id="syncStatus">載入中…</span>
      <button class="sync-btn" id="syncBtn" onclick="manualSync()" title="點擊同步雲端資料">
        <span class="dot dot-local" id="syncDot"></span>
        <span class="sync-icon" id="syncIcon">☁</span>
        <span id="syncLabel">同步</span>
      </button>
    </div>
  </header>
  <div class="px-scene-wrap">
      <div class="px-scene" id="pxScene">
        <canvas class="px-particles" id="pxCanvas" width="680" height="220" style="z-index:3;"></canvas>
        <canvas id="pxCloudCanvas" style="position:absolute;inset:0;pointer-events:none;z-index:4;"></canvas>
        <svg id="pxBgSvg" width="100%" height="100%" viewBox="0 0 680 150" preserveAspectRatio="xMidYMax slice" style="position:absolute;inset:0;z-index:2;image-rendering:pixelated" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="px-loc" id="pxLoc">📍 讀取中...</div>
        <div id="pxWeatherWind" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.75);border:2px solid #ffcc00;font-family:'Silkscreen',monospace;font-size:8px;color:#ffcc00;padding:3px 7px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
          <span id="pxWeather">⏳ 連線中</span>
          <span id="pxWind" style="color:#7eb3d4;border-top:1px solid #444;padding-top:2px;width:100%;text-align:right;">💨 —</span>
        </div>
        <div id="pxTimes" style="position:absolute;bottom:20%;left:6px;right:6px;display:flex;justify-content:space-between;font-family:'Silkscreen',monospace;font-size:11px;color:#fff;z-index:20;text-shadow:1px 1px 0 #000;pointer-events:none">
          <span id="pxTimeTW">🇹🇼 --:--</span>
          <span id="pxTimeIS">🇮🇸 --:--</span>
        </div>

        <div id="pxCarEl" style="position:absolute;bottom:14%;left:2%;transform:translateX(-50%);z-index:9;image-rendering:pixelated;transition:left .8s steps(12);">
          <svg id="pxCar" width="64" height="40" viewBox="0 0 32 20" style="image-rendering:pixelated;display:block;"></svg>
        </div>
        <div class="px-runner" id="pxHana" style="left:5%">
          <svg id="svgHana" width="16" height="28" viewBox="0 0 16 28" style="image-rendering:pixelated"></svg>
        </div>
        <div class="px-runner" id="pxMonkey" style="left:5%">
          <svg id="svgMonkey" width="16" height="28" viewBox="0 0 16 28" style="image-rendering:pixelated"></svg>
        </div>
        <div class="px-runner" id="pxNing" style="left:5%">
          <svg id="svgNing" width="16" height="28" viewBox="0 0 16 28" style="image-rendering:pixelated"></svg>
        </div>
      </div>
      <div class="px-dialog">
        <div class="px-dialog-title">▶ ICELAND BUDGET　目標：&lt; NT$100,000 / 人</div>
        <div class="px-bar-label"><span>NT$0</span><span id="pxSpent">NT$ —</span><span>NT$100,000 ⚠</span></div>
        <div class="px-bar-bg" style="position:relative">
          <div class="px-bar-fill safe" id="pxBar" style="width:0%"></div>
          <div class="px-bar-limit"></div>
          <div id="pxPct" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Silkscreen',monospace;font-size:7px;color:#fff;text-shadow:1px 1px 0 #000;z-index:10;white-space:nowrap;pointer-events:none">0%</div>
        </div>
        <div class="px-gb-msg safe" id="pxMsg">▶ 讀取中...</div>
      </div>
  <div id="mainContent">
    <div class="loading"><div class="spinner"></div><div>正在讀取資料…</div></div>
  </div>
</div>

<script src="app.js"></script>
<script src="sprites.js"></script>
<script>
// ══════════════════════════════════════════════════════════
//  Google Sheets 公開 CSV 網址（發布到網路後填入）
//  格式: .../pub?gid=SHEET_GID&single=true&output=csv
// ══════════════════════════════════════════════════════════

// ── 住宿類型圖示判斷
function placeTypeIcon(name){
  const n=name.toLowerCase();
  if(n.includes('camp')||n.includes('camping')||n.includes('tjaldsv')||n.includes('þakgil')||n.includes('野營')||n.includes('營'))return{icon:'⛺',label:'營地'};
  if(n.includes('hostel')||n.includes('backpack'))return{icon:'🛏',label:'青旅'};
  if(n.includes('apartment')||n.includes('heimaleiga')||n.includes('公寓'))return{icon:'🏢',label:'公寓'};
  if(n.includes('guesthouse')||n.includes('guest house')||n.includes('民宿'))return{icon:'🏡',label:'民宿'};
  if(n.includes('hotel')||n.includes('酒店')||n.includes('旅館'))return{icon:'🏨',label:'旅館'};
  if(n.includes('cabin')||n.includes('cottage')||n.includes('小屋')||n.includes('barrel'))return{icon:'🪵',label:'小屋'};
  if(n.includes('farm')||n.includes('horse'))return{icon:'🐴',label:'農場'};
  return{icon:'🏠',label:'住宿'};
}

// ── 靜態備用資料
window.STATIC = {
  exchangeISK:0.2537, exchangeEUR:36.48, totalTWD:47859.89,
  car:{
    company:'ZERO CAR', model:'Toyota RAV4 (Used Model)', code:'',
    pickup:'9月15日 上午9:30', dropoff:'9月29日 下午11:00', days:14,
    location:'Blikavöllur 3, 235 Keflavík Airport, Iceland',
    totalTWD:74454, perPerson:25479.33, driver1:'花🌼', driver2:'猴🙉', payer:'猴🙉',
    insurance:['碰撞損害豁免險 CDW/SCDW','竊盜險 TP','碎石險 GP','道路救援免責聲明','零免賠額保險','額外司機']
  },
  accommodation:[

function fmtPer(n){if(!n||isNaN(n))return'—';return'NT$ '+Math.round(n/3).toLocaleString('zh-TW')+'<span style="font-size:.6em;color:var(--muted)">/人</span>';}
function fmtOrig(n,cur){
  if(!n||isNaN(n))return'';
  const sym={'ISK':'ISK ','EUR':'€','EU':'€','NT':'NT$'}[(cur||'').replace(/\./g,'').toUpperCase()]||(cur+' ');
  return sym+parseFloat(n).toLocaleString();
}

// ── Sync UI
function setSyncState(state,msg){
  dataSource=state;
  const dot=document.getElementById('syncDot');
  const icon=document.getElementById('syncIcon');
  const label=document.getElementById('syncLabel');
  const status=document.getElementById('syncStatus');
  dot.className='dot';
  if(state==='cloud'){dot.classList.add('dot-cloud');icon.innerHTML='☁';icon.classList.remove('spin-icon');label.textContent='雲端';}
  else if(state==='syncing'){dot.classList.add('dot-syncing');icon.innerHTML='<span class="spin-icon">↻</span>';label.textContent='同步中';}
  else if(state==='offline'){dot.classList.add('dot-offline');icon.innerHTML='📵';icon.classList.remove('spin-icon');label.textContent='離線';}
  else{dot.classList.add('dot-local');icon.innerHTML='💾';icon.classList.remove('spin-icon');label.textContent='本地';}
  if(msg) status.textContent=msg;
}

// ── 住宿卡片渲染
function renderAccom(items){
  const show=currentFilter==='all'?items:currentFilter==='paid'?items.filter(a=>a.paid):items.filter(a=>!a.paid);
  const total=items.reduce((s,a)=>s+(a.twd||0),0);
  const paidTotal=items.filter(a=>a.paid).reduce((s,a)=>s+(a.twd||0),0);
  const pct=total?Math.round(paidTotal/total*100):0;

  return `
    <div class="progress-wrap">
      <div class="progress-label"><span>已付款進度 ${pct}%</span><span>${fmt(paidTotal)} / ${fmt(total)}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="filter-row">
      <button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">全部 ${items.length}</button>
      <button class="filter-btn ${currentFilter==='paid'?'active':''}" onclick="setFilter('paid')">✓ 已付 ${items.filter(a=>a.paid).length}</button>
      <button class="filter-btn ${currentFilter==='unpaid'?'active':''}" onclick="setFilter('unpaid')">未付 ${items.filter(a=>!a.paid).length}</button>
    </div>
    ${show.map(a=>{
      const pt=placeTypeIcon(a.name);

      // 付款 tag 文字
      let payTag='';
      if(a.paid && a.payDate) payTag=`<span class="tag tag-paid">${a.payDate} 付款</span>`;
      else if(a.paid) payTag=`<span class="tag tag-paid">已付款</span>`;
      else if(a.deductDate) payTag=`<span class="tag tag-unpaid">${a.deductDate} 扣款</span>`;
      else payTag=`<span class="tag tag-unpaid">未付款</span>`;

      // 海外手續費（預留欄位，有值才顯示）
      const feeTag=a.foreignFee?`<span class="tag tag-fee">手續費 NT$${a.foreignFee}</span>`:'';

      return `
      <div class="card ${a.paid?'paid-card':'unpaid-card'}">
        <div class="card-header">
          <div class="card-left">
            <div class="card-date">${a.date}<span class="card-nights"> · ${a.nights}晚</span></div>
            <div class="card-name-row">
              <span class="place-type-icon" title="${pt.label}">${pt.icon}</span>
              <span class="card-name">${a.name}</span>
            </div>
          </div>
          <div class="card-price">
            ${a.twd ? `
              <div class="price-per-label">&nbsp;</div>
              <div class="price-per">${fmtPer(a.twd)}</div>
              <div class="price-total">${fmt(a.twd)} 合計</div>
              ${a.orig && a.cur !== 'NT' ? `<div class="price-orig">${fmtOrig(a.orig,a.cur)}</div>` : ''}
            ` : `<div class="price-per" style="color:var(--muted);font-size:.85rem">現場付</div>`}
          </div>
        </div>
        <div class="card-body">
          ${payTag}
          <span class="tag ${a.cancel?'tag-cancel':'tag-nocancel'}">${a.cancel?'可取消':'不可退'}</span>
          <span style="display:inline-flex;align-items:center;">${avatarSvg(a.payer)}</span>
          ${feeTag}
        </div>
        ${a.note?`<div class="card-note">📌 ${a.note}</div>`:''}
      </div>`;
    }).join('')}
  `;
}

function setFilter(f){
  currentFilter=f;
  document.getElementById('accomContent').innerHTML=renderAccom(APP_DATA.accommodation);
}

        <div class="summary-value">${fmt(grandTotal/3)}</div>
        <div class="summary-sub">合計 ${fmt(grandTotal)}</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">🚗 租車</div>
        <div class="summary-label-sub">&nbsp;</div>
        <div class="summary-value" style="font-size:1rem">${'NT$ '+d.car.perPerson.toLocaleString('zh-TW')+'<span style="font-size:.6em;color:var(--muted)">/人</span>'}</div>
        <div class="summary-sub">合計 ${fmt(d.car.totalTWD)}</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">🏕 住宿</div>
        <div class="summary-label-sub">&nbsp;</div>
        <div class="summary-value" style="font-size:1rem">${fmtPer(totalAccom)}</div>
        <div class="summary-sub">合計 ${fmt(totalAccom)}</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">🎯 活動</div>
        <div class="summary-label-sub">&nbsp;</div>
        ${totalActivity ? `<div class="summary-value" style="font-size:1rem">${fmtPer(totalActivity)}</div><div class="summary-sub">合計 ${fmt(totalActivity)}</div>` : '<div class="summary-value" style="font-size:.85rem;color:var(--muted)">待新增</div><div class="summary-sub">—</div>'}
      </div>
    </div>
    <div class="rate-bar">
      <span>💱 <strong>ISK</strong> = ${d.exchangeISK.toFixed(4)} NT$</span>
      <span>💱 <strong>EUR</strong> = ${d.exchangeEUR.toFixed(2)} NT$</span>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('accommodation',this)">🏕 住宿</button>
      <button class="tab" onclick="showTab('car',this)">🚗 租車</button>
      <button class="tab" onclick="showTab('activity',this)">🎯 活動</button>
    </div>
    <div id="accommodation" class="section active">
      <div id="accomContent">${renderAccom(d.accommodation)}</div>
    </div>
    <div id="car" class="section">${renderCar(d.car)}</div>
    <div id="activity" class="section"><div class="empty">🚧 施工中，敬請期待</div></div>
  `;
}

function showTab(id,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

// ── 同步邏輯
async function syncFromCloud(){
  if (window.__syncIcelandBudgetFromSheets) {
    return window.__syncIcelandBudgetFromSheets();
  }
  setSyncState('local','同步模組尚未載入，使用本地資料');
}

async function manualSync(){
  if(dataSource==='syncing') return;
  await syncFromCloud();
}

async function init(){
  renderAll();
  setSyncState('local','載入本地資料中…');
  await syncFromCloud();

  window.addEventListener('offline',()=>{
    document.getElementById('offlineBadge').classList.add('show');
    setSyncState('offline','離線模式');
  });

  window.addEventListener('online',()=>{
    document.getElementById('offlineBadge').classList.remove('show');
    syncFromCloud();
  });

  if(!navigator.onLine) {
    document.getElementById('offlineBadge').classList.add('show');
  }
}


// ── 冰島即時天氣場景
(function(){
  const BUDGET = 100000;
  const ITINERARY = [
    {from:'09-15',to:'09-16',name:'Hekla 附近',lat:63.98,lon:-19.67},
    {from:'09-17',to:'09-17',name:'Þakgil',lat:63.47,lon:-18.93},
    {from:'09-18',to:'09-19',name:'Svínafell',lat:63.99,lon:-16.87},
    {from:'09-20',to:'09-20',name:'富瑞麥德',lat:65.07,lon:-13.98},
    {from:'09-21',to:'09-21',name:'Húsey 農場',lat:65.53,lon:-14.57},
    {from:'09-22',to:'09-22',name:'米湖',lat:65.60,lon:-17.00},
    {from:'09-23',to:'09-23',name:'Ósar',lat:65.72,lon:-20.28},
    {from:'09-24',to:'09-24',name:'西峽灣小屋',lat:65.54,lon:-22.10},
    {from:'09-25',to:'09-25',name:'Miðjanes',lat:65.45,lon:-22.50},
    {from:'09-26',to:'09-26',name:'海山景小屋',lat:64.85,lon:-22.20},
    {from:'09-27',to:'09-28',name:'雷克雅維克',lat:64.13,lon:-21.82},
  ];
  const DEFAULT={name:'雷克雅維克',lat:64.13,lon:-21.82};

  function getLoc(){
    const t=new Date();
    const mmdd=String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
    for(const s of ITINERARY) if(mmdd>=s.from&&mmdd<=s.to) return s;
    return DEFAULT;
  }
  function decodeW(code,isDay){
    if(code===0) return{label:isDay?'晴天 ☀️':'晴夜 🌙',type:isDay?'sunny':'night'};
    if(code<=2)  return{label:'多雲 ⛅',type:'cloudy'};
    if(code===3) return{label:'陰天 ☁️',type:'overcast'};
    if(code<=49) return{label:'有霧 🌫️',type:'fog'};
    if(code<=55) return{label:'毛毛雨 🌦️',type:'drizzle'};
    if(code<=67) return{label:'下雨 🌧️',type:'rain'};
    if(code<=77) return{label:'下雪 🌨️',type:'snow'};
    if(code<=82) return{label:'陣雨 🌦️',type:'rain'};
    if(code<=86) return{label:'陣雪 🌨️',type:'snow'};
    if(code<=99) return{label:'雷雨 ⛈️',type:'thunder'};
    return{label:'未知',type:'cloudy'};
  }
  function setSky(type){
    const el=document.getElementById('pxScene');
    if(!el)return;
    // 天空背景色（SVG 天空已移除，改用純色背景配合天氣）
    const skies={
      sunny:'#a8dff0', night:'#050d1a', cloudy:'#7a9aaa',
      overcast:'#606878', fog:'#a0b8c0', rain:'#4a5a68',
      drizzle:'#5a6a78', snow:'#8090b8', thunder:'#2a2a40',
    };
    el.style.background=skies[type]||skies.sunny;
  }
  function startParticles(type, windSpeed){
    const canvas=document.getElementById('pxCanvas');
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    canvas.width=canvas.offsetWidth||680;
    canvas.height=canvas.offsetHeight||220;
    let pts=[],aOff=0,sunP=0;

    if(type==='rain'||type==='drizzle'||type==='thunder'){
      for(let i=0;i<50;i++) pts.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,speed:type==='drizzle'?2:4,len:type==='drizzle'?6:12});
      (function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle=type==='thunder'?'rgba(150,180,220,0.7)':'rgba(120,160,200,0.6)';ctx.lineWidth=1;pts.forEach(p=>{ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-2,p.y+p.len);ctx.stroke();p.y+=p.speed;p.x-=1;if(p.y>canvas.height){p.y=0;p.x=Math.random()*canvas.width;}});if(type==='thunder'&&Math.random()<0.003){ctx.fillStyle='rgba(255,255,200,0.15)';ctx.fillRect(0,0,canvas.width,canvas.height);}requestAnimationFrame(draw);})();
    }else if(type==='snow'){
      for(let i=0;i<40;i++) pts.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*3+1,speed:0.5+Math.random()});
      (function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='rgba(220,235,255,0.85)';pts.forEach(p=>{ctx.fillRect(Math.round(p.x),Math.round(p.y),Math.round(p.size),Math.round(p.size));p.y+=p.speed;p.x+=Math.sin(p.y/20)*0.5;if(p.y>canvas.height){p.y=0;p.x=Math.random()*canvas.width;}});requestAnimationFrame(draw);})();
    }else if(type==='night'){
      (function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);aOff+=0.5;[[0,255,180,0.15],[120,80,255,0.12],[0,200,255,0.10]].forEach(([r,g,b,a],i)=>{ctx.fillStyle=`rgba(${r},${g},${b},${a})`;ctx.fillRect(0,15+i*8+Math.sin((aOff+i*20)/30)*6,canvas.width,10);});ctx.fillStyle='rgba(255,255,255,0.8)';[[50,20],[120,35],[200,15],[300,28],[420,18],[520,32],[620,22]].forEach(([x,y])=>ctx.fillRect(x,y,2,2));requestAnimationFrame(draw);})();
    }else if(type==='sunny'){
      (function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);sunP+=0.05;ctx.fillStyle=`rgba(255,220,100,${0.06+Math.sin(sunP)*0.02})`;ctx.beginPath();ctx.arc(canvas.width-50,25,35,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,220,100,0.85)';ctx.fillRect(canvas.width-58,22,14,7);requestAnimationFrame(draw);})();
    }else if(type==='fog'){
      const fogBalls=[
        {x:  0,y:30,w:220,h:50,spd:0.20,op:0.13},
        {x:180,y:55,w:280,h:60,spd:0.14,op:0.11},
        {x:420,y:20,w:200,h:45,spd:0.25,op:0.10},
        {x: 80,y:70,w:320,h:55,spd:0.10,op:0.09},
        {x:500,y:45,w:250,h:50,spd:0.18,op:0.12},
        {x:250,y:80,w:200,h:40,spd:0.22,op:0.08},
      ];
      (function draw(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        fogBalls.forEach(f=>{
          f.x+=f.spd;
          if(f.x>canvas.width+f.w) f.x=-f.w;
          const grd=ctx.createLinearGradient(f.x,0,f.x+f.w,0);
          grd.addColorStop(0,`rgba(200,215,225,0)`);
          grd.addColorStop(0.2,`rgba(200,215,225,${f.op})`);
          grd.addColorStop(0.8,`rgba(200,215,225,${f.op})`);
          grd.addColorStop(1,`rgba(200,215,225,0)`);
          ctx.fillStyle=grd;
          ctx.fillRect(f.x,f.y,f.w,f.h);
        });
        requestAnimationFrame(draw);
      })();
    }

    // 雲：獨立 canvas，夜晚跳過
    const cloudCanvas=document.getElementById('pxCloudCanvas');
    if(cloudCanvas){
      const cctx=cloudCanvas.getContext('2d');
      cloudCanvas.width=canvas.width;
      cloudCanvas.height=canvas.height;
      if(type!=='night'){
        const spd=Math.max((windSpeed||0)*0.18,0.15);
        const clouds=[
          {x:Math.random()*canvas.width,y:8, w:44,h:10,thick:6},
          {x:Math.random()*canvas.width,y:18,w:58,h:10,thick:6},
          {x:Math.random()*canvas.width,y:12,w:32,h:7, thick:4},
          {x:Math.random()*canvas.width,y:24,w:28,h:7, thick:4},
          {x:Math.random()*canvas.width,y:6, w:22,h:6, thick:4},
        ];
        (function drawClouds(){
          cctx.clearRect(0,0,cloudCanvas.width,cloudCanvas.height);
          clouds.forEach(c=>{
            c.x+=spd;
            if(c.x>cloudCanvas.width+c.w) c.x=-c.w-10;
            cctx.fillStyle='rgba(255,255,255,0.28)';
            cctx.fillRect(Math.round(c.x),c.y,c.w,c.h);
            cctx.fillRect(Math.round(c.x)+4,c.y-c.thick,c.w-8,c.thick+2);
          });
          requestAnimationFrame(drawClouds);
        })();
      } else {
        cctx.clearRect(0,0,cloudCanvas.width,cloudCanvas.height);
      }
    }
  }

  window.updatePixelBudget = function(){
    const d=window.APP_DATA||window.STATIC;
    if(!d||!document.getElementById('pxBar'))return;
    const totalAccom=(d.accommodation||[]).reduce((s,a)=>s+(a.twd||0),0);
    const totalAct=(d.activity||[]).reduce((s,a)=>s+(a.twd||0),0);
    const grandTotal=(d.car.totalTWD||0)+totalAccom+totalAct;
    const perPerson=Math.round(grandTotal/3);
    const pct=Math.min(Math.round(perPerson/BUDGET*100),100);
    const remain=BUDGET-perPerson;
    const isOver=perPerson>=BUDGET;

    const bar=document.getElementById('pxBar');
    bar.style.width=pct+'%';
    bar.className='px-bar-fill '+(pct>=100?'danger':pct>=70?'warn':'safe');
    document.getElementById('pxPct').textContent=pct+'%';
    const spentEl=document.getElementById('pxSpent');
    if(spentEl)spentEl.textContent='NT$ '+perPerson.toLocaleString('zh-TW');

    const ids=['pxHana','pxMonkey','pxNing'];
    ids.forEach((id,i)=>{
      const el=document.getElementById(id);
      if(!el)return;
      if(isOver){el.classList.add('dead');el.style.left=(25+i*12)+'%';}
      else{el.classList.remove('dead');el.style.left=Math.min(pct*0.85+i*5,86)+'%';}
    });

    // 車子跟在角色群前面（花的位置再往前一段）
    const carEl=document.getElementById('pxCarEl');
    if(carEl){
      const carLeft = isOver ? 8 : Math.max(Math.min(pct*0.85-15, 74), 2);
      carEl.style.left = carLeft+'%';
    }

    const msg=document.getElementById('pxMsg');
    if(isOver){msg.className='px-gb-msg danger';msg.textContent='✖ 超支！全員倒地！';}
    else if(pct>=70){msg.className='px-gb-msg warn';msg.textContent='！注意！剩 NT$'+remain.toLocaleString()+' 要小心了';}
    else{msg.className='px-gb-msg safe';msg.textContent='▶ 安全！還可以花 NT$'+remain.toLocaleString();}
  };


  // ── Sprite 動畫資料（從 Aseprite 轉換）


  let _weatherFetched = false; // 避免重複讀取
  let _weatherCache = null;   // 快取上次天氣結果

  function updateClocks(){
    const now = new Date();
    // 台灣 UTC+8
    const tw = new Date(now.toLocaleString('en-US',{timeZone:'Asia/Taipei'}));
    const is = new Date(now.toLocaleString('en-US',{timeZone:'Atlantic/Reykjavik'}));
    const fmt2 = n => String(n).padStart(2,'0');
    const twEl = document.getElementById('pxTimeTW');
    const isEl = document.getElementById('pxTimeIS');
    if(twEl) twEl.textContent = '🇹🇼 '+fmt2(tw.getHours())+':'+fmt2(tw.getMinutes());
    if(isEl) isEl.textContent = '🇮🇸 '+fmt2(is.getHours())+':'+fmt2(is.getMinutes());
  }

  function windColor(speed){
    if(speed < 8)  return '#7eb3d4'; // 微風
    if(speed < 14) return '#ffcc00'; // 中風
    if(speed < 20) return '#ff9e80'; // 強風
    return '#ff3366';                // 暴風
  }

  async function initWeather(){
    if(_weatherFetched) return; // 防止 renderAll 觸發重複呼叫
    _weatherFetched = true;

    const loc=getLoc();
    const locEl=document.getElementById('pxLoc');
    const wEl=document.getElementById('pxWeather');
    if(locEl)locEl.textContent='📍 '+loc.name;
    try{
      const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weathercode,is_day,windspeed_10m&timezone=Atlantic%2FReykjavik`);
      const data=await res.json();
      const w=decodeW(data.current.weathercode,data.current.is_day===1);
      const temp=Math.round(data.current.temperature_2m);
      const wind=Math.round(data.current.windspeed_10m);
      _weatherCache = { loc, w, temp, wind };
      applyWeatherToDOM();
      setSky(w.type);startParticles(w.type, wind);
    }catch(e){
      if(wEl)wEl.textContent='⚠ 天氣讀取失敗';
      setSky('cloudy');startParticles('cloudy', 5);
    }
    // 時鐘每分鐘更新
    updateClocks();
    setInterval(updateClocks, 30000);
  }

  function applyWeatherToDOM(){
    if(!_weatherCache) return;
    const {loc, w, temp, wind} = _weatherCache;
    const locEl  = document.getElementById('pxLoc');
    const wEl    = document.getElementById('pxWeather');
    const windEl = document.getElementById('pxWind');
    const boxEl  = document.getElementById('pxWeatherWind');
    if(locEl) locEl.textContent = '📍 '+loc.name;
    if(wEl)   wEl.textContent   = w.label+'  '+temp+'°C';
    if(windEl){
      windEl.textContent      = '💨 '+wind+' m/s';
      windEl.style.color      = windColor(wind);
      windEl.style.borderTopColor = windColor(wind);
    }
    if(boxEl) boxEl.style.borderColor = '#ffcc00';
  }

  // renderAll 執行後再更新人偶位置
  const _origRenderAll = window.renderAll;
  window.renderAll = function(){
    _origRenderAll && _origRenderAll();
    setTimeout(window.updatePixelBudget, 100);
    // 場景已是靜態 DOM，只需回填文字資料即可
    applyWeatherToDOM();
  };

  document.addEventListener('DOMContentLoaded', ()=>{
    setTimeout(initWeather, 200);
    setTimeout(window.updatePixelBudget, 500);
  });
})();

if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

init();
</script>
