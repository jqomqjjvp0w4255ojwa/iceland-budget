<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111f" />
  <meta name="description" content="冰島旅遊預算清單" />
  <title>🇮🇸 冰島預算清單</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07111f; --bg2: #0d1f35; --bg3: #112540; --card: #0f2240;
      --border: #1e3a5f; --accent: #4fc3f7; --accent2: #81d4fa;
      --gold: #f0c040; --green: #66bb6a; --red: #ef5350;
      --text: #e8f4fd; --muted: #7eb3d4;
      --aurora1: #00e5cc; --aurora2: #7c4dff; --aurora3: #ff6e40;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Lato', sans-serif; min-height: 100vh; overflow-x: hidden; }
    body::before {
      content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 80% 40% at 20% 10%, rgba(0,229,204,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 30% at 80% 5%, rgba(124,77,255,0.06) 0%, transparent 55%),
        radial-gradient(ellipse 50% 20% at 50% 0%, rgba(79,195,247,0.05) 0%, transparent 50%);
    }
    
    
    <button id="refresh-btn" style="position: fixed; top: 15px; right: 15px; z-index: 9999; padding: 10px; background: #112540; border: 1px solid #4fc3f7; border-radius: 50%; cursor: pointer; font-size: 20px; box-shadow: 0 0 10px rgba(79,195,247,0.5); display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;">
    🔄
    </button>
    <div class="container">
    .container { max-width: 680px; margin: 0 auto; padding: 0 16px 80px; position: relative; z-index: 1; }
    header { text-align: center; padding: 36px 16px 20px; }
    .aurora-line {
      height: 2px; margin-bottom: 20px;
      background: linear-gradient(90deg, transparent, var(--aurora1), var(--accent), var(--aurora2), transparent);
      animation: shimmer 3s ease-in-out infinite;
    }
    @keyframes shimmer { 0%,100%{opacity:.6} 50%{opacity:1} }
    header h1 { font-family:'Cinzel',serif; font-size:1.6rem; font-weight:600; letter-spacing:.12em; color:var(--accent2); text-shadow:0 0 30px rgba(79,195,247,.4); }
    header .subtitle { font-size:.78rem; color:var(--muted); letter-spacing:.2em; text-transform:uppercase; margin-top:6px; }
    .last-updated { font-size:.72rem; color:var(--muted); margin-top:8px; opacity:.7; }
    .summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:20px 0; }
    .summary-card {
      background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; text-align:center; position:relative; overflow:hidden;
    }
    .summary-card::before { content:''; position:absolute; top:0;left:0;right:0; height:2px; background:linear-gradient(90deg,var(--aurora2),var(--accent)); }
    .summary-card.full { grid-column:1/-1; }
    .summary-card.full::before { background:linear-gradient(90deg,var(--aurora1),var(--gold)); }
    .summary-label { font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.15em; margin-bottom:8px; }
    .summary-value { font-family:'Cinzel',serif; font-size:1.4rem; color:var(--gold); font-weight:600; }
    .summary-card.full .summary-value { font-size:1.8rem; color:var(--accent2); }
    .summary-sub { font-size:.72rem; color:var(--muted); margin-top:4px; }
    .rate-bar {
      background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:10px 16px;
      display:flex; justify-content:center; gap:24px; margin-bottom:20px; font-size:.75rem; color:var(--muted);
    }
    .rate-bar span { display:flex; align-items:center; gap:6px; }
    .rate-bar strong { color:var(--accent); }
    .tabs { display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab {
      flex-shrink:0; background:var(--bg3); border:1px solid var(--border); border-radius:20px;
      padding:8px 18px; font-size:.82rem; color:var(--muted); cursor:pointer; transition:all .2s;
      white-space:nowrap; font-family:'Lato',sans-serif;
    }
    .tab.active { background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:700; }
    .tab:hover:not(.active) { border-color:var(--accent); color:var(--accent); }
    .section { display:none; animation:fadeIn .3s ease; }
    .section.active { display:block; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:12px; overflow:hidden; transition:border-color .2s; }
    .card:hover { border-color:var(--accent); }
    .card-header { padding:14px 16px 10px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .card-title { font-size:.95rem; font-weight:700; color:var(--text); line-height:1.3; }
    .card-subtitle { font-size:.75rem; color:var(--muted); margin-top:2px; }
    .card-price { text-align:right; flex-shrink:0; }
    .price-nt { font-family:'Cinzel',serif; font-size:1.05rem; color:var(--gold); font-weight:600; white-space:nowrap; }
    .price-orig { font-size:.7rem; color:var(--muted); margin-top:2px; }
    .price-per { font-size:.7rem; color:var(--accent); margin-top:2px; }
    .card-body { padding:0 16px 14px; display:flex; gap:8px; flex-wrap:wrap; }
    .tag { font-size:.68rem; padding:3px 10px; border-radius:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
    .tag-paid { background:rgba(102,187,106,.15); color:var(--green); border:1px solid rgba(102,187,106,.3); }
    .tag-unpaid { background:rgba(239,83,80,.12); color:var(--red); border:1px solid rgba(239,83,80,.25); }
    .tag-cancel { background:rgba(79,195,247,.1); color:var(--accent); border:1px solid rgba(79,195,247,.2); }
    .tag-nocancel { background:rgba(255,110,64,.1); color:#ff9e80; border:1px solid rgba(255,110,64,.2); }
    .tag-person { background:rgba(124,77,255,.12); color:#b39ddb; border:1px solid rgba(124,77,255,.25); }
    .card-note { margin:0 16px 12px; font-size:.75rem; color:var(--muted); background:var(--bg3); border-radius:6px; padding:8px 10px; border-left:2px solid var(--border); }
    .car-card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:16px; }
    .car-header { background:linear-gradient(135deg,#112a4a,#0d1e35); padding:20px 16px; border-bottom:1px solid var(--border); }
    .car-title { font-family:'Cinzel',serif; font-size:1.1rem; color:var(--accent2); margin-bottom:4px; }
    .car-model { font-size:.8rem; color:var(--muted); }
    .car-grid { display:grid; grid-template-columns:1fr 1fr; }
    .car-item { padding:12px 16px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); }
    .car-item:nth-child(even) { border-right:none; }
    .car-item:last-child,.car-item:nth-last-child(2) { border-bottom:none; }
    .car-item-label { font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; margin-bottom:4px; }
    .car-item-value { font-size:.9rem; color:var(--text); font-weight:600; }
    .car-price-row { padding:14px 16px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:rgba(79,195,247,.04); }
    .insurance-list { margin:12px 16px; font-size:.78rem; color:var(--muted); list-style:none; }
    .insurance-list li { display:flex; align-items:center; gap:8px; padding:4px 0; }
    .insurance-list li::before { content:'✓'; color:var(--green); font-weight:700; }
    .progress-wrap { margin:16px 0 8px; }
    .progress-label { display:flex; justify-content:space-between; font-size:.75rem; color:var(--muted); margin-bottom:6px; }
    .progress-bar { height:6px; background:var(--bg3); border-radius:3px; overflow:hidden; }
    .progress-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,var(--accent),var(--aurora1)); transition:width .8s ease; }
    .loading { text-align:center; padding:60px 20px; color:var(--muted); }
    .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .offline-badge { display:none; position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--aurora3); color:white; font-size:.75rem; padding:6px 16px; border-radius:20px; font-weight:700; z-index:100; letter-spacing:.1em; }
    .offline-badge.show { display:block; }
    .empty { text-align:center; padding:40px 20px; color:var(--muted); font-size:.9rem; }
    .section-title { font-family:'Cinzel',serif; font-size:.8rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:20px 0 10px; display:flex; align-items:center; gap:10px; }
    .section-title::after { content:''; flex:1; height:1px; background:var(--border); }
    .total-bar { background:linear-gradient(135deg,var(--bg3),var(--bg2)); border:1px solid var(--border); border-radius:12px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .total-bar-label { font-size:.78rem; color:var(--muted); }
    .total-bar-value { font-family:'Cinzel',serif; font-size:1.1rem; color:var(--gold); }
    .filter-row { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
    .filter-btn { font-size:.72rem; padding:4px 12px; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; font-family:'Lato',sans-serif; transition:all .2s; }
    .filter-btn.active { background:var(--aurora2); border-color:var(--aurora2); color:white; }
  </style>
</head>
<body>
<div class="offline-badge" id="offlineBadge">📵 離線模式</div>
<div class="container">
  <header>
    <div class="aurora-line"></div>
    <h1>🇮🇸 冰島預算清單</h1>
    <div class="subtitle">Iceland · September 2024</div>
    <div class="last-updated" id="lastUpdated">載入中…</div>
  </header>
  <div id="mainContent">
    <div class="loading"><div class="spinner"></div><div>正在讀取資料…</div></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  設定：將下方 URL 換成你的 Google Sheets 公開 CSV 連結
//  格式：https://docs.google.com/spreadsheets/d/e/XXX/pub?gid=SHEET_GID&single=true&output=csv
// ══════════════════════════════════════════
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTBrWzl3S5EoP32KLKh58I2lej4knEKBkRj_QWzJuEWsxajiDUhYHeV-HQ6FE-ihxlLSlNDp1N6fXMT/pub?output=csv';

// ── 靜態備用資料（離線 / 無法 fetch 時使用）
const STATIC = {
  exchangeISK: 0.2537,
  exchangeEUR: 36.48,
  totalTWD: 47859.89,
  car: {
    company:'ZERO CAR', model:'Toyota RAV4 (Used Model)', code:'5F6MP8',
    pickup:'9月15日 上午9:30', dropoff:'9月29日 下午11:00', days:14,
    location:'Blikavöllur 3, 235 Keflavík Airport, Iceland',
    totalTWD:74454, perPerson:25479.33, driver1:'花🌼', driver2:'猴🙉', payer:'猴🙉',
    insurance:['碰撞損害豁免險 CDW/SCDW','竊盜險 TP','碎石險 GP','道路救援免責聲明','零免賠額保險','額外司機']
  },
  accommodation:[
    {name:'Hekla Nordicabin Wild Cottage',      date:'9/15–9/16',nights:2, cur:'EU',  orig:null,   twd:0,        paid:false,cancel:false,payer:'花🌼',note:''},
    {name:'Þakgil',                              date:'9/17',     nights:1, cur:'ISK', orig:34000,  twd:8625.10,  paid:true, cancel:false,payer:'寧',  note:'訂金已付一半'},
    {name:'Tjaldsvæðið í Svínafelli',            date:'9/18–9/19',nights:2, cur:'ISK', orig:47200,  twd:11973.67, paid:false,cancel:true, payer:'寧',  note:'現場付'},
    {name:'Framtid Camping Lodging Barrels 富瑞麥德',date:'9/20',  nights:1, cur:'EU',  orig:null,   twd:0,        paid:false,cancel:false,payer:'花🌼',note:''},
    {name:'Húsey Hostel & Horsefarm',            date:'9/21',     nights:1, cur:'EUR', orig:132.56, twd:4835.91,  paid:false,cancel:true, payer:'猴🙉',note:''},
    {name:'Guesthouse Stöng 米湖斯通小屋旅館',    date:'9/22',     nights:1, cur:'NT',  orig:6678,   twd:6678,     paid:true, cancel:false,payer:'寧',  note:''},
    {name:'Ósar Hostel 怪石頭小屋',              date:'9/23',     nights:1, cur:'EUR', orig:139.29, twd:5081.43,  paid:false,cancel:true, payer:'猴🙉',note:''},
    {name:'Sea, fjord & mountain view house',    date:'9/24',     nights:1, cur:'EUR', orig:188.85, twd:6889.42,  paid:true, cancel:false,payer:'猴🙉',note:''},
    {name:'Miðjanes Reykhólahrepp 米歐傑恩瑞科拉',date:'9/25',    nights:1, cur:'EUR', orig:121.06, twd:4416.38,  paid:false,cancel:true, payer:'猴🙉',note:''},
    {name:'Between sea and big mountains',       date:'9/26',     nights:1, cur:'EUR', orig:160,    twd:5836.95,  paid:false,cancel:true, payer:'寧',  note:''},
    {name:'Icelandic Apartments by Heimaleiga',  date:'9/27–9/28',nights:2, cur:'EUR', orig:351,    twd:12804.81, paid:false,cancel:true, payer:'猴🙉',note:''},
  ]
};

let currentFilter = 'all';

function fmt(n){if(!n||isNaN(n))return'—';return'NT$ '+Math.round(n).toLocaleString('zh-TW');}
function fmtOrig(n,cur){
  if(!n||isNaN(n))return'';
  const sym={'ISK':'ISK ','EUR':'€','EU':'€','NT':'NT$'}[cur.replace('.','').toUpperCase()]||cur+' ';
  return sym+parseFloat(n).toLocaleString();
}

function renderAccom(items){
  const show = currentFilter==='all'?items
    : currentFilter==='paid'?items.filter(a=>a.paid)
    : items.filter(a=>!a.paid);
  const total=items.reduce((s,a)=>s+(a.twd||0),0);
  const paidTotal=items.filter(a=>a.paid).reduce((s,a)=>s+(a.twd||0),0);
  const pct=total?Math.round(paidTotal/total*100):0;

  return `
    <div class="progress-wrap">
      <div class="progress-label"><span>已付款進度 ${pct}%</span><span>${fmt(paidTotal)} / ${fmt(total)}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="total-bar">
      <span class="total-bar-label">住宿合計（每人）</span>
      <span class="total-bar-value">${fmt(total/3)}</span>
    </div>
    <div class="filter-row">
      <button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">全部 ${items.length}</button>
      <button class="filter-btn ${currentFilter==='paid'?'active':''}" onclick="setFilter('paid')">✓ 已付款 ${items.filter(a=>a.paid).length}</button>
      <button class="filter-btn ${currentFilter==='unpaid'?'active':''}" onclick="setFilter('unpaid')">未付款 ${items.filter(a=>!a.paid).length}</button>
    </div>
    ${show.map(a=>{
      // --- 自動判斷住宿類型符號 ---
      let typeIcon = '🏨'; // 預設一般旅館
      const name = a.name || '';
      if (name.includes('Camping') || name.includes('Þakgil') || name.includes('Campsite') || name.includes('營') || name.includes('Tjald')) {
          typeIcon = '🏕️';
      } else if (name.includes('Apartment') || name.includes('Cottage') || name.includes('House') || name.includes('house') || name.includes('屋')) {
          typeIcon = '🏡';
      } else if (name.includes('Hostel')) {
          typeIcon = '🎒';
      }

      return `
      <div class="card">
        <div style="padding: 14px 16px 8px;">
          <div style="font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-bottom: 6px;">
            📅 ${a.date} <span style="font-size: 0.75rem; font-weight: normal; color: var(--muted);">· ${a.nights}晚</span>
          </div>
          <div style="font-size: 0.95rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; line-height: 1.3;">
            <span style="font-size: 1.25rem;">${typeIcon}</span>
            <span>${a.name}</span>
          </div>
        </div>

        <div style="margin: 4px 16px 12px; background: rgba(79,195,247,0.06); border: 1px solid rgba(79,195,247,0.15); border-radius: 8px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.75rem; color: var(--muted); letter-spacing: 0.05em;">每人預估負擔</span>
          <span style="font-family: 'Cinzel', serif; font-size: 1.4rem; color: var(--gold); font-weight: 600;">
            ${a.twd ? fmt(a.twd/3) : '—'}
          </span>
        </div>

        <div style="padding: 0 16px 12px; display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted);">
          <div>三人總計: <span style="color: #ccc;">${a.twd ? fmt(a.twd) : '—'}</span></div>
          <div>${a.orig ? `外幣原價: <span style="color: #ccc;">${fmtOrig(a.orig,a.cur)}</span>` : ''}</div>
        </div>

        <div class="card-body" style="padding-top: 0;">
          <span class="tag ${a.paid?'tag-paid':'tag-unpaid'}">${a.paid?'✓ 已付款':'未付款'}</span>
          <span class="tag ${a.cancel?'tag-cancel':'tag-nocancel'}">${a.cancel?'可取消':'不可退'}</span>
          <span class="tag tag-person">${a.payer}</span>
        </div>
        ${a.note?`<div class="card-note">📌 ${a.note}</div>`:''}
      </div>
    `}).join('')}
  `;
}

function setFilter(f){
  currentFilter=f;
  document.getElementById('accomContent').innerHTML=renderAccom(STATIC.accommodation);
}

function renderCar(car){
  return `
    <div class="car-card">
      <div class="car-header">
        <div class="car-title">${car.company}</div>
        <div class="car-model">${car.model}</div>
      </div>
      <div class="car-grid">
        <div class="car-item">
          <div class="car-item-label">確認碼</div>
          <div class="car-item-value" style="color:var(--gold);font-family:'Cinzel',serif;letter-spacing:.1em">${car.code}</div>
        </div>
        <div class="car-item">
          <div class="car-item-label">租用天數</div>
          <div class="car-item-value">${car.days} 天</div>
        </div>
        <div class="car-item">
          <div class="car-item-label">取車時間</div>
          <div class="car-item-value" style="font-size:.82rem">${car.pickup}</div>
        </div>
        <div class="car-item">
          <div class="car-item-label">還車時間</div>
          <div class="car-item-value" style="font-size:.82rem">${car.dropoff}</div>
        </div>
        <div class="car-item" style="grid-column:1/-1;border-right:none">
          <div class="car-item-label">取還車地點</div>
          <div class="car-item-value" style="font-size:.8rem;font-weight:400;color:var(--muted)">${car.location}</div>
        </div>
      </div>
      <div class="car-price-row">
        <div>
          <div style="font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">總費用</div>
          <div style="font-family:'Cinzel',serif;font-size:1.3rem;color:var(--gold)">${fmt(car.totalTWD)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">每人分攤</div>
          <div style="font-family:'Cinzel',serif;font-size:1.3rem;color:var(--accent)">${fmt(car.perPerson)}</div>
        </div>
      </div>
    </div>
    <div class="section-title">保險項目</div>
    <div class="card"><ul class="insurance-list">${car.insurance.map(i=>`<li>${i}</li>`).join('')}</ul></div>
    <div class="section-title">駕駛資訊</div>
    <div class="card">
      <div class="card-body" style="padding:14px 16px">
        <span class="tag tag-person">主駕 ${car.driver1}</span>
        <span class="tag tag-person">副駕 ${car.driver2}</span>
        <span class="tag tag-paid">付款 ${car.payer}</span>
      </div>
    </div>
  `;
}

function renderAll(){
  const d=STATIC;
  const totalAccom=d.accommodation.reduce((s,a)=>s+(a.twd||0),0);
  document.getElementById('mainContent').innerHTML=`
    <div class="summary-grid">
      <div class="summary-card full">
        <div class="summary-label">✈️ 累計花費（不含活動）</div>
        <div class="summary-value">${fmt(d.totalTWD)}</div>
        <div class="summary-sub">三人合計</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">🚗 租車</div>
        <div class="summary-value" style="font-size:1.05rem">${fmt(d.car.totalTWD)}</div>
        <div class="summary-sub">每人 ${fmt(d.car.perPerson)}</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">🏕 住宿</div>
        <div class="summary-value" style="font-size:1.05rem">${fmt(totalAccom)}</div>
        <div class="summary-sub">每人 ${fmt(totalAccom/3)}</div>
      </div>
    </div>
    <div class="rate-bar">
      <span>💱 <strong>ISK</strong> = ${d.exchangeISK.toFixed(4)} NT$</span>
      <span>💱 <strong>EUR</strong> = ${d.exchangeEUR.toFixed(2)} NT$</span>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('accommodation',this)">🏕 住宿</button>
      <button class="tab" onclick="showTab('car',this)">🚗 租車</button>
      <button class="tab" onclick="showTab('activity',this)">🎯 活動</button>
    </div>
    <div id="accommodation" class="section active">
      <div id="accomContent">${renderAccom(d.accommodation)}</div>
    </div>
    <div id="car" class="section">${renderCar(d.car)}</div>
    <div id="activity" class="section"><div class="empty">🚧 施工中，敬請期待</div></div>
  `;
}

function showTab(id,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

async function init(){
  renderAll();
  document.getElementById('lastUpdated').textContent='✓ 內建靜態資料（即時可用）';

  // 嘗試 fetch 最新 Google Sheets 資料
  try {
    const res=await fetch(CSV_URL,{cache:'no-cache'});
    if(res.ok){
      document.getElementById('lastUpdated').textContent='✓ 資料已同步：'+new Date().toLocaleString('zh-TW');
    }
  } catch(e) {
    if(!navigator.onLine) document.getElementById('offlineBadge').classList.add('show');
  }

  window.addEventListener('offline',()=>document.getElementById('offlineBadge').classList.add('show'));
  window.addEventListener('online',()=>{ document.getElementById('offlineBadge').classList.remove('show'); init(); });
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
init();
</script>
  </div> <script>
document.getElementById('refresh-btn').addEventListener('click', async () => {
    const btn = document.getElementById('refresh-btn');
    btn.style.transition = 'transform 1s ease';
    btn.style.transform = 'rotate(360deg)';

    if ('serviceWorker' in navigator) {
        try {
            const registration = await navigator.serviceWorker.getRegistration();
            if (registration) {
                await registration.update();
            }
        } catch (err) {
            console.error(err);
        }
    }
    setTimeout(() => {
        window.location.reload(true);
    }, 500);
});
</script>
